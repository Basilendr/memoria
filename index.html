function graphiqueActiviteHtml(historique, jours = 14){
  const aujourdhui = new Date(); aujourdhui.setHours(0,0,0,0);
  const points = [];
  for (let i = jours - 1; i >= 0; i--) {
    const jour = new Date(aujourdhui); jour.setDate(jour.getDate() - i);
    const iso = Utils.versDateISO(jour);
    const n = historique.filter(h => Utils.versDateISO(h.date) === iso).length;
    points.push({ iso, jour, n });
  }
  const max = Math.max(1, ...points.map(p => p.n));
  const largeur = 320, hauteur = 90, largeurBarre = largeur / jours - 4;
  const barres = points.map((p, i) => {
    const h = Math.round((p.n / max) * (hauteur - 16));
    return `<rect x="${i*(largeurBarre+4)}" y="${hauteur-h}" width="${largeurBarre}" height="${Math.max(h,2)}" rx="2" fill="var(--primaire)" opacity="${p.n?1:.25}"><title>${Utils.formaterDateCourte(p.jour)} : ${p.n}</title></rect>`;
  }).join("");
  return `<svg class="graphique-svg" viewBox="0 0 ${largeur} ${hauteur+16}">${barres}<line class="axe" x1="0" y1="${hauteur}" x2="${largeur}" y2="${hauteur}"/></svg>`;
}

const PageStats = {
  rendre(){
    const principal = document.getElementById("contenu-principal");
    const notions = Selecteurs.toutesNotionsValidees();
    if (!notions.length) { principal.innerHTML = carteVide("graphique", "Pas encore de statistiques", "Commence à réviser pour voir ta progression."); return; }
    const compte = { rouge:0, orange:0, jaune:0, vert:0, bleu:0 };
    notions.forEach(n => compte[n.progression.statut]++);
    const moyenneGenerale = Math.round(notions.reduce((s,n) => s+n.progression.maitriseActuelle,0)/notions.length);
    const historique = Etat.donnees.historique;
    const tauxReussite = historique.length ? Math.round(100 * historique.filter(h => h.resultat===true).length / historique.length) : 0;
    const tempsTotal = Etat.donnees.sessions.reduce((s,ses) => s+(ses.dureeSecondes||0), 0);

    const parMatiere = Etat.donnees.matieres.map(m => {
      const notionsM = Selecteurs.coursDeMatiere(m.id).flatMap(c => Selecteurs.notionsValideesDeCours(c.id));
      const moy = notionsM.length ? Math.round(notionsM.reduce((s,n)=>s+n.progression.maitriseActuelle,0)/notionsM.length) : 0;
      return { m, moy, n: notionsM.length };

function redimensionnerImage(fichier, taille = 160){
  return new Promise((resoudre, rejeter) => {
    const img = new Image();
    img.onload = () => {
      const canvas = document.createElement("canvas");
      canvas.width = taille; canvas.height = taille;
      const ctx = canvas.getContext("2d");
      const cote = Math.min(img.width, img.height);
      ctx.drawImage(img, (img.width-cote)/2, (img.height-cote)/2, cote, cote, 0, 0, taille, taille);
      resoudre(canvas.toDataURL("image/jpeg", 0.85));
    };
    img.onerror = rejeter;
    img.src = URL.createObjectURL(fichier);
  });
}

const Gamification = {
  async surSessionTerminee(){
    const aujourdhui = Utils.versDateISO(new Date());
    const hier = Utils.versDateISO(new Date(Date.now() - JOUR));
    let streak = Etat.profil.streak || 0;
    if (Etat.profil.dernierJourActif === aujourdhui) { /* déjà compté aujourd'hui */ }
    else if (Etat.profil.dernierJourActif === hier) streak += 1;
    else streak = 1;
    const gainXp = PageSession.stats.reussites * 10 + PageSession.stats.partiels * 5;
    await Store.sauvegarderProfil({ streak, dernierJourActif: aujourdhui, xp: (Etat.profil.xp || 0) + gainXp });
    const nb = PageSession.estDrill() ? PageSession.totalDrill : PageSession.file.length;
    await Store.ajouter("notifications", { destinataireId: Etat.uid, type: "SESSION_TERMINEE", titre: "Session terminée", description: `${nb} notion${nb>1?"s":""} révisée${nb>1?"s":""}.`, lu: false });
  },
};

const Rappels = {
  _minuteur: null,
  demarrer(){
    if (Rappels._minuteur) return;
    Rappels.verifier();
    Rappels._minuteur = setInterval(Rappels.verifier, MINUTE);
  },
  async verifier(){
    if (!Etat.profil?.rappelsActifs) return;
    const maintenant = new Date();
    // "Jours de semaine seulement" (§57) : 0=dimanche, 6=samedi.
    if (Etat.profil.frequenceRappel === "semaine" && [0,6].includes(maintenant.getDay())) return;
    const hhmm = maintenant.toTimeString().slice(0,5);
    const aujourdhui = Utils.versDateISO(maintenant);
    if (hhmm === (Etat.profil.heureRappel || "18:00") && Etat.profil.dernierRappelEnvoye !== aujourdhui) {
      const dues = Revision.fileDeRevision().length;
      if (dues) {
        await Store.ajouter("notifications", { destinataireId: Etat.uid, type: "TASK_REMINDER", titre: "Révisions du jour", description: `Tu as ${dues} notion${dues>1?"s":""} à revoir aujourd'hui.`, lu: false });
        Coquille.majNavigationActive();
      }
      await Store.sauvegarderProfil({ dernierRappelEnvoye: aujourdhui });
    }
  },
};

const Demo = {
  async creerDonneesExemple(){
    if (Etat.donnees.cours.some(c => /r[ée]volution/i.test(c.titre))) return;
    const matiere = Etat.donnees.matieres.find(m => /histoire/i.test(m.nom)) || await Store.ajouter("matieres", { nom: "Histoire-Géo", couleur: COULEURS_MATIERE[1], icone: "carte" });
    const contenu = `# Les origines de la Révolution
La France de 1789 traverse une grave crise financière et sociale. Le royaume est divisé en trois ordres : le clergé, la noblesse et le tiers état, qui paie presque tous les impôts. Le roi Louis XVI convoque les États généraux pour tenter de résoudre la crise.

Le tiers état représente environ 98% de la population, mais ne dispose que d'une voix sur trois lors des votes. Cette injustice provoque une colère grandissante.

# 1789 : l'année de la rupture
Le 17 juin 1789, les députés du tiers état se proclament Assemblée nationale, affirmant représenter la Nation tout entière.

La prise de la Bastille a lieu le 14 juillet 1789. Cette prison-forteresse parisienne symbolise l'arbitraire royal. Sa chute marque le début de la Révolution française et devient plus tard la fête nationale.

La Déclaration des droits de l'homme et du citoyen est adoptée le 26 août 1789. Ce texte proclame que les hommes naissent libres et égaux en droits. Elle inspire encore aujourd'hui nos droits fondamentaux.

# Louis XVI et la fin de la monarchie
Louis XVI est roi de France depuis 1774. Son indécision face à la crise et sa tentative de fuite à Varennes en 1791 affaiblissent durablement son autorité.

La monarchie est abolie en 1792 parce que la confiance entre le roi et le peuple est définitivement rompue, ce qui entraîne la proclamation de la Première République. Louis XVI est exécuté en janvier 1793.

# Les grandes étapes de la Révolution
Voici les grandes étapes du processus révolutionnaire :
- 1789 : réunion des États généraux et prise de la Bastille
- 1791 : première constitution française
- 1792 : proclamation de la République
- 1793 : exécution de Louis XVI
- 1799 : coup d'État de Napoléon Bonaparte

Le mot sans-culottes désigne les révolutionnaires populaires parisiens, ainsi nommés parce qu'ils portaient un pantalon plutôt que la culotte aristocratique.`;
    const cours = await Store.ajouter("cours", { titre: "La Révolution française", matiereId: matiere.id, contenu, favori: true, archive: false });
    const decoupage = decouperChapitres(contenu);
    const chapitresCrees = [];
    for (const [i, ch] of decoupage.entries()) {
      const doc = await Store.ajouter("chapitres", { coursId: cours.id, titre: ch.titre, ordre: i });
      chapitresCrees.push({ ...doc, texte: ch.texte });
    }
    const candidats = Analyseur.analyser(contenu);
    const notionsCreees = [];
    for (const c of candidats) {
      const chapitreId = trouverChapitrePourNotion(chapitresCrees, c);
      const doc = await Store.ajouter("notions", { ...c, coursId: cours.id, matiereId: matiere.id, chapitreId, statutValidation: "gardee", progression: Revision.progressionInitiale() });
      notionsCreees.push(doc);
    }
    for (const [i, n] of notionsCreees.entries()) {
      const nbRevisions = i % 4;
      let prog = n.progression;
      for (let r = 0; r < nbRevisions; r++) {
        const correct = Math.random() > (i % 5 === 0 ? 0.7 : 0.15);
        prog = Revision.calculerRevisionSuivante({ ...n, progression: prog }, { correct, typeExercice: "qcm", indiceUtilise: 0, confiance: correct ? "savais" : "aucune" });
        const dateFictive = new Date(Date.now() - (nbRevisions - r) * 3 * JOUR).toISOString();
        await Store.ajouter("historique", { notionId: n.id, date: dateFictive, typeExercice: "qcm", resultat: correct, elementsManques: [], indiceUtilise: 0, confiance: correct ? "savais" : "aucune" });
      }
      if (nbRevisions > 0) await Store.modifier("notions", n.id, { progression: prog });
    }
    await Store.ajouter("controles", { nom: "Contrôle d'histoire", date: Utils.versDateISO(new Date(Date.now() + 12 * JOUR)) });
    Toast.succes("Cours d'exemple ajouté !");
  },
};

// Écouteur global unique pour toutes les actions génériques (navigation, thème,
// menus, session) — les interactions propres à un exercice ou un formulaire
// restent attachées directement dans leur page (voir sections G), ce projet étant
// trop petit pour justifier un registre GESTIONNAIRES/ACTIONS complet comme
// VieEnFamille (où la contrainte venait d'un bug de bulles dans le calendrier).
document.addEventListener("click", (e) => {
  if (!e.target.closest(".menu-deroulant")) {
    document.querySelectorAll(".menu-deroulant").forEach(m => { if (!m.contains(e.target)) m.remove(); });
  }
  const cible = e.target.closest("[data-action]");
  if (!cible) return;
  const action = cible.dataset.action;
  if (action === "aller") { e.preventDefault(); Routeur.aller(cible.dataset.route); }
  else if (action === "recherche-globale") ouvrirRechercheGlobale();
  else if (action === "basculer-theme") Coquille.basculerTheme();
  else if (action === "notifications") Coquille.ouvrirNotifications(cible);
  else if (action === "menu-profil") Coquille.ouvrirMenuProfil(cible);
  else if (action === "deconnexion") Auth.deconnecter();
  else if (action === "commencer-session") PageSession.demarrer(cible.dataset.mode);
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Escape") return;
  if (Modale.pile.length) Modale.fermer();
  else document.querySelectorAll(".menu-deroulant").forEach(m => m.remove());
});

async function demarrer(){
  Theme.init();
  enregistrerRoutes();
  await Auth.demarrer();
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("sw.js").catch(() => {});
    // Dès qu'une nouvelle version du service worker prend le contrôle (nouveau
    // déploiement détecté), on recharge automatiquement — sans ça, un onglet déjà
    // ouvert continue d'afficher une version figée tant qu'il n'est pas rechargé
    // manuellement, ce qui ressemble exactement à "le site n'est jamais à jour".
    let dejaRecharge = false;
    navigator.serviceWorker.addEventListener("controllerchange", () => {
      if (dejaRecharge) return;
      dejaRecharge = true;
      location.reload();
    });
  }
}
demarrer();
