/* ==================== G6. SESSION D'EXERCICES ==================== */
const PageSession = {
  file: [], fileOriginale: [], index: 0, mode: "", coursId: null, stats: null, exerciceActuel: null, indiceNiveau: 0, decouverteVues: new Set(),
  etatDrill: {}, totalDrill: 0, dossierValidationCible: null, modePedagogique: false, etatSequence: {}, etapeActuelle: null,

  // "apprendre" (notions neuves) et "interrogation" (un dossier entier, sans tenir compte
  // des dates dues) partagent le moteur "drill" : on boucle sur CHAQUE notion avec des
  // exercices variés jusqu'à ce que l'utilisateur dise "je connais", auquel cas une
  // réécriture complète sert de confirmation finale — une seule bonne réponse ne suffit
  // jamais (§64 : ne pas laisser 100% sur un simple QCM). "apprentissage" (apprendre en
  // profondeur) et "reviser" utilisent un moteur différent, à séquence fixe — voir estSequence().
  estDrill(){ return PageSession.mode === "apprendre" || PageSession.mode === "interrogation"; },
  // "apprentissage" (15 étapes environ, notions neuves) et "reviser" (10 étapes environ,
  // notions déjà vues et dues) partagent ce second moteur : une séquence de PLUSIEURS
  // exercices construite une fois par notion (PageSession.construireSequence), qu'on
  // parcourt étape par étape jusqu'à une restitution finale sans aide — jamais un simple
  // "je connais/je continue" laissé à l'appréciation de l'utilisateur.
  estSequence(){ return PageSession.mode === "apprentissage" || PageSession.mode === "reviser"; },

  // Point d'entrée commun à tous les boutons "Apprendre" : on demande d'abord si
  // l'utilisateur veut le format habituel (rapide, existant, inchangé) ou le format
  // pédagogique ralenti — plutôt que de trancher à sa place.
  demarrerApprendre(opts = {}){
    Modale.ouvrir(`
      <div class="entete-modale"><h3>Réviser ou apprendre ?</h3></div>
      <p class="texte-2 mb-md">Comment veux-tu travailler ces notions ?</p>
      <div class="flex-col gap-sm">
        <button type="button" class="bouton bouton-contour" style="text-align:left;height:auto;padding:var(--espace-md);white-space:normal" data-choix="apprendre">
          <div class="texte-semi">${icono("cerveau","icone-sm")} Réviser rapidement</div>
          <div class="texte-2 texte-petit mt-xs">Le format habituel : des exercices variés qui s'enchaînent vite.</div>
        </button>
        <button type="button" class="bouton bouton-primaire" style="text-align:left;height:auto;padding:var(--espace-md);white-space:normal" data-choix="apprentissage">
          <div class="texte-semi">${icono("livre_ouvert","icone-sm")} Apprendre en profondeur</div>
          <div class="texte-2 texte-petit mt-xs" style="opacity:.9">Plus posé : environ 15 étapes progressives, avec relectures et récapitulatifs.</div>
        </button>
      </div>
      <button class="bouton bouton-fantome bouton-large mt-md" data-fermer>Annuler</button>
    `, { classe: "modale-formulaire" });
    const modaleEl = Modale.pile[Modale.pile.length - 1].el;
    modaleEl.querySelector("[data-fermer]").addEventListener("click", () => Modale.fermer());
    modaleEl.querySelectorAll("[data-choix]").forEach(b => b.addEventListener("click", () => {
      const mode = b.dataset.choix;
      Modale.fermer();
      PageSession.demarrer(mode, opts);
    }));
  },

  // Règle centrale : rien n'est jamais définitivement verrouillé. Une notion déjà maîtrisée
  // reste "apprendre"/"apprentissage" pour les entrées BULK (découvrir de nouvelles notions,
  // apprendre tout un paquet) — sinon la progression que ces boutons donnent n'aurait plus
  // aucun sens. Mais quand l'utilisateur choisit explicitement UNE notion précise (bouton
  // "Réapprendre" / "Réviser maintenant" sur sa fiche), `opts.forcer` court-circuite le
  // filtre étapeIndex/date-due : la progression et l'historique existants ne sont jamais
  // réinitialisés pour autant (`Revision.calculerRevisionSuivante` part toujours de l'état
  // courant), c'est juste une nouvelle tentative, comme n'importe quelle autre session.
  demarrer(mode, opts = {}){
    let base = opts.notions || (opts.coursId ? Selecteurs.notionsDeCours(opts.coursId) : Selecteurs.toutesNotionsValidees());
    let notions;
    if (opts.forcer && (mode === "apprendre" || mode === "apprentissage" || mode === "reviser")) notions = base;
    else if (mode === "apprendre" || mode === "apprentissage") notions = base.filter(n => n.progression.etapeIndex === 0);
    else if (mode === "interrogation") notions = base;
    else if (mode === "reviser") notions = Revision.fileDeRevision(base);
    else if (mode === "rapide") notions = Revision.choisirPourDuree(opts.minutes || 10, base);
    else if (mode === "erreurs") notions = Revision.notionsFragiles(base);
    else notions = base;

    if (!notions.length) {
      const message = (mode === "apprendre" || mode === "apprentissage") ? "Aucune nouvelle notion à découvrir." : mode === "interrogation" ? "Ce dossier ne contient aucune notion." : "Rien à réviser pour le moment !";
      Toast.afficher(message, "info");
      Routeur.aller(opts.coursId ? `cours/${opts.coursId}` : "reviser");
      return;
    }
    // Chaque notion d'une séquence pédagogique prend ~10-15 exercices : un lot de 30 comme
    // pour le drill classique tournerait des heures. On reste volontairement petit (8-10).
    const plafond = mode === "apprentissage" ? 8 : mode === "reviser" ? 10 : mode === "apprendre" ? 30 : notions.length;
    PageSession.file = Utils.melanger(notions).map(n => n.id).slice(0, plafond);
    PageSession.fileOriginale = [...PageSession.file]; // snapshot pour "Recommencer" sur l'écran de fin (PageSession.file est vidé au fil de la session)
    PageSession.index = 0; PageSession.mode = mode; PageSession.coursId = opts.coursId || null;
    PageSession.decouverteVues = new Set();
    PageSession.modePedagogique = mode === "apprentissage";
    PageSession.stats = { debut: Date.now(), reussites: 0, echecs: 0, partiels: 0, aRetravailler: [], notionsMaitrisees: 0 };
    PageSession.etatDrill = {}; PageSession.etatSequence = {}; PageSession.totalDrill = 0; PageSession.dossierValidationCible = null;
    if (PageSession.estDrill()) {
      PageSession.file.forEach(id => { PageSession.etatDrill[id] = { typesUtilises: new Set(), demandeReecriture: false }; });
      PageSession.totalDrill = PageSession.file.length;
      if (mode === "interrogation") PageSession.dossierValidationCible = opts.chapitreId ? { type: "chapitres", id: opts.chapitreId } : opts.coursId ? { type: "cours", id: opts.coursId } : null;
    } else if (PageSession.estSequence()) {
      PageSession.file.forEach(id => { PageSession.etatSequence[id] = { sequence: null, pos: 0, remediationFaite: false }; });
      PageSession.totalDrill = PageSession.file.length;
    }
    Routeur.aller("session/actif");
  },

  notionActuelle(){ return Selecteurs.notion(PageSession.file[PageSession.index]); },

  rendre(){
    if (PageSession.estDrill()) { PageSession.rendreDrill(); return; }
    if (PageSession.estSequence()) { PageSession.rendreSequence(); return; }
    if (PageSession.index >= PageSession.file.length) { PageSession.terminer(); return; }
    const notion = PageSession.notionActuelle();
    if (!notion || notion.statutValidation !== "gardee") { PageSession.index++; PageSession.rendre(); return; }
    if (notion.progression.etapeIndex === 0 && !PageSession.decouverteVues.has(notion.id)) { PageSession.rendreDecouverte(notion); return; }
    PageSession.exerciceActuel = Moteur.genererExercice(notion);
    PageSession.indiceNiveau = 0;
    PageSession.rendreExercice(notion, PageSession.exerciceActuel);
  },

  rendreDrill(){
    if (!PageSession.file.length) { PageSession.terminer(); return; }
    if (PageSession.index >= PageSession.file.length) PageSession.index = 0;
    const id = PageSession.file[PageSession.index];
    const notion = Selecteurs.notion(id);
    if (!notion || notion.statutValidation !== "gardee") { PageSession.file.splice(PageSession.index, 1); delete PageSession.etatDrill[id]; PageSession.rendreDrill(); return; }
    if (PageSession.mode === "apprendre" && notion.progression.etapeIndex === 0 && !PageSession.decouverteVues.has(id)) { PageSession.rendreDecouverte(notion); return; }
    const etat = PageSession.etatDrill[id];
    const type = etat.demandeReecriture ? "reecriture" : PageSession.choisirTypeDrill(notion, etat);
    PageSession.exerciceActuel = Moteur.genererExercice(notion, type);
    etat.typesUtilises.add(PageSession.exerciceActuel.type);
    PageSession.indiceNiveau = 0;
    PageSession.rendreExercice(notion, PageSession.exerciceActuel);
  },

  // Ne répète jamais un type déjà vu pour CETTE notion tant qu'il en reste un nouveau à
  // essayer (c'est précisément ce qui manquait : avant, une notion neuve ne recevait
  // jamais qu'un seul QCM avant de passer à la suivante).
  choisirTypeDrill(notion, etat){
    const ordre = ["qcm", "vrai_faux", "texte_trous", "association", "ordre", "reponse_libre"];
    let candidats = ordre.filter(t => !etat.typesUtilises.has(t));
    if (!candidats.length) candidats = ordre;
    for (const t of Utils.melanger(candidats)) {
      if (Moteur.genererExercice(notion, t).type === t) return t;
    }
    return "reponse_libre";
  },

  enveloppe(contenuHtml){
    let pct, compteur;
    if (PageSession.estDrill() || PageSession.estSequence()) {
      const total = PageSession.totalDrill || PageSession.file.length || 1;
      const faites = PageSession.stats.notionsMaitrisees || 0;
      pct = Math.round((faites / total) * 100);
      compteur = `${faites}/${total}`;
    } else {
      pct = Math.round((PageSession.index / PageSession.file.length) * 100);
      compteur = `${PageSession.index+1}/${PageSession.file.length}`;
    }
    return `<div class="enveloppe-session">
      <div class="entete-session">
        <button class="bouton-icone" data-action="aller" data-route="${PageSession.coursId ? "cours/"+PageSession.coursId : "reviser"}" aria-label="Quitter la session">${icono("croix")}</button>
        ${barreProgressionHtml(pct)}
        <span class="texte-petit texte-2">${compteur}</span>
      </div>
      ${contenuHtml}
    </div>`;
  },

  rendreDecouverte(notion){
    const principal = document.getElementById("contenu-principal");
    const pedagogique = PageSession.mode === "apprentissage";
    principal.innerHTML = PageSession.enveloppe(`
      <div class="carte-question texte-centre">
        <span class="badge badge-neutre" style="align-self:center">Nouvelle notion</span>
        <h2 class="mt-md">${Utils.echapperHtml(notion.titre)}</h2>
        <p class="texte-2 mt-sm">${pedagogique ? "Prends vraiment le temps de bien lire — relis plusieurs fois si besoin, rien ne presse." : "Essaie de retenir les éléments suivants :"}</p>
        <ul class="flex-col gap-xs mt-md" style="text-align:left;max-width:340px;margin:0 auto">
          ${(notion.elements?.length ? notion.elements : [notion.reponse]).map(e => `<li class="flex items-centre gap-sm">${icono("coche","icone-sm")}<span>${Utils.echapperHtml(e)}</span></li>`).join("")}
        </ul>
        <p class="texte-2 texte-petit mt-md">${Utils.echapperHtml(notion.reponse)}</p>
        <button class="bouton bouton-primaire bouton-lg mt-lg" data-a-toi>${pedagogique ? "J'ai bien lu, je suis prêt(e)" : "À toi !"}</button>
      </div>`);
    principal.querySelector("[data-a-toi]").addEventListener("click", () => { PageSession.decouverteVues.add(notion.id); PageSession.rendre(); });
  },

  // -- G6b. Séquences pédagogiques : "apprentissage" (15 étapes) et "reviser" (10 étapes) --
  // Construit UNE FOIS la séquence propre à cette notion à partir du modèle général :
  // saute les étapes non pertinentes (§27 — pas de reconstruction sans ≥3 éléments, pas
  // d'association seul dans son cours...), et insère un écran de récapitulatif juste avant
  // chaque étape de restitution complète (recapAvant), moment le plus exigeant de la séquence.
  construireSequence(notion, modele){
    const etapes = [];
    modele.filter(e => !e.applicable || e.applicable(notion)).forEach((e) => {
      if (e.recapAvant) etapes.push({ ecran: "recap", modele: e });
      etapes.push(e);
    });
    if (PageSession.mode === "apprentissage") etapes.unshift({ ecran: "transition" });
    return etapes;
  },

  // Étape de remédiation insérée à la volée quand la restitution finale échoue (§17) : cible
  // précisément ce qui a été oublié, plutôt que de tout recommencer depuis le début.
  etapeRemediation(elementsManques){
    if (elementsManques?.length) return { cle: "travail_cible", libelle: "Travail ciblé", type: "texte_trous", forcerMots: elementsManques.slice(0,3), indiceLettres: 1, pourquoi: "On retravaille juste ce qui t'a échappé." };
    return { cle: "travail_cible", libelle: "Travail ciblé", type: "reponse_libre", pourquoi: "On retente un rappel complet avant de réessayer." };
  },

  rendreSequence(){
    if (!PageSession.file.length) { PageSession.terminer(); return; }
    if (PageSession.index >= PageSession.file.length) PageSession.index = 0;
    const id = PageSession.file[PageSession.index];
    const notion = Selecteurs.notion(id);
    if (!notion || notion.statutValidation !== "gardee") { PageSession.file.splice(PageSession.index, 1); delete PageSession.etatSequence[id]; PageSession.rendreSequence(); return; }
    if (PageSession.mode === "apprentissage" && notion.progression.etapeIndex === 0 && !PageSession.decouverteVues.has(id)) { PageSession.rendreDecouverte(notion); return; }
    const etat = PageSession.etatSequence[id];
    if (!etat.sequence) etat.sequence = PageSession.construireSequence(notion, PageSession.mode === "apprentissage" ? SEQUENCE_APPRENTISSAGE : SEQUENCE_REVISION);
    if (etat.pos >= etat.sequence.length) { PageSession.notionSequenceTerminee(notion, etat, true); return; }
    const etape = etat.sequence[etat.pos];
    if (etape.ecran === "transition") { PageSession.rendreTransitionSequence(notion, etat); return; }
    if (etape.ecran === "recap") { PageSession.rendreRecapEtape(notion, etat, etape.modele); return; }
    if (etape.ecran === "recap-echec") { PageSession.rendreRecapEchec(notion, etat, etape.elementsManques); return; }
    PageSession.genererEtRendreEtape(notion, etat, etape);
  },

  rendreTransitionSequence(notion, etat){
    const principal = document.getElementById("contenu-principal");
    principal.innerHTML = PageSession.enveloppe(`
      <div class="carte-question texte-centre">
        <span class="badge badge-neutre" style="align-self:center">${icono("livre_ouvert","icone-xs")} Apprentissage en profondeur</span>
        <h2 class="mt-md">On y va doucement</h2>
        <p class="texte-2 mt-sm">Pour « ${Utils.echapperHtml(notion.titre)} », voici comment ça va se passer :</p>
        <ul class="flex-col gap-xs mt-md" style="text-align:left;max-width:340px;margin:0 auto">
          <li class="flex items-centre gap-sm">${icono("coche","icone-sm")}<span>Une petite quinzaine d'étapes, du plus simple au plus difficile</span></li>
          <li class="flex items-centre gap-sm">${icono("coche","icone-sm")}<span>Une correction détaillée après chacune, sans pénalité</span></li>
          <li class="flex items-centre gap-sm">${icono("coche","icone-sm")}<span>Un récapitulatif avant chaque test de mémoire complet</span></li>
        </ul>
        <button class="bouton bouton-primaire bouton-lg mt-lg" data-continuer>Commencer les exercices</button>
      </div>`);
    principal.querySelector("[data-continuer]").addEventListener("click", () => { etat.pos++; PageSession.rendreSequence(); });
  },

  // Récapitulatif complet juste avant une étape de restitution (réécriture/restitution finale
  // ou complète) — le moment le plus exigeant de la séquence, donc une dernière relecture
  // ciblée juste avant plutôt que d'enchaîner directement dessus.
  rendreRecapEtape(notion, etat, etapeSuivante){
    const principal = document.getElementById("contenu-principal");
    principal.innerHTML = PageSession.enveloppe(`
      <div class="carte-question texte-centre">
        <span class="badge badge-vert" style="align-self:center">${icono("coche_cercle","icone-xs")} Récapitulatif</span>
        <h2 class="mt-md">${Utils.echapperHtml(notion.titre)}</h2>
        <p class="texte-2 mt-sm">Dernière relecture avant le test — tu vas devoir tout réécrire de mémoire juste après.</p>
        <ul class="flex-col gap-xs mt-md" style="text-align:left;max-width:340px;margin:0 auto">
          ${(notion.elements?.length ? notion.elements : [notion.reponse]).map(e => `<li class="flex items-centre gap-sm">${icono("coche","icone-sm")}<span>${Utils.echapperHtml(e)}</span></li>`).join("")}
        </ul>
        <p class="texte-2 texte-petit mt-md">${Utils.echapperHtml(notion.reponse)}</p>
        <button class="bouton bouton-primaire bouton-lg mt-lg" data-continuer>${etapeSuivante.libelle==="Réécriture"||etapeSuivante.libelle==="Restitution finale"||etapeSuivante.libelle==="Restitution complète" ? "Je suis prêt(e), je réécris tout" : "Continuer"}</button>
      </div>`);
    principal.querySelector("[data-continuer]").addEventListener("click", () => { etat.pos++; PageSession.rendreSequence(); });
  },

  // Écran affiché quand une restitution finale échoue, juste avant l'étape de remédiation
  // ciblée insérée dynamiquement — annonce clairement ce qui va être retravaillé plutôt que
  // de repartir directement sur un nouvel exercice sans explication.
  rendreRecapEchec(notion, etat, elementsManques){
    const principal = document.getElementById("contenu-principal");
    principal.innerHTML = PageSession.enveloppe(`
      <div class="carte-question texte-centre">
        <span class="badge badge-orange" style="align-self:center">${icono("alerte_triangle","icone-xs")} Pas encore tout à fait</span>
        <h2 class="mt-md">On retravaille un point précis</h2>
        ${elementsManques.length ? `<p class="texte-2 mt-sm">Il te manquait :</p><div class="liste-elements-verifies mt-xs">${elementsManques.map(e => `<span class="element-verifie oublie">${icono("croix","icone-xs")}${Utils.echapperHtml(e)}</span>`).join("")}</div>` : `<p class="texte-2 mt-sm">Reprenons cette définition ensemble, une dernière fois.</p>`}
        <button class="bouton bouton-primaire bouton-lg mt-lg" data-continuer>Continuer</button>
      </div>`);
    principal.querySelector("[data-continuer]").addEventListener("click", () => { etat.pos++; PageSession.rendreSequence(); });
  },

  genererEtRendreEtape(notion, etat, etape){
    const opts = {};
    if (etape.indiceLettres !== undefined) opts.indiceLettres = etape.indiceLettres;
    if (etape.nbTrousMax) opts.nbTrousMax = true;
    if (etape.forcerMots) opts.forcerMots = etape.forcerMots;
    if (etape.forcerElementsOublies) opts.forcerMots = (notion.progression.elementsOublies || []).slice(0, 3);
    if (etape.motsCles) opts.motsCles = true;
    const exercice = Moteur.genererExercice(notion, etape.type, opts);
    PageSession.exerciceActuel = exercice;
    PageSession.indiceNiveau = 0;
    PageSession.etapeActuelle = etape;
    PageSession.rendreExercice(notion, exercice);
  },

  async resoudreSequence(notion, exercice, resultat){
    const etat = PageSession.etatSequence[notion.id];
    const etape = PageSession.etapeActuelle;
    const confiance = resultat.correct === true ? "savais" : resultat.correct === "partiel" ? "hesitation" : "aucune";
    await PageSession.enregistrerResultat(notion, exercice, resultat, confiance);

    const estRestitution = etape.type === "reecriture";
    if (estRestitution) {
      if (resultat.correct === true) { PageSession.notionSequenceTerminee(notion, etat, true); return; }
      // Un seul essai de remédiation ciblée avant d'accepter le résultat (§17-18) : jamais
      // de boucle infinie sur une même notion.
      if (!etat.remediationFaite) {
        etat.remediationFaite = true;
        const manques = resultat.elementsManques || [];
        etat.sequence.splice(etat.pos, 0, { ecran: "recap-echec", elementsManques: manques }, PageSession.etapeRemediation(manques));
        PageSession.rendreSequence();
        return;
      }
      PageSession.notionSequenceTerminee(notion, etat, false);
      return;
    }

    if (resultat.correct !== true) PageSession.stats.aRetravailler.push(notion.id);
    // Adaptatif (§18) : une réussite franche, sans indice, permet parfois de sauter l'étape
    // suivante — moins d'aide, plus de rappel actif — sauf juste avant un récapitulatif, et
    // jamais après un "travail ciblé" (la restitution qui suit doit toujours être retentée).
    const prochaine = etat.sequence[etat.pos + 1];
    const peutSauter = resultat.correct === true && PageSession.indiceNiveau === 0 && etape.cle !== "travail_cible"
      && prochaine && prochaine.ecran !== "recap" && prochaine.ecran !== "transition";
    etat.pos += (peutSauter && Math.random() < 0.4) ? 2 : 1;
    PageSession.rendreSequence();
  },

  notionSequenceTerminee(notion, etat, reussite){
    if (reussite) {
      PageSession.stats.notionsMaitrisees = (PageSession.stats.notionsMaitrisees || 0) + 1;
      (PageSession.stats.notionsMaitriseesIds ||= []).push(notion.id);
      Toast.succes(`« ${notion.titre} » ${PageSession.mode === "apprentissage" ? "apprise" : "renforcée"} !`);
    } else {
      PageSession.stats.aRetravailler.push(notion.id);
    }
    PageSession.file.splice(PageSession.index, 1);
    delete PageSession.etatSequence[notion.id];
    PageSession.rendreSequence();
  },

  rendreExercice(notion, exercice){
    const principal = document.getElementById("contenu-principal");
    let corpsHtml = "";
    if (exercice.type === "qcm") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.enonce)}</div><div class="liste-options" data-options>
        ${exercice.donnees.options.map((o,i) => `<button type="button" class="option-reponse" data-option="${i}"><span class="lettre-option">${String.fromCharCode(65+i)}</span><span>${Utils.echapperHtml(o)}</span></button>`).join("")}
      </div>`;
    } else if (exercice.type === "vrai_faux") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.donnees.affirmation)}</div><div class="liste-options" data-options>
        <button type="button" class="option-reponse" data-option="true"><span class="lettre-option">V</span><span>Vrai</span></button>
        <button type="button" class="option-reponse" data-option="false"><span class="lettre-option">F</span><span>Faux</span></button>
      </div>`;
    } else if (exercice.type === "texte_trous") {
      const rendu = exercice.donnees.segments.map(seg => /^\d+$/.test(seg) && exercice.donnees.reponses[seg] !== undefined ? `<input type="text" class="trou-input" data-trou="${seg}" autocomplete="off">` : Utils.echapperHtml(seg)).join("");
      corpsHtml = `<div class="enonce-question">Complète le texte</div><div class="trous-texte">${rendu}</div>
        <button class="bouton bouton-primaire bouton-large mt-lg" data-valider>Valider</button>`;
    } else if (exercice.type === "identification") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.enonce)}</div>
        <div class="liste-options" data-options-identification>${exercice.donnees.options.map((o,i) => `<button type="button" class="option-reponse" data-identif="${i}">${Utils.echapperHtml(o)}</button>`).join("")}</div>
        <button class="bouton bouton-primaire bouton-large mt-lg" data-valider>Valider ma sélection</button>`;
    } else if (exercice.type === "reponse_libre" || exercice.type === "reecriture") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.type==="reecriture" ? notion.titre : exercice.enonce)}</div>
        ${exercice.type==="reecriture" ? `<p class="consigne-rappel">Écris la définition complète, de mémoire.</p>` : `<p class="consigne-rappel">Essaie de retrouver tout ce que tu sais, sans regarder le cours.</p>`}
        <div class="zone-reponse-libre"><textarea class="champ" data-reponse-libre placeholder="Écris ce dont tu te souviens..."></textarea>
        <div class="barre-indice"><button class="bouton bouton-sm bouton-fantome" data-indice>${icono("ampoule","icone-sm")} Indice</button><button class="bouton bouton-primaire" data-valider>Valider</button></div>
        <div id="zoneIndice"></div></div>`;
    } else if (exercice.type === "association") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.enonce)}</div>
        <div class="grille-association">
          <div class="colonne-association" data-colonne="gauche">${exercice.donnees.paires.map(p => `<button type="button" class="jeton-association" data-id="${p.id}" data-cote="gauche">${Utils.echapperHtml(p.gauche)}</button>`).join("")}</div>
          <div class="colonne-association" data-colonne="droite">${Utils.melanger(exercice.donnees.paires).map(p => `<button type="button" class="jeton-association" data-id="${p.id}" data-cote="droite">${Utils.echapperHtml(p.droite)}</button>`).join("")}</div>
        </div>
        <button class="bouton bouton-primaire bouton-large mt-lg" data-valider disabled>Valider</button>`;
    } else if (exercice.type === "ordre") {
      corpsHtml = `<div class="enonce-question">${Utils.echapperHtml(exercice.enonce)}</div>
        <div class="liste-ordre" data-liste-ordre>${exercice.donnees.ordreMelange.map((el,i) => `<div class="item-ordre" data-valeur="${Utils.echapperHtml(el)}"><span class="poignee-ordre"><button type="button" data-monter aria-label="Monter">${icono("chevron_haut","icone-sm")}</button><button type="button" data-descendre aria-label="Descendre">${icono("chevron_bas","icone-sm")}</button></span><span>${Utils.echapperHtml(el)}</span></div>`).join("")}</div>
        <button class="bouton bouton-primaire bouton-large mt-lg" data-valider>Valider cet ordre</button>`;
    }

    // En séquence pédagogique, un bandeau "Étape X / N" + le "pourquoi" de cette étape
    // précis (§24) — l'utilisateur sait toujours où il en est et pourquoi il fait cet exercice.
    const enSequence = PageSession.estSequence();
    const infoEtape = enSequence ? (() => {
      const etat = PageSession.etatSequence[notion.id];
      const etape = PageSession.etapeActuelle;
      return `<div class="info-etape-sequence mb-md">
        <div class="flex items-centre justify-entre texte-xs texte-2 mb-xs"><span>Étape ${etat.pos+1} / ${etat.sequence.length}</span></div>
        ${barreProgressionHtml(Math.round((etat.pos/etat.sequence.length)*100))}
        <p class="texte-2 texte-petit mt-xs">${Utils.echapperHtml(etape.pourquoi||"")}</p>
      </div>`;
    })() : "";

    principal.innerHTML = PageSession.enveloppe(`
      <div class="carte-question">
        ${infoEtape}
        <div class="etiquette-notion-session">${icono(TYPES_NOTION[notion.type]?.icone||"cerveau","icone-sm")}<span class="texte-petit texte-2">${Utils.echapperHtml(notion.titre)}</span><span class="badge badge-neutre" style="margin-left:auto">${TYPES_EXERCICE[exercice.type]}</span></div>
        ${corpsHtml}
      </div>
      <div id="zoneCorrection"></div>
    `);
    PageSession.attacherExercice(notion, exercice, principal);
    if (enSequence) PageSession.appliquerAidesEtape(notion, exercice, principal);
  },

  // Applique les aides propres à la séquence pédagogique, en post-traitement du rendu
  // générique ci-dessus : indice de lettres pour le texte à trous (§18/consigne finale de
  // l'utilisateur), indice auto-affiché ou bouton d'indice masqué selon l'étape.
  appliquerAidesEtape(notion, exercice, principal){
    const etape = PageSession.etapeActuelle;
    if (!etape) return;
    if (exercice.type === "texte_trous" && exercice.donnees.indiceLettres > 0) {
      principal.querySelectorAll("[data-trou]").forEach((input, i) => {
        const mot = exercice.donnees.reponses[i];
        if (mot) input.value = mot.slice(0, exercice.donnees.indiceLettres);
      });
    }
    if ((exercice.type === "reponse_libre" || exercice.type === "reecriture") && etape.sansIndice) {
      principal.querySelector("[data-indice]")?.remove();
    } else if (exercice.type === "reponse_libre" && etape.indiceAuto) {
      principal.querySelector("[data-indice]")?.click();
    }
  },

  attacherExercice(notion, exercice, principal){
    if (exercice.type === "qcm" || exercice.type === "vrai_faux") {
      principal.querySelectorAll("[data-option]").forEach(b => b.addEventListener("click", () => {
        const val = exercice.type === "vrai_faux" ? b.dataset.option === "true" : Number(b.dataset.option);
        PageSession.traiterReponse(notion, exercice, val);
      }));
      return;
    }
    if (exercice.type === "texte_trous") {
      principal.querySelector("[data-valider]").addEventListener("click", () => {
        const valeurs = [...principal.querySelectorAll("[data-trou]")].sort((a,b) => a.dataset.trou - b.dataset.trou).map(i => i.value.trim());
        PageSession.traiterReponse(notion, exercice, valeurs);
      });
      return;
    }
    if (exercice.type === "identification") {
      const choisis = new Set();
      principal.querySelectorAll("[data-identif]").forEach(b => b.addEventListener("click", () => {
        const i = Number(b.dataset.identif);
        if (choisis.has(i)) { choisis.delete(i); b.classList.remove("selectionnee"); } else { choisis.add(i); b.classList.add("selectionnee"); }
      }));
      principal.querySelector("[data-valider]").addEventListener("click", () => {
        const reponse = [...choisis].map(i => exercice.donnees.options[i]);
        PageSession.traiterReponse(notion, exercice, reponse);
      });
      return;
    }
    if (exercice.type === "reponse_libre" || exercice.type === "reecriture") {
      let indices = null;
      principal.querySelector("[data-indice]").addEventListener("click", () => {
        indices = indices || Moteur.genererIndices(notion);
        if (PageSession.indiceNiveau >= 3) return;
        document.getElementById("zoneIndice").insertAdjacentHTML("beforeend", `<div class="encadre-indice">${icono("ampoule","icone-sm")}<span>${Utils.echapperHtml(indices[PageSession.indiceNiveau])}</span></div>`);
        PageSession.indiceNiveau++;
        if (PageSession.indiceNiveau >= 3) principal.querySelector("[data-indice]").disabled = true;
      });
      principal.querySelector("[data-valider]").addEventListener("click", () => {
        const texte = principal.querySelector("[data-reponse-libre]").value.trim();
        if (!texte) return Toast.erreur("Écris une réponse avant de valider.");
        PageSession.traiterReponse(notion, exercice, texte);
      });
      return;
    }
    if (exercice.type === "association") {
      let selection = null, apparies = new Set();
      principal.querySelectorAll(".jeton-association").forEach(j => j.addEventListener("click", () => {
        if (apparies.has(j.dataset.id) && j.dataset.cote === "gauche") {} // no-op déjà apparié
        if (j.classList.contains("apparie")) return;
        if (!selection) { selection = j; j.classList.add("selectionne"); return; }
        if (selection === j) { selection.classList.remove("selectionne"); selection = null; return; }
        if (selection.dataset.cote === j.dataset.cote) { selection.classList.remove("selectionne"); selection = j; j.classList.add("selectionne"); return; }
        const bon = selection.dataset.id === j.dataset.id;
        if (bon) {
          [selection, j].forEach(el => { el.classList.remove("selectionne"); el.classList.add("apparie"); });
          apparies.add(j.dataset.id);
          if (apparies.size === exercice.donnees.paires.length) principal.querySelector("[data-valider]").disabled = false;
        } else {
          [selection, j].forEach(el => el.classList.add("erreur"));
          setTimeout(() => [selection, j].forEach(el => el.classList.remove("erreur","selectionne")), 500);
        }
        selection = null;
      }));
      principal.querySelector("[data-valider]").addEventListener("click", () => {
        const reponse = Object.fromEntries([...apparies].map(id => [id, id]));
        PageSession.traiterReponse(notion, exercice, reponse);
      });
      return;
    }
    if (exercice.type === "ordre") {
      const liste = principal.querySelector("[data-liste-ordre]");
      const rafraichirBoutons = () => {
        const items = [...liste.children];
        items.forEach((it,i) => { it.querySelector("[data-monter]").disabled = i===0; it.querySelector("[data-descendre]").disabled = i===items.length-1; });
      };
      liste.addEventListener("click", (e) => {
        const item = e.target.closest(".item-ordre"); if (!item) return;
        if (e.target.closest("[data-monter]") && item.previousElementSibling) liste.insertBefore(item, item.previousElementSibling);
        else if (e.target.closest("[data-descendre]") && item.nextElementSibling) liste.insertBefore(item.nextElementSibling, item);
        rafraichirBoutons();
      });
      rafraichirBoutons();
      principal.querySelector("[data-valider]").addEventListener("click", () => {
        const ordre = [...liste.children].map(it => it.dataset.valeur);
        PageSession.traiterReponse(notion, exercice, ordre);
      });
    }
  },

  traiterReponse(notion, exercice, reponseUtilisateur){
    const resultat = Moteur.evaluer(exercice, notion, reponseUtilisateur);
    const principal = document.getElementById("contenu-principal");
    principal.querySelectorAll("[data-option], [data-identif]").forEach(b => b.disabled = true);
    document.activeElement?.blur();
    if (exercice.type === "qcm") {
      principal.querySelectorAll("[data-option]").forEach((b,i) => {
        if (i === exercice.donnees.indexCorrect) b.classList.add("correcte");
        else if (Number(reponseUtilisateur) === i) b.classList.add("incorrecte");
      });
    } else if (exercice.type === "vrai_faux") {
      principal.querySelectorAll("[data-option]").forEach(b => {
        const estVrai = b.dataset.option === "true";
        if (estVrai === exercice.donnees.estVraie) b.classList.add("correcte");
        else if (estVrai === reponseUtilisateur) b.classList.add("incorrecte");
      });
    } else if (exercice.type === "texte_trous") {
      principal.querySelectorAll("[data-trou]").forEach((input, i) => { input.disabled = true; input.classList.add(resultat.detailTrous[i] ? "correct" : "incorrect"); if (!resultat.detailTrous[i]) input.value = exercice.donnees.reponses[i]; });
    } else if (exercice.type === "identification") {
      principal.querySelectorAll("[data-identif]").forEach((b,i) => {
        const option = exercice.donnees.options[i];
        const estBonne = exercice.donnees.bonnesReponses.includes(option);
        if (estBonne) b.classList.add("correcte");
        else if (b.classList.contains("selectionnee")) b.classList.add("incorrecte");
      });
    }
    PageSession.rendreCorrection(notion, exercice, resultat);
  },

  rendreCorrection(notion, exercice, resultat){
    const zone = document.getElementById("zoneCorrection");
    const classe = resultat.correct === true ? "correct" : resultat.correct === "partiel" ? "partiel" : "incorrect";
    const titreCorrection = classe === "correct" ? "Bien joué !" : classe === "partiel" ? "Presque !" : "Pas tout à fait";
    let comparaison = "";
    if (["reponse_libre","reecriture","identification"].includes(exercice.type)) {
      comparaison = `
        <div class="liste-elements-verifies">
          ${(resultat.elementsCorrects||[]).map(e => `<span class="element-verifie correct">${icono("coche","icone-xs")}${Utils.echapperHtml(e)}</span>`).join("")}
          ${(resultat.elementsManques||[]).map(e => `<span class="element-verifie oublie">${icono("croix","icone-xs")}${Utils.echapperHtml(e)}</span>`).join("")}
        </div>
        <div class="bloc-comparaison"><div><div class="etiquette">Réponse attendue</div><p class="texte-petit">${Utils.echapperHtml(notion.reponse)}</p></div></div>`;
    } else if (exercice.type === "association" || exercice.type === "ordre") {
      comparaison = `<div class="a-retenir">${Utils.echapperHtml(notion.reponse)}</div>`;
    } else {
      comparaison = `<div class="bloc-comparaison"><div><div class="etiquette">À retenir</div><p class="texte-petit">${Utils.echapperHtml(notion.reponse)}</p></div></div>`;
    }

    const estDrill = PageSession.estDrill();
    const estSequence = PageSession.estSequence();
    const estConfirmation = estDrill && exercice.type === "reecriture" && PageSession.etatDrill[notion.id]?.demandeReecriture;
    let piedHtml;
    if (estConfirmation) {
      piedHtml = resultat.correct === true
        ? `<button type="button" class="bouton bouton-primaire bouton-large mt-md" data-drill="maitrise">${icono("coche_cercle","icone-sm")} Notion maîtrisée — continuer</button>`
        : `<button type="button" class="bouton bouton-secondaire bouton-large mt-md" data-drill="recommencer">${icono("cerveau","icone-sm")} Pas encore tout à fait — je continue à m'entraîner</button>`;
    } else if (estDrill) {
      piedHtml = `<div class="flex gap-sm mt-md">
        <button type="button" class="bouton bouton-secondaire flex-1" data-drill="continuer">${icono("cerveau","icone-sm")} Je continue à m'entraîner</button>
        <button type="button" class="bouton bouton-primaire flex-1" data-drill="connais">${icono("coche","icone-sm")} Je connais cette définition</button>
      </div>`;
    } else if (estSequence) {
      piedHtml = `<button type="button" class="bouton bouton-primaire bouton-large mt-md" data-suite>Continuer</button>`;
    } else {
      piedHtml = `<div class="selecteur-confiance" data-confiance>
        <button type="button" class="option-confiance" data-c="aucune">Je ne savais pas</button>
        <button type="button" class="option-confiance" data-c="hesitation">J'hésitais</button>
        <button type="button" class="option-confiance" data-c="savais">Je savais</button>
        <button type="button" class="option-confiance" data-c="facile">Très facile</button>
      </div>`;
    }

    zone.innerHTML = `<div class="panneau-correction ${classe}">
      <div class="entete-correction ${classe}">${icono(classe==="correct"?"coche_cercle":classe==="partiel"?"info":"croix_cercle")}${titreCorrection}</div>
      ${comparaison}
      ${piedHtml}
    </div>`;
    zone.scrollIntoView({ behavior: "smooth", block: "nearest" });
    if (estDrill) zone.querySelectorAll("[data-drill]").forEach(b => b.addEventListener("click", () => PageSession.resoudreDrill(notion, exercice, resultat, b.dataset.drill)));
    else if (estSequence) zone.querySelector("[data-suite]").addEventListener("click", () => PageSession.resoudreSequence(notion, exercice, resultat));
    else zone.querySelectorAll("[data-c]").forEach(b => b.addEventListener("click", () => PageSession.validerConfiance(notion, exercice, resultat, b.dataset.c)));
  },

  async enregistrerResultat(notion, exercice, resultat, confiance){
    const nouvelleProgression = Revision.calculerRevisionSuivante(notion, {
      correct: resultat.correct, typeExercice: exercice.type, indiceUtilise: PageSession.indiceNiveau,
      confiance, elementsManques: resultat.elementsManques || [], elementsCorrects: resultat.elementsCorrects || [],
    });
    await Store.modifier("notions", notion.id, { progression: nouvelleProgression });
    await Store.ajouter("historique", {
      notionId: notion.id, date: new Date().toISOString(), typeExercice: exercice.type,
      resultat: resultat.correct, elementsManques: resultat.elementsManques || [], indiceUtilise: PageSession.indiceNiveau, confiance,
    });
    if (resultat.correct === true) PageSession.stats.reussites++;
    else if (resultat.correct === "partiel") PageSession.stats.partiels++;
    else PageSession.stats.echecs++;
  },

  async validerConfiance(notion, exercice, resultat, confiance){
    await PageSession.enregistrerResultat(notion, exercice, resultat, confiance);
    if (resultat.correct !== true) PageSession.stats.aRetravailler.push(notion.id);
    PageSession.index++;
    PageSession.rendre();
  },

  // action : "connais" (demande la réécriture de confirmation) · "continuer" (un autre
  // exercice, même notion, plus tard dans la rotation) · "maitrise" (réécriture réussie :
  // la notion sort du dossier en cours) · "recommencer" (réécriture ratée : retour à
  // l'entraînement normal, on redonne sa chance plus tard).
  async resoudreDrill(notion, exercice, resultat, action){
    const confiance = resultat.correct === true ? (action === "connais" ? "facile" : "savais") : resultat.correct === "partiel" ? "hesitation" : "aucune";
    await PageSession.enregistrerResultat(notion, exercice, resultat, confiance);
    const etat = PageSession.etatDrill[notion.id];

    if (action === "maitrise") {
      PageSession.stats.notionsMaitrisees = (PageSession.stats.notionsMaitrisees || 0) + 1;
      (PageSession.stats.notionsMaitriseesIds ||= []).push(notion.id);
      PageSession.file.splice(PageSession.index, 1);
      delete PageSession.etatDrill[notion.id];
      Toast.succes(`« ${notion.titre} » maîtrisée !`);
    } else if (action === "recommencer") {
      etat.demandeReecriture = false;
      PageSession.stats.aRetravailler.push(notion.id);
      PageSession.index = PageSession.file.length ? (PageSession.index + 1) % PageSession.file.length : 0;
    } else if (action === "connais") {
      etat.demandeReecriture = true; // reteste la même notion tout de suite, avec une réécriture cette fois
    } else {
      if (resultat.correct !== true) PageSession.stats.aRetravailler.push(notion.id);
      PageSession.index = PageSession.file.length ? (PageSession.index + 1) % PageSession.file.length : 0;
    }
    PageSession.rendre();
  },

  async terminer(){
    const duree = Math.round((Date.now() - PageSession.stats.debut) / 1000);
    const estDrill = PageSession.estDrill() || PageSession.estSequence();
    const notionsRevues = estDrill ? PageSession.totalDrill : PageSession.file.length;
    await Store.ajouter("sessions", { type: PageSession.mode, notionsRevues, reussites: PageSession.stats.reussites, echecs: PageSession.stats.echecs, dureeSecondes: duree });
    await Gamification.surSessionTerminee();
    if (PageSession.mode === "interrogation" && PageSession.dossierValidationCible) {
      const { type, id } = PageSession.dossierValidationCible;
      await Store.modifier(type, id, { interrogationValideeLe: new Date().toISOString() });
    }
    const maitrisees = new Set(PageSession.stats.notionsMaitriseesIds || []);
    Etat.ui.dernierResume = {
      ...PageSession.stats, aRetravailler: [...new Set(PageSession.stats.aRetravailler)].filter(id => !maitrisees.has(id)),
      duree, notionsRevues, coursId: PageSession.coursId,
      estDrill, dossierValide: PageSession.mode === "interrogation",
      mode: PageSession.mode, notionsSession: PageSession.fileOriginale,
    };
    Routeur.aller("session/resume");
  },
};

/* ==================== G7. FIN DE SESSION ==================== */
const PageResume = {
  rendre(){
    const r = Etat.ui.dernierResume;
    const principal = document.getElementById("contenu-principal");
    if (!r) { Routeur.aller("dashboard"); return; }
    principal.innerHTML = `<div class="resume-session">
      ${icono("coche_cercle","icone-lg")}<h1 class="mt-md">${r.dossierValide ? "Dossier validé !" : "Session terminée !"}</h1>
      <p class="texte-2 mt-sm">${r.dossierValide ? `Les ${r.notionsMaitrisees} définitions de ce dossier sont maîtrisées sur le bout des doigts.` : `${r.notionsRevues} notion${r.notionsRevues>1?"s":""} révisée${r.notionsRevues>1?"s":""}`}</p>
      <div class="grille-resume">
        ${r.estDrill ? `
        <div><div class="nombre texte-gras" style="color:var(--succes);font-size:1.6rem">${r.notionsMaitrisees||0}</div><div class="texte-petit texte-2">Maîtrisées</div></div>
        <div><div class="nombre texte-gras" style="font-size:1.6rem">${r.reussites+r.partiels+r.echecs}</div><div class="texte-petit texte-2">Exercices faits</div></div>
        <div><div class="nombre texte-gras" style="color:var(--danger);font-size:1.6rem">${r.aRetravailler.length}</div><div class="texte-petit texte-2">Encore floues</div></div>
        ` : `
        <div><div class="nombre texte-gras" style="color:var(--succes);font-size:1.6rem">${r.reussites}</div><div class="texte-petit texte-2">Réussites</div></div>
        <div><div class="nombre texte-gras" style="color:var(--attention);font-size:1.6rem">${r.partiels||0}</div><div class="texte-petit texte-2">Partielles</div></div>
        <div><div class="nombre texte-gras" style="color:var(--danger);font-size:1.6rem">${r.echecs}</div><div class="texte-petit texte-2">À revoir</div></div>
        `}
      </div>
      <p class="texte-2 texte-petit">Temps : ${Utils.formaterDuree(r.duree)}</p>
      ${r.aRetravailler.length ? `<div class="carte mt-lg" style="text-align:left"><h3 class="mb-sm">À retravailler</h3>${r.aRetravailler.map(id => { const n = Selecteurs.notion(id); return n ? `<div class="texte-petit" style="padding:.3rem 0">${Utils.echapperHtml(n.titre)}</div>` : ""; }).join("")}</div>` : ""}
      <div class="flex gap-sm mt-lg flex-wrap">
        ${r.aRetravailler.length ? `<button class="bouton bouton-secondaire flex-1" data-reviser-erreurs>${icono("cerveau","icone-sm")} Réviser mes erreurs</button>` : ""}
        ${r.notionsSession?.length ? `<button class="bouton bouton-contour flex-1" data-recommencer>${icono("livre_ouvert","icone-sm")} Recommencer</button>` : ""}
        <button class="bouton bouton-primaire flex-1" data-action="aller" data-route="dashboard">Retour au tableau de bord</button>
      </div>
    </div>`;
    principal.querySelector("[data-reviser-erreurs]")?.addEventListener("click", () => {
      const notions = r.aRetravailler.map(id => Selecteurs.notion(id)).filter(Boolean);
      PageSession.demarrer("cible", { notions });
    });
    // "Recommencer" : jamais verrouillé, même une session terminée avec 100% de réussite —
    // relance exactement le même lot de notions, en forçant (les notions maîtrisées entre
    // temps ne seraient sinon plus sélectionnées par les filtres habituels du mode).
    principal.querySelector("[data-recommencer]")?.addEventListener("click", () => {
      const notions = r.notionsSession.map(id => Selecteurs.notion(id)).filter(Boolean);
      if (!notions.length) return Toast.erreur("Ces notions n'existent plus.");
      PageSession.demarrer(r.mode, { notions, coursId: r.coursId, forcer: true });
    });
  },
};

/* ==================== G8. MODE EXAMEN ==================== */
const PageExamen = {
  config: { matiereId: "", difficulte: "mixte", nbQuestions: 15, dureeMinutes: 0 },
  file: [], index: 0, reponses: [], minuteur: null, finAt: null,

  rendreConfig(){
    const principal = document.getElementById("contenu-principal");
    const total = Selecteurs.toutesNotionsValidees().length;
    principal.innerHTML = `<div style="max-width:520px;margin:0 auto">
      <h1 class="mb-sm">Mode examen</h1>
      <p class="texte-2 mb-lg">Sans correction immédiate, sans indice — pour t'évaluer vraiment.</p>
      <div class="carte">
        <div class="groupe-champ"><label>Matière</label><select class="champ" id="ex-matiere"><option value="">Toutes les matières</option>${Etat.donnees.matieres.map(m => `<option value="${m.id}">${Utils.echapperHtml(m.nom)}</option>`).join("")}</select></div>
        <div class="groupe-champ"><label>Difficulté</label><select class="champ" id="ex-difficulte">
          <option value="mixte">Mixte</option><option value="facile">Facile</option><option value="moyen">Moyenne</option><option value="difficile">Difficile</option>
        </select></div>
        <div class="rangee-champs">
          <div class="groupe-champ"><label>Nombre de questions</label><input class="champ" type="number" id="ex-nb" value="15" min="3" max="50"></div>
          <div class="groupe-champ"><label>Temps (minutes, 0 = illimité)</label><input class="champ" type="number" id="ex-duree" value="0" min="0" max="180"></div>
        </div>
        <p class="texte-2 texte-petit mb-md">${total} notion${total>1?"s":""} disponible${total>1?"s":""} au total.</p>
        <button class="bouton bouton-primaire bouton-large bouton-lg" id="ex-demarrer">${icono("horloge","icone-sm")} Démarrer l'examen</button>
      </div>
    </div>`;
    principal.querySelector("#ex-demarrer").addEventListener("click", () => {
      PageExamen.config.matiereId = principal.querySelector("#ex-matiere").value;
      PageExamen.config.difficulte = principal.querySelector("#ex-difficulte").value;
      PageExamen.config.nbQuestions = Number(principal.querySelector("#ex-nb").value) || 10;
      PageExamen.config.dureeMinutes = Number(principal.querySelector("#ex-duree").value) || 0;
      PageExamen.demarrer();
    });
  },

  demarrer(){
    let pool = Selecteurs.toutesNotionsValidees();
    if (PageExamen.config.matiereId) pool = pool.filter(n => n.matiereId === PageExamen.config.matiereId);
    const seuils = { facile: [1,1], moyen: [2,2], difficile: [3,3], mixte: [1,3] };
    const [min,max] = seuils[PageExamen.config.difficulte];
    const filtre = pool.filter(n => n.difficulte >= min && n.difficulte <= max);
    pool = filtre.length >= 3 ? filtre : pool;
    if (!pool.length) { Toast.erreur("Aucune notion disponible pour ces critères."); return; }
    PageExamen.file = Utils.echantillon(pool, Math.min(PageExamen.config.nbQuestions, pool.length));
    PageExamen.index = 0; PageExamen.reponses = [];
    PageExamen.finAt = PageExamen.config.dureeMinutes ? Date.now() + PageExamen.config.dureeMinutes * MINUTE : null;
    Routeur.aller("examen/actif");
  },

  rendreActif(){
    if (PageExamen.index >= PageExamen.file.length) { PageExamen.terminer(); return; }
    const notion = PageExamen.file[PageExamen.index];
    const exercice = Moteur.genererExercice(notion, ["qcm","vrai_faux","texte_trous","reponse_libre"][PageExamen.index % 4]);
    const principal = document.getElementById("contenu-principal");
    let corps = "";
    if (exercice.type === "qcm") corps = `<div class="liste-options" data-options>${exercice.donnees.options.map((o,i) => `<button type="button" class="option-reponse" data-option="${i}"><span class="lettre-option">${String.fromCharCode(65+i)}</span>${Utils.echapperHtml(o)}</button>`).join("")}</div>`;
    else if (exercice.type === "vrai_faux") corps = `<div class="enonce-question">${Utils.echapperHtml(exercice.donnees.affirmation)}</div><div class="liste-options" data-options><button type="button" class="option-reponse" data-option="true"><span class="lettre-option">V</span>Vrai</button><button type="button" class="option-reponse" data-option="false"><span class="lettre-option">F</span>Faux</button></div>`;
    else if (exercice.type === "texte_trous") { let i=0; corps = `<div class="trous-texte">${exercice.donnees.segments.map(seg => /^\d+$/.test(seg) && exercice.donnees.reponses[seg]!==undefined ? `<input type="text" class="trou-input" data-trou="${seg}">` : Utils.echapperHtml(seg)).join("")}</div><button class="bouton bouton-primaire bouton-large mt-lg" data-suivant>Suivant</button>`; }
    else corps = `<div class="zone-reponse-libre"><textarea class="champ" data-reponse-libre placeholder="Ta réponse..."></textarea><button class="bouton bouton-primaire bouton-large mt-md" data-suivant>Suivant</button></div>`;

    principal.innerHTML = `<div class="enveloppe-session">
      <div class="entete-session">
        <button class="bouton-icone" data-action="aller" data-route="reviser" aria-label="Abandonner">${icono("croix")}</button>
        ${barreProgressionHtml(Math.round((PageExamen.index/PageExamen.file.length)*100))}
        <span class="texte-petit texte-2" id="chronoExamen">${PageExamen.index+1}/${PageExamen.file.length}</span>
      </div>
      <div class="carte-question"><div class="enonce-question">${exercice.type==="qcm"||exercice.type==="reponse_libre" ? Utils.echapperHtml(exercice.enonce) : ""}</div>${corps}</div>
    </div>`;

    if (exercice.type === "qcm" || exercice.type === "vrai_faux") {
      principal.querySelectorAll("[data-option]").forEach(b => b.addEventListener("click", () => {
        const val = exercice.type === "vrai_faux" ? b.dataset.option === "true" : Number(b.dataset.option);
        PageExamen.enregistrer(notion, exercice, val);
      }));
    } else if (exercice.type === "texte_trous") {
      principal.querySelector("[data-suivant]").addEventListener("click", () => {
        const valeurs = [...principal.querySelectorAll("[data-trou]")].sort((a,b) => a.dataset.trou - b.dataset.trou).map(i => i.value.trim());
        PageExamen.enregistrer(notion, exercice, valeurs);
      });
    } else {
      principal.querySelector("[data-suivant]").addEventListener("click", () => PageExamen.enregistrer(notion, exercice, principal.querySelector("[data-reponse-libre]").value.trim()));
    }
    PageExamen.gererChrono();
  },
  gererChrono(){
    clearInterval(PageExamen.minuteur);
    if (!PageExamen.finAt) return;
    const maj = () => {
      const restant = PageExamen.finAt - Date.now();
      if (restant <= 0) { clearInterval(PageExamen.minuteur); PageExamen.terminer(); return; }
      const el = document.getElementById("chronoExamen");
      if (el) el.textContent = Utils.formaterDuree(restant/1000);
    };
    maj(); PageExamen.minuteur = setInterval(maj, 1000);
  },
  enregistrer(notion, exercice, reponseUtilisateur){
    const resultat = Moteur.evaluer(exercice, notion, reponseUtilisateur);
    PageExamen.reponses.push({ notion, exercice, reponseUtilisateur, resultat });
    PageExamen.index++;
    PageExamen.rendreActif();
  },
  async terminer(){
    clearInterval(PageExamen.minuteur);
    const correctes = PageExamen.reponses.filter(r => r.resultat.correct === true).length;
    for (const r of PageExamen.reponses) {
      const confiance = r.resultat.correct === true ? "savais" : r.resultat.correct === "partiel" ? "hesitation" : "aucune";
      const nouvelleProgression = Revision.calculerRevisionSuivante(r.notion, { correct: r.resultat.correct, typeExercice: r.exercice.type, indiceUtilise: 0, confiance, elementsManques: r.resultat.elementsManques||[], elementsCorrects: r.resultat.elementsCorrects||[] });
      await Store.modifier("notions", r.notion.id, { progression: nouvelleProgression });
      await Store.ajouter("historique", { notionId: r.notion.id, date: new Date().toISOString(), typeExercice: r.exercice.type, resultat: r.resultat.correct, elementsManques: r.resultat.elementsManques||[], indiceUtilise: 0, confiance });
    }
    await Store.ajouter("examens", { score: correctes, total: PageExamen.reponses.length, matiereId: PageExamen.config.matiereId || null });
    Etat.ui.dernierExamen = { correctes, total: PageExamen.reponses.length, reponses: PageExamen.reponses };
    Routeur.aller("examen/resultats");
  },
  rendreResultats(){
    const r = Etat.ui.dernierExamen;
    const principal = document.getElementById("contenu-principal");
    if (!r) { Routeur.aller("reviser"); return; }
    const pct = Math.round((r.correctes / r.total) * 100);
    principal.innerHTML = `<div style="max-width:600px;margin:0 auto" class="texte-centre">
      <h1>Résultat de l'examen</h1>
      <div class="mt-md">${anneauProgression(pct, { taille: 100, epaisseur: 10 })}</div>
      <p class="texte-2 mt-sm">${r.correctes} / ${r.total} bonnes réponses</p>
      <div class="flex-col gap-sm mt-lg" style="text-align:left">
        ${r.reponses.map(rep => `<div class="carte flex items-centre gap-sm">${icono(rep.resultat.correct===true?"coche_cercle":rep.resultat.correct==="partiel"?"info":"croix_cercle","icone-sm")}<span class="flex-1 texte-petit">${Utils.echapperHtml(rep.notion.titre)}</span></div>`).join("")}
      </div>
      <div class="flex gap-sm mt-lg">
        <button class="bouton bouton-secondaire flex-1" data-erreurs>${icono("cerveau","icone-sm")} Réviser mes erreurs</button>
        <button class="bouton bouton-primaire flex-1" data-action="aller" data-route="dashboard">Tableau de bord</button>
      </div>
    </div>`;
    principal.querySelector("[data-erreurs]").addEventListener("click", () => {
      const notions = r.reponses.filter(rp => rp.resultat.correct !== true).map(rp => rp.notion);
      if (!notions.length) return Toast.succes("Aucune erreur à retravailler !");
      PageSession.demarrer("cible", { notions });
    });
  },
};

/* ==================== G8b. ÉVALUATIONS ==================== */
// Une Évaluation répond à une question précise, différente d'une session d'apprentissage :
// "est-ce que je suis réellement capable de réécrire ces définitions de mémoire ?" (§7).
// Aucune aide pendant l'évaluation (§8) ; correction et bilan seulement à la fin (§9-14),
// via Moteur.analyserRestitution (D2/D3, juste après evaluerReponseLibre).
const NIVEAUX_RESTITUTION = {
  excellente:  { emoji: "🟢", libelle: "correcte" },
  tresBonne:   { emoji: "🟢", libelle: "correcte" },
  partielle:   { emoji: "🟡", libelle: "partiellement correcte" },
  fragile:     { emoji: "🔴", libelle: "à revoir" },
  nonMaitrisee:{ emoji: "🔴", libelle: "à revoir" },
  incorrecte:  { emoji: "🔴", libelle: "à revoir (contradiction)" },
};

const PageEvaluationCreation = {
  selectionLibre: new Set(),
  recherche: "",

  rendre(){
    const principal = document.getElementById("contenu-principal");
    const preselection = Etat.ui.selectionEvaluation;
    if (preselection?.length) {
      const notions = preselection.map(id => Selecteurs.notion(id)).filter(Boolean);

        <a href="#/definitions" class="texte-2 texte-petit flex items-centre gap-xs mb-md">${icono("fleche_gauche","icone-xs")} Définitions</a>
        <h1 class="mb-sm">Créer l'évaluation</h1>
        <p class="texte-2 mb-lg">${notions.length} définition${notions.length>1?"s":""} sélectionnée${notions.length>1?"s":""}. Tu vas devoir réécrire chacune de mémoire, sans aide.</p>
        <div class="flex-col gap-sm mb-lg">${notions.map(n => `<div class="carte flex items-centre gap-sm"><span class="flex-1 texte-petit">${Utils.echapperHtml(n.titre)}</span><button type="button" class="bouton-icone" data-retirer="${n.id}" aria-label="Retirer">${icono("croix","icone-xs")}</button></div>`).join("")}</div>
        <button class="bouton bouton-primaire bouton-large bouton-lg" data-creer>${icono("crayon","icone-sm")} Créer l'évaluation</button>
      `;
      principal.querySelectorAll("[data-retirer]").forEach(b => b.addEventListener("click", () => {
        Etat.ui.selectionEvaluation = Etat.ui.selectionEvaluation.filter(id => id !== b.dataset.retirer);
        PageEvaluationCreation.rendre();
      }));
      principal.querySelector("[data-creer]").addEventListener("click", () => {
        if (!Etat.ui.selectionEvaluation.length) return Toast.erreur("Sélectionne au moins une définition.");
        const ids = [...Etat.ui.selectionEvaluation];
        Etat.ui.selectionEvaluation = null;
        PageDefinitions.selection.clear();
        PageEvaluation.demarrer(ids);
      });
      return;
    }

    // Arrivée directe depuis l'onglet Évaluations (pas de sélection préparée dans
    // Définitions) : on propose le même choix, en plus simple, sur place.
    const r = Utils.normaliserTexte(PageEvaluationCreation.recherche);
    const toutes = Selecteurs.toutesNotionsValidees().filter(n => !r || Utils.normaliserTexte(n.titre).includes(r));
    principal.innerHTML = `
      <a href="#/evaluations" class="texte-2 texte-petit flex items-centre gap-xs mb-md">${icono("fleche_gauche","icone-xs")} Évaluations</a>
      <h1 class="mb-sm">Créer une évaluation</h1>
      <p class="texte-2 mb-lg">Choisis les définitions que tu veux réellement tester.</p>
      <div class="recherche-entete mb-md">${icono("recherche","icone-sm")}<input type="search" placeholder="Rechercher..." value="${Utils.echapperHtml(PageEvaluationCreation.recherche)}" data-recherche-eval></div>
      <div class="flex gap-sm mb-md">
        <button class="bouton bouton-contour bouton-sm" data-tout>Tout sélectionner</button>
        <button class="bouton bouton-contour bouton-sm" data-aucun>Désélectionner</button>
      </div>
      ${toutes.length ? `<div class="flex-col gap-sm mb-lg">${toutes.map(n => `
        <label class="carte flex items-centre gap-sm" style="cursor:pointer">
          <input type="checkbox" data-case="${n.id}" ${PageEvaluationCreation.selectionLibre.has(n.id)?"checked":""} style="width:20px;height:20px;accent-color:var(--primaire);cursor:pointer;flex-shrink:0">
          <span class="flex-1 texte-petit">${Utils.echapperHtml(n.titre)}</span>${badgeStatut(n.progression.statut)}
        </label>`).join("")}</div>` : carteVide("cerveau", "Aucune définition disponible", "Ajoute d'abord un cours ou des cartes rapides.")}
      <button class="bouton bouton-primaire bouton-large bouton-lg" data-creer-libre>${icono("crayon","icone-sm")} Créer l'évaluation (${PageEvaluationCreation.selectionLibre.size})</button>

    principal.querySelector("[data-recherche-eval]").addEventListener("input", Utils.debounce((e) => { PageEvaluationCreation.recherche = e.target.value; PageEvaluationCreation.rendre(); }, 250));
    principal.querySelector("[data-tout]").addEventListener("click", () => { toutes.forEach(n => PageEvaluationCreation.selectionLibre.add(n.id)); PageEvaluationCreation.rendre(); });
    principal.querySelector("[data-aucun]").addEventListener("click", () => { PageEvaluationCreation.selectionLibre.clear(); PageEvaluationCreation.rendre(); });
    principal.querySelectorAll("[data-case]").forEach(c => c.addEventListener("change", () => {

      PageEvaluationCreation.rendre();

    principal.querySelector("[data-creer-libre]").addEventListener("click", () => {

      const ids = [...PageEvaluationCreation.selectionLibre];
      PageEvaluationCreation.selectionLibre = new Set();
      PageEvaluation.demarrer(ids);
    });
  },
};

const PageEvaluation = {
  file: [], index: 0, reponses: [], debut: 0,

  demarrer(notionIds){
    PageEvaluation.file = notionIds;
    PageEvaluation.index = 0;
    PageEvaluation.reponses = [];
    PageEvaluation.debut = Date.now();
    Routeur.aller("evaluations/actif");
  },

  rendre(){
    const principal = document.getElementById("contenu-principal");
    if (PageEvaluation.index >= PageEvaluation.file.length) { PageEvaluation.terminer(); return; }
    const notion = Selecteurs.notion(PageEvaluation.file[PageEvaluation.index]);
    if (!notion) { PageEvaluation.index++; PageEvaluation.rendre(); return; }
    const pct = Math.round((PageEvaluation.index / PageEvaluation.file.length) * 100);
    principal.innerHTML = `
      <div class="enveloppe-session">
        <div class="entete-session">
          <button class="bouton-icone" data-action="aller" data-route="evaluations" aria-label="Abandonner">${icono("croix")}</button>
          ${barreProgressionHtml(pct)}
          <span class="texte-petit texte-2">${PageEvaluation.index+1}/${PageEvaluation.file.length}</span>
        </div>
        <div class="carte-question texte-centre">
          <span class="badge badge-neutre" style="align-self:center">Restitution complète</span>
          <h2 class="mt-md">${Utils.echapperHtml(notion.titre)}</h2>
          <p class="texte-2 mt-sm">Écris la définition complète de ce terme, de mémoire. Aucune aide, aucune correction avant la fin.</p>
          <textarea class="champ mt-md" style="min-height:160px;text-align:left" data-reponse-eval placeholder="Écris ta réponse ici..."></textarea>
          <button class="bouton bouton-primaire bouton-large bouton-lg mt-md" data-suivant>${PageEvaluation.index+1 < PageEvaluation.file.length ? "Suivant" : "Terminer l'évaluation"}</button>
        </div>
      </div>`;
    principal.querySelector("[data-suivant]").addEventListener("click", () => {
      const texte = principal.querySelector("[data-reponse-eval]").value.trim();
      PageEvaluation.reponses.push({ notionId: notion.id, reponse: texte });
      PageEvaluation.index++;
      PageEvaluation.rendre();
    });
  },

  async terminer(){
    const dureeSecondes = Math.round((Date.now() - PageEvaluation.debut) / 1000);
    const details = [];
    for (const r of PageEvaluation.reponses) {
      const notion = Selecteurs.notion(r.notionId);
      if (!notion) continue;
      const analyse = Moteur.analyserRestitution(notion, r.reponse);
      details.push({ notionId: notion.id, titre: notion.titre, reponseDonnee: r.reponse, ...analyse });
      // Une restitution complète sans aide pèse lourd dans la progression (§13) : la
      // confiance dérive du ratio d'éléments réellement rappelés, pas d'un simple oui/non.
      const confiance = analyse.ratio >= 0.9 ? "facile" : analyse.ratio >= 0.7 ? "savais" : analyse.ratio >= 0.4 ? "hesitation" : "aucune";
      const nouvelleProgression = Revision.calculerRevisionSuivante(notion, {
        correct: analyse.correct, typeExercice: "reecriture", indiceUtilise: 0, confiance,
        elementsManques: analyse.elementsManques, elementsCorrects: analyse.elementsCorrects,
      });
      await Store.modifier("notions", notion.id, { progression: nouvelleProgression });
      await Store.ajouter("historique", { notionId: notion.id, date: new Date().toISOString(), typeExercice: "reecriture", resultat: analyse.correct, elementsManques: analyse.elementsManques, indiceUtilise: 0, confiance });
    }
    const reussites = details.filter(d => d.correct === true).length;
    const aRevoir = details.filter(d => d.niveau === "fragile" || d.niveau === "nonMaitrisee" || d.niveau === "incorrecte").length;
    const fragiles = details.length - reussites - aRevoir; // niveau "partielle" (🟡)
    const scorePct = details.length ? Math.round(details.reduce((s,d) => s+d.ratio, 0) / details.length * 100) : 0;
    const doc = await Store.ajouter("evaluations", {
      notionsIds: details.map(d => d.notionId), total: details.length, score: scorePct,
      reussites, fragiles, aRevoir, dureeSecondes, details,
    });
    Routeur.aller(`evaluations/resultats/${doc.id}`);
  },
};

/* ==================== G9. CALENDRIER ==================== */
// Une "évaluation scolaire" (collection `controles`, déjà existante) est un contrôle réel à
// venir — matière/chapitre/cours facultatifs pour cibler les notions concernées, date + heure.
// Distincte des "Évaluations" (auto-testées, onglet G8b) : ici, pas de tentative ni de score,
// juste une échéance et un plan de révision généré pour s'y préparer (§32-33 du cahier des
// charges). Formulaire dédié plutôt que ouvrirFormulaire générique : les sélecteurs
// matière→cours→chapitre doivent se mettre à jour en cascade au fil de la saisie.
function ouvrirEditionControle(controleExistant){
  const etat = {
    nom: controleExistant?.nom || "", date: controleExistant?.date || Utils.versDateISO(new Date()),
    heure: controleExistant?.heure || "", matiereId: controleExistant?.matiereId || "",
    coursId: controleExistant?.coursId || "", chapitreId: controleExistant?.chapitreId || "",
  };
  const rendreZones = () => {
    const cours = etat.matiereId ? Selecteurs.coursDeMatiere(etat.matiereId) : [];
    const chapitres = etat.coursId ? Selecteurs.chapitresDeCours(etat.coursId) : [];
    document.getElementById("ctrlZoneCours").innerHTML = etat.matiereId ? `
      <div class="groupe-champ"><label>Dossier (facultatif)</label><select class="champ" id="ctrl-cours">
        <option value="">Tous les dossiers de cette matière</option>
        ${cours.map(c => `<option value="${c.id}" ${etat.coursId===c.id?"selected":""}>${Utils.echapperHtml(c.titre)}</option>`).join("")}
      </select></div>` : "";
    document.getElementById("ctrlZoneChapitre").innerHTML = etat.coursId ? `
      <div class="groupe-champ"><label>Chapitre (facultatif)</label><select class="champ" id="ctrl-chapitre">
        <option value="">Tout le dossier</option>
        ${chapitres.map(ch => `<option value="${ch.id}" ${etat.chapitreId===ch.id?"selected":""}>${Utils.echapperHtml(ch.titre)}</option>`).join("")}
      </select></div>` : "";
    document.getElementById("ctrlZoneCours").querySelector("#ctrl-cours")?.addEventListener("change", (e) => { etat.coursId = e.target.value; etat.chapitreId = ""; rendreZones(); });
    document.getElementById("ctrlZoneChapitre").querySelector("#ctrl-chapitre")?.addEventListener("change", (e) => { etat.chapitreId = e.target.value; });
  };
  const html = `
    <div class="entete-modale"><h3>${controleExistant ? "Modifier" : "Ajouter"} une évaluation scolaire</h3><button class="bouton-icone" data-fermer aria-label="Fermer">${icono("croix")}</button></div>
    <div class="groupe-champ"><label>Nom</label><input class="champ" type="text" id="ctrl-nom" value="${Utils.echapperHtml(etat.nom)}" placeholder="Ex. Contrôle d'histoire"></div>
    <div class="rangee-champs">
      <div class="groupe-champ"><label>Date</label><input class="champ" type="date" id="ctrl-date" value="${etat.date}"></div>
      <div class="groupe-champ"><label>Heure (facultatif)</label><input class="champ" type="time" id="ctrl-heure" value="${etat.heure}"></div>
    </div>
    <div class="groupe-champ"><label>Matière (facultatif)</label><select class="champ" id="ctrl-matiere">
      <option value="">Toutes les matières</option>
      ${Etat.donnees.matieres.map(m => `<option value="${m.id}" ${etat.matiereId===m.id?"selected":""}>${Utils.echapperHtml(m.nom)}</option>`).join("")}
    </select></div>
    <div id="ctrlZoneCours"></div>
    <div id="ctrlZoneChapitre"></div>
    <div class="pied-modale">
      ${controleExistant ? `<button type="button" class="bouton bouton-danger" data-supprimer style="margin-right:auto">${icono("poubelle","icone-sm")} Supprimer</button>` : ""}
      <button type="button" class="bouton bouton-fantome" data-fermer>Annuler</button>
      <button type="button" class="bouton bouton-primaire" data-valider>Enregistrer</button>
    </div>
  `;
  Modale.ouvrir(html, { classe: "modale-formulaire" });
  const modaleEl = Modale.pile[Modale.pile.length - 1].el;
  rendreZones();
  modaleEl.querySelectorAll("[data-fermer]").forEach(b => b.addEventListener("click", () => Modale.fermer()));
  modaleEl.querySelector("#ctrl-matiere").addEventListener("change", (e) => { etat.matiereId = e.target.value; etat.coursId = ""; etat.chapitreId = ""; rendreZones(); });
  modaleEl.querySelector("[data-supprimer]")?.addEventListener("click", async () => {
    const ok = await confirmerAction({ titre: "Supprimer cette évaluation scolaire ?", message: "Le plan de révision associé sera aussi supprimé.", libelleConfirmer: "Supprimer", danger: true });
    if (ok) { Modale.fermer(); await Store.supprimer("controles", controleExistant.id); Toast.succes("Évaluation scolaire supprimée."); PageCalendrier.rendre(); }
  });
  modaleEl.querySelector("[data-valider]").addEventListener("click", async () => {

    PageCalendrier.rendre();
  });
}

  toutesLesPhases(){

  },

  // Notions concernées par une évaluation scolaire : filtre progressif matière → cours →
  // chapitre, ou toutes les notions si rien n'est précisé (contrôle "général").
  notionsDuControle(controle){
    let notions = Selecteurs.toutesNotionsValidees();
    if (controle.matiereId) notions = notions.filter(n => n.matiereId === controle.matiereId);
    if (controle.coursId) notions = notions.filter(n => n.coursId === controle.coursId);
    if (controle.chapitreId) notions = notions.filter(n => n.chapitreId === controle.chapitreId);
    return notions;
  },

  // §33 : un vrai plan de révision automatique (pas juste un étalement de dates), qui analyse
  // jours restants / maîtrise / notions fragiles / historique, façon J-7…J-1 — mais adapté au
  // nombre RÉEL de jours restants (l'exemple du cahier des charges suppose 7 jours, ce ne sera
  // pas toujours le cas). Chaque étape cible directement le bon mode/les bonnes notions, pour
  // qu'un clic depuis le calendrier lance la session sans autre réglage.
  async genererPlanRevision(controle){
    const cible = PageCalendrier.notionsDuControle(controle);
    if (!cible.length) { Toast.erreur("Aucune notion ne correspond à cette évaluation — vérifie la matière/le dossier choisis."); return null; }
    const aujourdhui = new Date(Utils.versDateISO(new Date()) + "T00:00:00");
    const dateControle = new Date(controle.date + "T00:00:00");
    const joursRestants = Math.max(1, Math.round((dateControle - aujourdhui) / JOUR));
    const nouvelles = cible.filter(n => n.progression.etapeIndex === 0);
    const fragiles = cible.filter(n => n.progression.etapeIndex > 0 && ["rouge","orange"].includes(n.progression.statut));

    const etapesPossibles = [
      { cle: "decouverte", titre: "Nouvelles notions", description: `Apprendre en profondeur les ${nouvelles.length} notion${nouvelles.length>1?"s":""} pas encore vue${nouvelles.length>1?"s":""}.`, mode: "apprentissage", notions: nouvelles, active: nouvelles.length > 0 },
      { cle: "rappels", titre: "Premiers rappels", description: "Réviser l'ensemble pour bien ancrer ce qui vient d'être vu.", mode: "reviser", notions: cible, active: true },
      { cle: "fragiles", titre: "Notions fragiles", description: fragiles.length ? `Se concentrer sur ${fragiles.length>1?"les":"la"} ${fragiles.length} notion${fragiles.length>1?"s":""} encore fragile${fragiles.length>1?"s":""}.` : "Révision active de l'ensemble.", mode: "cible", notions: fragiles.length ? fragiles : cible, active: fragiles.length > 0 || joursRestants >= 3 },
      { cle: "restitution", titre: "Restitution complète", description: "Réécrire toutes les définitions de mémoire, sans aide — pour vérifier ce que tu sais VRAIMENT restituer.", mode: "evaluation", notions: cible, active: true },
      { cle: "final", titre: "Révision finale + examen blanc", description: "Dernières erreurs à combler, puis un examen blanc complet avant le jour J.", mode: "examen", notions: cible, active: true },
    ].filter(e => e.active);

    const n = etapesPossibles.length;
    const dernierJourUtile = Math.max(0, joursRestants - 1); // jamais le jour du contrôle lui-même
    const plan = etapesPossibles.map((e, i) => {
      const decalage = n > 1 ? Math.round((i / (n - 1)) * dernierJourUtile) : dernierJourUtile;
      const jour = new Date(aujourdhui.getTime() + decalage * JOUR);
      return { jour: Utils.versDateISO(jour), cle: e.cle, titre: e.titre, description: e.description, mode: e.mode, notionsIds: e.notions.map(x => x.id) };
    });
    await Store.modifier("controles", controle.id, { plan });
    return plan;
  },

  lancerPhase(phase){
    const notions = (phase.notionsIds || []).map(id => Selecteurs.notion(id)).filter(Boolean);
    if (!notions.length) return Toast.erreur("Ces notions n'existent plus.");
    if (phase.mode === "evaluation") { Etat.ui.selectionEvaluation = notions.map(n => n.id); Routeur.aller("evaluations/nouvelle"); }
    else if (phase.mode === "examen") Routeur.aller("examen");
    else PageSession.demarrer(phase.mode, { notions, forcer: true });
  },

  ouvrirDetailControle(controle){
    if (!controle) return;
    const cible = PageCalendrier.notionsDuControle(controle);
    const scope = [controle.matiereId && Selecteurs.matiere(controle.matiereId)?.nom, controle.coursId && Selecteurs.cours(controle.coursId)?.titre, controle.chapitreId && Selecteurs.chapitresDeCours(controle.coursId).find(ch=>ch.id===controle.chapitreId)?.titre].filter(Boolean).join(" · ") || "Toutes les matières";
    const rendreContenu = () => `
      <div class="entete-modale"><h3>${Utils.echapperHtml(controle.nom)}</h3><button class="bouton-icone" data-fermer aria-label="Fermer">${icono("croix")}</button></div>
      <p class="texte-2 texte-petit mb-sm">${Utils.formaterDate(controle.date)}${controle.heure ? ` à ${controle.heure}` : ""} · ${Utils.echapperHtml(scope)} · ${cible.length} notion${cible.length>1?"s":""} concernée${cible.length>1?"s":""}</p>
      ${controle.plan ? `
        <h4 class="mb-sm mt-md">Ton plan de révision</h4>
        <div class="flex-col gap-sm mb-md">
          ${controle.plan.map(p => `<button type="button" class="carte carte-cliquable flex items-centre gap-sm" style="width:100%;text-align:left" data-lancer-phase="${p.cle}">
            <div class="flex-1"><div class="texte-petit texte-semi">${Utils.echapperHtml(p.titre)}</div><div class="texte-xs texte-2">${Utils.formaterDateCourte(p.jour)} · ${Utils.echapperHtml(p.description)}</div></div>
            ${icono("chevron_droit","icone-sm")}
          </button>`).join("")}
        </div>
        <button type="button" class="bouton bouton-fantome bouton-sm" data-regenerer>${icono("cible","icone-sm")} Regénérer le plan</button>
      ` : `<button type="button" class="bouton bouton-primaire bouton-large mt-md" data-preparer>${icono("cible","icone-sm")} Préparer ma révision</button>`}
      <div class="flex gap-sm mt-lg">
        <button type="button" class="bouton bouton-secondaire flex-1" data-modifier>${icono("crayon","icone-sm")} Modifier</button>
        <button type="button" class="bouton bouton-fantome flex-1" data-fermer>Fermer</button>
      </div>
    `;
    Modale.ouvrir(rendreContenu(), { classe: "modale-formulaire" });
    const attacher = () => {
      const modaleEl = Modale.pile[Modale.pile.length - 1].el;
      modaleEl.querySelectorAll("[data-fermer]").forEach(b => b.addEventListener("click", () => Modale.fermer()));
      modaleEl.querySelector("[data-modifier]").addEventListener("click", () => { Modale.fermer(); ouvrirEditionControle(controle); });
      modaleEl.querySelector("[data-preparer]")?.addEventListener("click", async () => {
        const plan = await PageCalendrier.genererPlanRevision(controle);
        if (!plan) return;
        controle.plan = plan;
        modaleEl.innerHTML = rendreContenu();
        attacher();
        PageCalendrier.rendre();
      });
      modaleEl.querySelector("[data-regenerer]")?.addEventListener("click", async () => {
        const plan = await PageCalendrier.genererPlanRevision(controle);
        if (!plan) return;
        controle.plan = plan;
        Toast.succes("Plan de révision mis à jour.");
        modaleEl.innerHTML = rendreContenu();
        attacher();
        PageCalendrier.rendre();
      });
      modaleEl.querySelectorAll("[data-lancer-phase]").forEach(b => b.addEventListener("click", () => {
        const phase = controle.plan.find(p => p.cle === b.dataset.lancerPhase);
        Modale.fermer();
        PageCalendrier.lancerPhase(phase);
      }));
    };
    attacher();
  },

  // Étalement simple et rapide (sans plan détaillé) : encore utilisé par la préparation
  // automatique comme base avant génération du plan structuré ci-dessus.
  async planifierAvantControle(controle){
    if (!controle) return;
    const joursRestants = Math.max(1, Math.ceil((new Date(controle.date) - new Date()) / JOUR));
    const notions = PageCalendrier.notionsDuControle(controle).filter(n => n.progression.statut !== "bleu").sort((a,b) => Revision.calculerPriorite(b) - Revision.calculerPriorite(a));
    const parJour = Math.max(1, Math.ceil(notions.length / joursRestants));
    for (const [i, n] of notions.entries()) {
      const jourCible = Math.min(joursRestants - 1, Math.floor(i / parJour));
      const dateCible = new Date(Date.now() + jourCible * JOUR).toISOString();
      if (new Date(n.progression.prochaineRevision) > new Date(dateCible)) await Store.modifier("notions", n.id, { progression: { ...n.progression, prochaineRevision: dateCible } });
    }
  },
};
