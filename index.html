  rendreOnglet(cours, chapitres, notions){
    const zone = document.getElementById("contenuOngletCours");
    if (PageCoursDetail.onglet === "lecture") {
      const paragraphesHtml = cours.contenu.split(/\n{2,}/).map(bloc => {
        const titreMd = bloc.match(/^#{1,3}\s+(.+)/);
        if (titreMd) return `<h3>${Utils.echapperHtml(titreMd[1])}</h3>`;
        let echappe = Utils.echapperHtml(bloc);
        notions.forEach(n => {
          const extrait = Utils.echapperHtml(n.reponse.length <= 200 ? n.reponse : n.reponse.slice(0, 90));
          if (extrait.length > 10 && echappe.includes(extrait) && !echappe.includes(`>${extrait}<`)) {
            echappe = echappe.replace(extrait, `<mark style="background:var(--primaire-clair);color:var(--primaire);border-radius:3px;padding:0 .2rem">${extrait}</mark>`);

        });
        return `<p>${echappe.replace(/\n/g,"<br>").replace(/^([-*•]|\d+[.)])\s+/gm,"• ")}</p>`;

      <div class="liste-chapitres mb-lg">
        ${chapitres.map(ch => {
          const notionsChap = notions.filter(n => n.chapitreId === ch.id);
          const moy = notionsChap.length ? Math.round(notionsChap.reduce((s,n)=>s+n.progression.maitriseActuelle,0)/notionsChap.length) : 0;
          const statutDominant = notionsChap.length ? (moy>=75?"vert":moy>=50?"jaune":moy>=25?"orange":"rouge") : "rouge";

        }).join("")}
      </div>
      <h2 class="mb-sm">Notions (${notions.length})</h2>
      <div class="flex-col gap-sm">
        ${notions.map(n => `<a href="#/notion/${n.id}" class="carte carte-cliquable flex items-centre gap-sm">
          ${icono(TYPES_NOTION[n.type]?.icone || "cerveau","icone-sm")}
          <span class="flex-1 tronque">${Utils.echapperHtml(n.titre)}</span>
          ${badgeStatut(n.progression.statut)}
        </a>`).join("")}
      </div>`;
    zone.querySelectorAll("[data-interroger-chapitre]").forEach(b => b.addEventListener("click", (e) => {
      e.preventDefault();
      const chapitreId = b.dataset.interrogerChapitre;
      const notionsChap = notions.filter(n => n.chapitreId === chapitreId);
      PageSession.demarrer("interrogation", { notions: notionsChap, chapitreId });
    }));
  },

  attacherOptions(principal, cours){
    principal.querySelector("[data-options-cours]")?.addEventListener("click", (e) => {
      e.stopPropagation();
      const html = `
        <button class="item-menu" data-opt="favori">${icono("etoile","icone-sm")} ${cours.favori?"Retirer des favoris":"Ajouter aux favoris"}</button>
        <button class="item-menu" data-opt="editer">${icono("crayon","icone-sm")} Modifier</button>
        <button class="item-menu" data-opt="dupliquer">${icono("dossier","icone-sm")} Dupliquer</button>
        <button class="item-menu" data-opt="archiver">${icono("dossier","icone-sm")} ${cours.archive?"Désarchiver":"Archiver"}</button>
        <button class="item-menu danger" data-opt="supprimer">${icono("poubelle","icone-sm")} Supprimer</button>
      `;
      const panneau = Coquille.ouvrirMenuDeroulant(e.currentTarget, html);
      const retour = cours.origine === "rapide" ? "cartes" : "cours";
      panneau.querySelector('[data-opt="favori"]').onclick = async () => { await Store.modifier("cours", cours.id, { favori: !cours.favori }); panneau.remove(); PageCoursDetail.rendre({ id: cours.id }); };
      panneau.querySelector('[data-opt="editer"]').onclick = () => Routeur.aller(`cours/${cours.id}/editer`);
      panneau.querySelector('[data-opt="dupliquer"]').onclick = async () => {
        // Un paquet CartesFacile n'a pas de texte à ré-analyser : on recopie directement
        // ses cartes. Un cours normal, lui, ne duplique que le texte source (comportement
        // d'origine, inchangé) — l'utilisateur le ré-analysera s'il le souhaite.
        const copie = cours.origine === "rapide"
          ? await Store.dupliquerCoursAvecNotions(cours.id)
          : await Store.ajouter("cours", { titre: cours.titre + " (copie)", matiereId: cours.matiereId, contenu: cours.contenu, favori: false, archive: false });
        Toast.succes("Dupliqué."); Routeur.aller(`${retour}/${copie.id}`);
      };
      panneau.querySelector('[data-opt="archiver"]').onclick = async () => { await Store.modifier("cours", cours.id, { archive: !cours.archive }); panneau.remove(); Routeur.aller(retour); };
      panneau.querySelector('[data-opt="supprimer"]').onclick = async () => {
        panneau.remove();
        const ok = await confirmerAction({ titre: "Supprimer ce cours ?", message: "Toutes ses notions et sa progression seront perdues définitivement.", libelleConfirmer: "Supprimer", danger: true });
        if (ok) { await Store.supprimerCours(cours.id); Toast.succes("Cours supprimé."); Routeur.aller(retour); }
      };
    });
  },
};

    principal.querySelector("[data-tout-accepter]").addEventListener("click", async () => {
      for (const n of Selecteurs.notionsAValiderDeCours(cours.id)) await PageValidation.garder(n);
      verifierFin();
    });
    principal.querySelectorAll("[data-carte-notion]").forEach(carte => {
      const id = carte.dataset.carteNotion;
      const notion = Selecteurs.notion(id);
      carte.querySelector("[data-garder]").addEventListener("click", async () => { await PageValidation.garder(notion); carte.remove(); verifierFin(); });
      carte.querySelector("[data-supprimer]").addEventListener("click", async () => { await Store.supprimer("notions", id); carte.remove(); verifierFin(); });
      carte.querySelector("[data-modifier]").addEventListener("click", () => {
        ouvrirFormulaire({
          titre: "Modifier la notion", valeurs: { ...notion, elements: (notion.elements||[]).join(", ") },
          champs: [
            { cle: "titre", label: "Titre", type: "texte", requis: true },
            { cle: "question", label: "Question", type: "texte", requis: true },
            { cle: "reponse", label: "Réponse attendue", type: "zone", requis: true },
            { cle: "elements", label: "Éléments essentiels", type: "texte", aide: "Séparés par des virgules." },
          ],
          onValider: async (v) => {
            await PageValidation.garder(notion, { titre: v.titre, question: v.question, reponse: v.reponse, elements: v.elements.split(",").map(e=>e.trim()).filter(Boolean) });
            carte.remove(); verifierFin();
          },
        });
      });
    });
  },
};

// Modifier ou supprimer une définition déjà validée — jusqu'ici possible nulle part une fois
// la notion acceptée, ce qui rendait la suppression d'une définition invisible/introuvable
// pour l'utilisateur. Réutilisé par PageNotion (détail) et PageDefinitions (liste) : même
// modale partout, avec le bouton "Supprimer" intégré et sa confirmation (ouvrirFormulaire).
function ouvrirEditionNotion(notion, apresAction){
  ouvrirFormulaire({
    titre: "Modifier la définition",
    champs: [
      { cle: "titre", type: "texte", label: "Terme", requis: true },
      { cle: "reponse", type: "zone", label: "Définition", requis: true, placeholder: "La définition complète..." },
    ],
    valeurs: { titre: notion.titre, reponse: notion.reponse },
    texteValider: "Enregistrer",
    onValider: async (v) => {
      const nouveauTitre = v.titre.trim();
      const nouvelleReponse = v.reponse.trim();
      if (!nouveauTitre || !nouvelleReponse) return;
      // La question garde sa formulation d'origine (« Qu'est-ce que… », « Que signifie… »,
      // etc.) — seul l'ancien terme y est remplacé par le nouveau, plutôt que de la
      // reconstruire et perdre la phrase que l'analyseur avait choisie.
      const nouvelleQuestion = notion.question?.includes(notion.titre)
        ? notion.question.replace(notion.titre, nouveauTitre) : notion.question;
      await Store.modifier("notions", notion.id, {
        titre: nouveauTitre, reponse: nouvelleReponse, question: nouvelleQuestion,
        elements: Analyseur.extraireElements(nouvelleReponse),
      });
      Toast.succes("Définition modifiée.");
      apresAction?.(false);
    },
    onSupprimer: async () => {
      await Store.supprimerNotion(notion.id);
      Toast.succes("Définition supprimée.");
      apresAction?.(true);
    },
  });
}

// Recherche globale (§36) : matières, cours, définitions et évaluations passées, au même
// endroit — accessible depuis l'icône loupe de l'en-tête sur n'importe quelle page.
function ouvrirRechercheGlobale(){
  const ligneResultat = (icone, titre, sousTitre, route) => `<a href="#/${route}" class="carte carte-cliquable flex items-centre gap-sm" data-resultat>${icono(icone,"icone-sm")}<div class="flex-1" style="min-width:0"><div class="texte-petit texte-semi tronque">${titre}</div>${sousTitre ? `<div class="texte-xs texte-2 tronque">${sousTitre}</div>` : ""}</div></a>`;
  const rendreResultats = (q) => {
    const r = Utils.normaliserTexte(q.trim());
    if (!r) return `<p class="texte-2 texte-petit">Tape pour chercher parmi tes matières, cours, définitions et évaluations.</p>`;
    const matieres = Etat.donnees.matieres.filter(m => Utils.normaliserTexte(m.nom).includes(r));
    const cours = Etat.donnees.cours.filter(c => !c.archive && Utils.normaliserTexte(c.titre).includes(r));
    const notions = Selecteurs.toutesNotionsValidees().filter(n => Utils.normaliserTexte(n.titre).includes(r) || Utils.normaliserTexte(n.reponse).includes(r)).slice(0, 25);
    const evaluations = Selecteurs.evaluations().filter(e => (e.details||[]).some(d => Utils.normaliserTexte(d.titre||"").includes(r)));
    if (!matieres.length && !cours.length && !notions.length && !evaluations.length) return `<p class="texte-2 texte-petit">Aucun résultat pour « ${Utils.echapperHtml(q)} ».</p>`;
    let html = "";
    if (matieres.length) html += `<h4 class="texte-xs texte-2 mt-md mb-xs" style="text-transform:uppercase">Matières</h4><div class="flex-col gap-xs">${matieres.map(m => ligneResultat("livre", Utils.echapperHtml(m.nom), null, `cours?matiere=${m.id}`)).join("")}</div>`;
    if (cours.length) html += `<h4 class="texte-xs texte-2 mt-md mb-xs" style="text-transform:uppercase">Cours &amp; paquets</h4><div class="flex-col gap-xs">${cours.map(c => ligneResultat(c.origine==="rapide"?"zap":"livre_ouvert", Utils.echapperHtml(c.titre), Selecteurs.matiere(c.matiereId)?.nom, `${c.origine==="rapide"?"cartes":"cours"}/${c.id}`)).join("")}</div>`;
    if (notions.length) html += `<h4 class="texte-xs texte-2 mt-md mb-xs" style="text-transform:uppercase">Définitions</h4><div class="flex-col gap-xs">${notions.map(n => ligneResultat("cerveau", Utils.echapperHtml(n.titre), Utils.echapperHtml(n.reponse.slice(0,60)), `notion/${n.id}`)).join("")}</div>`;
    if (evaluations.length) html += `<h4 class="texte-xs texte-2 mt-md mb-xs" style="text-transform:uppercase">Évaluations passées</h4><div class="flex-col gap-xs">${evaluations.map(e => ligneResultat("cible", `${e.reussites} / ${e.total} correctes`, Utils.formaterDateCourte(e.dateCreation), `evaluations/resultats/${e.id}`)).join("")}</div>`;
    return html;
  };
  const html = `
    <div class="entete-modale"><h3>Rechercher</h3><button class="bouton-icone" data-fermer aria-label="Fermer">${icono("croix")}</button></div>
    <div class="recherche-entete" style="width:100%">${icono("recherche","icone-sm")}<input type="search" id="rechercheGlobaleInput" placeholder="Matières, cours, définitions, évaluations..." style="width:100%"></div>
    <div id="rechercheGlobaleResultats" class="mt-sm">${rendreResultats("")}</div>
  `;
  Modale.ouvrir(html, { classe: "modale-formulaire" });
  const modaleEl = Modale.pile[Modale.pile.length - 1].el;
  modaleEl.querySelector("[data-fermer]").addEventListener("click", () => Modale.fermer());
  const zoneResultats = modaleEl.querySelector("#rechercheGlobaleResultats");
  const champ = modaleEl.querySelector("#rechercheGlobaleInput");
  champ.addEventListener("input", Utils.debounce(() => { zoneResultats.innerHTML = rendreResultats(champ.value); zoneResultats.querySelectorAll("[data-resultat]").forEach(a => a.addEventListener("click", () => Modale.fermer())); }, 200));
}

        ${ETAPES_MAITRISE.map((e, i) => `<div class="etape-maitrise ${i < p.etapeIndex ? "faite" : i === p.etapeIndex ? "actuelle" : "attente"}"><span class="puce-etape-maitrise">${i < p.etapeIndex ? icono("coche","icone-sm") : i+1}</span>${e.libelle}${i===p.etapeIndex ? ` <span class="texte-petit">(en cours)</span>` : ""}</div>`).join("")}
      </div></div>

      <h2 class="mb-sm">Historique</h2>
      <div class="carte">
        ${historique.length ? historique.slice(0,15).map(h => `<div class="ligne-historique">
          ${h.resultat===true ? icono("coche_cercle","icone-sm") : h.resultat==="partiel" ? icono("info","icone-sm") : icono("croix_cercle","icone-sm")}
          <div class="flex-1"><div class="texte-petit texte-semi">${TYPES_EXERCICE[h.typeExercice]||h.typeExercice} — ${h.resultat===true?"Correct":h.resultat==="partiel"?"Partiel":"Incorrect"}</div>
          ${h.elementsManques?.length ? `<div class="texte-xs texte-2">Oublié : ${h.elementsManques.join(", ")}</div>` : ""}</div>
          <span class="texte-xs texte-3">${Utils.formaterDateRelative(h.date)}</span>
        </div>`).join("") : `<p class="texte-2 texte-petit">Pas encore de révision pour cette notion.</p>`}
      </div>
    `;
    principal.querySelector("[data-travailler-manque]")?.addEventListener("click", () => PageSession.demarrer("cible", { notions: [notion] }));
    // "forcer" : rien n'est jamais verrouillé (§ TOUT PEUT ÊTRE REFAIT À L'INFINI) — même une
    // notion déjà maîtrisée à 100% reste réapprenable/révisable à la demande, sans attendre
    // qu'elle redevienne "nouvelle" ou "due". Ça ne réinitialise ni l'historique ni la
    // maîtrise existante : c'est juste une nouvelle tentative de plus.
    principal.querySelector("[data-reapprendre]").addEventListener("click", () => PageSession.demarrer("apprentissage", { notions: [notion], forcer: true }));
    principal.querySelector("[data-reviser-maintenant]").addEventListener("click", () => PageSession.demarrer("reviser", { notions: [notion], forcer: true }));
    principal.querySelector("[data-evaluer-notion]").addEventListener("click", () => { Etat.ui.selectionEvaluation = [notion.id]; Routeur.aller("evaluations/nouvelle"); });
    principal.querySelector("[data-options-notion]").addEventListener("click", (e) => {
      e.stopPropagation();
      const html = `
        <button class="item-menu" data-opt="favori">${icono("etoile","icone-sm")} ${notion.favori?"Retirer des favoris":"Ajouter aux favoris"}</button>
        <button class="item-menu" data-opt="dupliquer">${icono("dossier","icone-sm")} Dupliquer</button>
        <button class="item-menu" data-opt="modifier">${icono("crayon","icone-sm")} Modifier</button>
        <button class="item-menu danger" data-opt="supprimer">${icono("poubelle","icone-sm")} Supprimer</button>
      `;
      const panneau = Coquille.ouvrirMenuDeroulant(e.currentTarget, html);
      panneau.querySelector('[data-opt="favori"]').onclick = async () => { panneau.remove(); await Store.modifier("notions", notion.id, { favori: !notion.favori }); PageNotion.rendre({ id }); };
      panneau.querySelector('[data-opt="dupliquer"]').onclick = async () => { panneau.remove(); const copie = await Store.dupliquerNotion(notion); Toast.succes("Définition dupliquée."); Routeur.aller(`notion/${copie.id}`); };
      panneau.querySelector('[data-opt="modifier"]').onclick = () => { panneau.remove(); ouvrirEditionNotion(notion, () => PageNotion.rendre({ id })); };
      panneau.querySelector('[data-opt="supprimer"]').onclick = async () => {
        panneau.remove();
        const ok = await confirmerAction({ titre: "Supprimer cette définition ?", message: "Son historique de révisions sera aussi supprimé. Cette action est définitive.", libelleConfirmer: "Supprimer", danger: true });
        if (ok) { await Store.supprimerNotion(notion.id); Toast.succes("Définition supprimée."); Routeur.aller(cours ? `cours/${cours.id}` : "definitions"); }
      };
    });
  },
};

/* ==================== G5b. DÉFINITIONS (vue d'ensemble) ==================== */
// Objectif de cette page : apprendre précisément des définitions et être capable de les
// restituer entièrement — distinct de CartesFacile (G2c), pensé pour un usage plus simple
// et rapide. Les deux s'appuient sur les mêmes notions Firestore, mais n'affichent jamais
// les mêmes actions : ici, la sélection multiple sert à construire une Évaluation (G8b).
const PageDefinitions = {
  filtres: { recherche: "", matiereId: "", coursId: "", chapitreId: "", niveau: "toutes" },
  selection: new Set(),

  rendre(){
    const principal = document.getElementById("contenu-principal");
    const toutes = Selecteurs.toutesNotionsValidees();
    const f = PageDefinitions.filtres;
    let notions = toutes;
    if (f.matiereId) notions = notions.filter(n => n.matiereId === f.matiereId);
    if (f.coursId) notions = notions.filter(n => n.coursId === f.coursId);
    if (f.chapitreId) notions = notions.filter(n => n.chapitreId === f.chapitreId);
    if (f.niveau === "a_apprendre") notions = notions.filter(n => n.progression.etapeIndex === 0);
    else if (f.niveau === "fragiles") notions = notions.filter(n => ["rouge","orange"].includes(n.progression.statut));
    else if (f.niveau === "maitrisees") notions = notions.filter(n => ["vert","bleu"].includes(n.progression.statut));
    else if (f.niveau === "favoris") notions = notions.filter(n => n.favori);
    if (f.recherche) {
      const r = Utils.normaliserTexte(f.recherche);
      notions = notions.filter(n => Utils.normaliserTexte(n.titre).includes(r) || Utils.normaliserTexte(n.reponse).includes(r));
    }
    notions.sort((a,b) => Revision.calculerPriorite(b) - Revision.calculerPriorite(a));
    // Un filtre ne doit jamais laisser une sélection "fantôme" sur des cartes qui ne sont
    // plus affichées — sans ça, "Créer une évaluation" pourrait inclure des définitions
    // invisibles à l'écran, ce qui serait très surprenant.
    const idsVisibles = new Set(notions.map(n => n.id));
    for (const id of [...PageDefinitions.selection]) if (!idsVisibles.has(id)) PageDefinitions.selection.delete(id);

    const coursOptions = f.matiereId ? Etat.donnees.cours.filter(c => c.matiereId === f.matiereId && !c.archive) : [];
    const chapitreOptions = f.coursId ? Selecteurs.chapitresDeCours(f.coursId) : [];

    principal.innerHTML = `
      <p class="texte-2 mb-lg">Apprends précisément tes définitions et vérifie ce que tu es réellement capable de restituer.</p>
      <div class="flex items-centre justify-entre flex-wrap gap-sm mb-md">
        <div class="recherche-entete">${icono("recherche","icone-sm")}<input type="search" placeholder="Rechercher une définition..." value="${Utils.echapperHtml(f.recherche)}" data-recherche-def></div>

      <div class="flex gap-sm flex-wrap mb-sm">
        <select class="champ" style="width:auto" data-filtre="matiereId"><option value="">Toutes les matières</option>${Etat.donnees.matieres.map(m => `<option value="${m.id}" ${f.matiereId===m.id?"selected":""}>${Utils.echapperHtml(m.nom)}</option>`).join("")}</select>
        <select class="champ" style="width:auto" data-filtre="coursId" ${coursOptions.length?"":"disabled"}><option value="">Tous les dossiers</option>${coursOptions.map(c => `<option value="${c.id}" ${f.coursId===c.id?"selected":""}>${Utils.echapperHtml(c.titre)}</option>`).join("")}</select>
        <select class="champ" style="width:auto" data-filtre="chapitreId" ${chapitreOptions.length?"":"disabled"}><option value="">Tous les chapitres</option>${chapitreOptions.map(ch => `<option value="${ch.id}" ${f.chapitreId===ch.id?"selected":""}>${Utils.echapperHtml(ch.titre)}</option>`).join("")}</select>
      </div>
      <div class="onglets mb-lg" style="border-bottom:none;flex-wrap:wrap">
        ${[["toutes","Toutes"],["a_apprendre","À apprendre"],["fragiles","Fragiles"],["maitrisees","Maîtrisées"],["favoris","★ Favoris"]].map(([v,l]) => `<button class="badge ${f.niveau===v?"badge-neutre":""}" style="cursor:pointer;border:1px solid var(--bordure)" data-niveau="${v}">${l}</button>`).join("")}
      </div>
      <div class="flex items-centre justify-entre flex-wrap gap-sm mb-md">
        <span class="texte-2 texte-petit">${notions.length} définition${notions.length>1?"s":""}${PageDefinitions.selection.size ? ` · ${PageDefinitions.selection.size} sélectionnée${PageDefinitions.selection.size>1?"s":""}` : ""}</span>
        <div class="flex gap-sm flex-wrap">
          <button class="bouton bouton-contour bouton-sm" data-tout-selectionner>${icono("coche","icone-xs")} Tout sélectionner</button>
          <button class="bouton bouton-contour bouton-sm" data-deselectionner ${PageDefinitions.selection.size?"":"disabled"}>Désélectionner</button>
        </div>
      </div>
      ${notions.length ? `<div class="flex-col gap-sm" id="listeDefinitions">${notions.map(n => PageDefinitions.carteHtml(n)).join("")}</div>`
        : carteVide("cerveau", toutes.length ? "Aucune définition ne correspond" : "Aucune définition pour l'instant", toutes.length ? "Essaie une autre recherche ou un autre filtre." : "Crée un cours ou des cartes rapides pour commencer.")}
      <div class="barre-selection-flottante ${PageDefinitions.selection.size ? "visible" : ""}">
        <span class="texte-petit texte-semi">${PageDefinitions.selection.size} sélectionnée${PageDefinitions.selection.size>1?"s":""}</span>
        <div class="flex gap-sm flex-wrap">

  carteHtml(n){
    const cochee = PageDefinitions.selection.has(n.id);
    const p = n.progression;
    return `<div class="carte carte-definition ${cochee?"selectionnee":""}" data-carte-def="${n.id}">
      <div class="flex gap-sm" style="align-items:flex-start">
        <input type="checkbox" data-case-def="${n.id}" ${cochee?"checked":""} style="width:20px;height:20px;accent-color:var(--primaire);cursor:pointer;flex-shrink:0;margin-top:.2rem">
        <div class="flex-1" style="min-width:0">
          <div class="flex items-centre justify-entre gap-sm flex-wrap">
            <a href="#/notion/${n.id}" class="texte-semi tronque">${Utils.echapperHtml(n.titre)}</a>
            <div class="flex items-centre gap-xs">
              ${n.favori ? icono("etoile","icone-sm") : ""}
              ${badgeStatut(p.statut)}
              <button type="button" class="bouton-icone" data-options-def="${n.id}" aria-label="Options">${icono("points_verticaux")}</button>
            </div>
          </div>
          <p class="texte-2 texte-petit mt-xs" style="display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden">${Utils.echapperHtml(n.reponse)}</p>
          <div class="flex gap-md flex-wrap texte-xs texte-2 mt-xs">
            <span>Maîtrise : <strong>${p.maitriseActuelle}%</strong></span>
            <span>Durable : <strong>${p.maitriseDurable}%</strong></span>
            <span>Prochaine révision : <strong>${Utils.formaterDateRelative(p.prochaineRevision)}</strong></span>
          </div>
          ${(p.elementsOublies||[]).length ? `<div class="liste-elements-verifies mt-xs">${p.elementsOublies.slice(0,6).map(e => `<span class="element-verifie oublie">${icono("croix","icone-xs")}${Utils.echapperHtml(e)}</span>`).join("")}</div>` : ""}
        </div>
      </div>
    </div>`;
  },

  attacher(principal, notions){
    principal.querySelector("[data-recherche-def]").addEventListener("input", Utils.debounce((e) => { PageDefinitions.filtres.recherche = e.target.value; PageDefinitions.rendre(); }, 250));
    principal.querySelector('[data-filtre="matiereId"]').addEventListener("change", (e) => { PageDefinitions.filtres.matiereId = e.target.value; PageDefinitions.filtres.coursId = ""; PageDefinitions.filtres.chapitreId = ""; PageDefinitions.rendre(); });
    principal.querySelector('[data-filtre="coursId"]').addEventListener("change", (e) => { PageDefinitions.filtres.coursId = e.target.value; PageDefinitions.filtres.chapitreId = ""; PageDefinitions.rendre(); });
    principal.querySelector('[data-filtre="chapitreId"]').addEventListener("change", (e) => { PageDefinitions.filtres.chapitreId = e.target.value; PageDefinitions.rendre(); });
    principal.querySelectorAll("[data-niveau]").forEach(b => b.addEventListener("click", () => { PageDefinitions.filtres.niveau = b.dataset.niveau; PageDefinitions.rendre(); }));
    principal.querySelectorAll("[data-case-def]").forEach(c => c.addEventListener("change", () => {
      if (c.checked) PageDefinitions.selection.add(c.dataset.caseDef); else PageDefinitions.selection.delete(c.dataset.caseDef);
      PageDefinitions.rendre();
    }));
    principal.querySelector("[data-tout-selectionner]").addEventListener("click", () => { notions.forEach(n => PageDefinitions.selection.add(n.id)); PageDefinitions.rendre(); });
    principal.querySelector("[data-deselectionner]").addEventListener("click", () => { PageDefinitions.selection.clear(); PageDefinitions.rendre(); });
    principal.querySelector("[data-travailler-oublis]").addEventListener("click", () => {
      const cible = PageDefinitions.selection.size
        ? notions.filter(n => PageDefinitions.selection.has(n.id))
        : Selecteurs.toutesNotionsValidees().filter(n => (n.progression.elementsOublies||[]).length);
      if (!cible.length) return Toast.afficher("Aucun élément oublié à retravailler pour l'instant.", "info");
      PageSession.demarrer("cible", { notions: cible });

    principal.querySelector("[data-creer-evaluation]").addEventListener("click", () => {
      if (!PageDefinitions.selection.size) return Toast.erreur("Sélectionne au moins une définition.");

    principal.querySelectorAll("[data-options-def]").forEach(b => b.addEventListener("click", (e) => {

        <button class="item-menu" data-opt="favori">${icono("etoile","icone-sm")} ${notion.favori?"Retirer des favoris":"Ajouter aux favoris"}</button>
        <button class="item-menu" data-opt="dupliquer">${icono("dossier","icone-sm")} Dupliquer</button>

      panneau.querySelector('[data-opt="reapprendre"]').onclick = () => { panneau.remove(); PageSession.demarrer("apprentissage", { notions: [notion], forcer: true }); };
      panneau.querySelector('[data-opt="reviser"]').onclick = () => { panneau.remove(); PageSession.demarrer("reviser", { notions: [notion], forcer: true }); };
      panneau.querySelector('[data-opt="favori"]').onclick = async () => { panneau.remove(); await Store.modifier("notions", notion.id, { favori: !notion.favori }); PageDefinitions.rendre(); };
      panneau.querySelector('[data-opt="dupliquer"]').onclick = async () => { panneau.remove(); await Store.dupliquerNotion(notion); Toast.succes("Définition dupliquée."); PageDefinitions.rendre(); };
      panneau.querySelector('[data-opt="modifier"]').onclick = () => { panneau.remove(); ouvrirEditionNotion(notion, () => PageDefinitions.rendre()); };
      panneau.querySelector('[data-opt="supprimer"]').onclick = async () => {

        if (ok) { await Store.supprimerNotion(notion.id); Toast.succes("Définition supprimée."); PageDefinitions.rendre(); }
