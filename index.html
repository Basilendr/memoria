// champs: { cle, label, type: texte|zone|select|nombre|date|coche|couleur, options, requis, avance, aide, placeholder }
function rendreChamp(champ, valeurs){
  const val = valeurs?.[champ.cle];
  const requis = champ.requis ? "required" : "";
  const aide = champ.aide ? `<span class="aide-champ">${Utils.echapperHtml(champ.aide)}</span>` : "";
  let entree = "";
  switch (champ.type) {
    case "zone":
      entree = `<textarea class="champ" name="${champ.cle}" placeholder="${Utils.echapperHtml(champ.placeholder||"")}" ${requis}>${Utils.echapperHtml(val ?? "")}</textarea>`;
      break;
    case "select":
      entree = `<select class="champ" name="${champ.cle}" ${requis}>${(champ.options||[]).map(o => `<option value="${Utils.echapperHtml(o.valeur)}" ${String(o.valeur)===String(val)?"selected":""}>${Utils.echapperHtml(o.libelle)}</option>`).join("")}</select>`;
      break;
    case "nombre":
      entree = `<input class="champ" type="number" name="${champ.cle}" value="${val ?? ""}" min="${champ.min ?? ""}" max="${champ.max ?? ""}" ${requis}>`;
      break;
    case "date":
      entree = `<input class="champ" type="date" name="${champ.cle}" value="${val ?? ""}" ${requis}>`;
      break;
    case "heure":
      entree = `<input class="champ" type="time" name="${champ.cle}" value="${val ?? ""}" ${requis}>`;
      break;
    case "motdepasse":
      entree = `<input class="champ" type="password" name="${champ.cle}" autocomplete="${champ.autocomplete||"new-password"}" ${requis}>`;
      break;
    case "coche":
      return `<label class="case-a-cocher"><input type="checkbox" name="${champ.cle}" ${val ? "checked" : ""}><span>${Utils.echapperHtml(champ.label)}</span></label>${aide}`;
    case "couleur":
      entree = `<div class="grille-couleurs" data-couleurs="${champ.cle}">${COULEURS_MATIERE.map((c,i) => `<button type="button" class="pastille-couleur ${val===c?"actif":(!val && i===0 ? "actif":"")}" data-valeur="${c}" style="background:${c}" aria-label="Couleur ${i+1}"></button>`).join("")}<input type="hidden" name="${champ.cle}" value="${val || COULEURS_MATIERE[0]}"></div>`;
      break;
    default:
      entree = `<input class="champ" type="text" name="${champ.cle}" value="${Utils.echapperHtml(val ?? "")}" placeholder="${Utils.echapperHtml(champ.placeholder||"")}" ${requis}>`;
  }
  return `<div class="groupe-champ"><label>${Utils.echapperHtml(champ.label)}</label>${entree}${aide}</div>`;
}
function ouvrirFormulaire({ titre, champs, valeurs = {}, texteValider = "Enregistrer", onValider, onSupprimer }){
  const principaux = champs.filter(c => !c.avance);
  const avances = champs.filter(c => c.avance);
  const html = `
    <div class="entete-modale"><h3>${Utils.echapperHtml(titre)}</h3>
      <button class="bouton-icone" data-fermer aria-label="Fermer">${icono("croix")}</button>
    </div>
    <form data-formulaire-generique>
      ${principaux.map(c => rendreChamp(c, valeurs)).join("")}
      ${avances.length ? `<details class="details-supplementaires"><summary>${icono("chevron_bas","icone-sm")} Options supplémentaires</summary>${avances.map(c => rendreChamp(c, valeurs)).join("")}</details>` : ""}
      <div class="pied-modale">
        ${onSupprimer ? `<button type="button" class="bouton bouton-danger" data-supprimer style="margin-right:auto">${icono("poubelle","icone-sm")} Supprimer</button>` : ""}
        <button type="button" class="bouton bouton-fantome" data-fermer>Annuler</button>
        <button type="submit" class="bouton bouton-primaire">${Utils.echapperHtml(texteValider)}</button>
      </div>
    </form>
  `;
  Modale.ouvrir(html, { classe: "modale-formulaire" });
  const modaleEl = Modale.pile[Modale.pile.length - 1].el;
  modaleEl.querySelectorAll("[data-fermer]").forEach(b => b.addEventListener("click", () => Modale.fermer()));
  modaleEl.querySelectorAll("[data-couleurs]").forEach(groupe => {
    groupe.querySelectorAll(".pastille-couleur").forEach(pastille => {
      pastille.addEventListener("click", () => {
        groupe.querySelectorAll(".pastille-couleur").forEach(p => p.classList.remove("actif"));
        pastille.classList.add("actif");
        groupe.querySelector("input[type=hidden]").value = pastille.dataset.valeur;
      });
    });
  });
  if (onSupprimer) {
    modaleEl.querySelector("[data-supprimer]").addEventListener("click", async () => {
      const ok = await confirmerAction({ titre: "Confirmer la suppression", message: "Cette action est définitive.", libelleConfirmer: "Supprimer", danger: true });
      if (ok) { Modale.fermer(); onSupprimer(); }
    });
  }
  const formulaire = modaleEl.querySelector("[data-formulaire-generique]");
  formulaire.addEventListener("submit", async (e) => {
    e.preventDefault();
    const donnees = new FormData(formulaire);
    const resultat = {};
    for (const champ of champs) {
      if (champ.type === "coche") resultat[champ.cle] = formulaire.querySelector(`[name="${champ.cle}"]`).checked;
      else if (champ.type === "nombre") resultat[champ.cle] = donnees.get(champ.cle) === "" ? null : Number(donnees.get(champ.cle));
      else resultat[champ.cle] = donnees.get(champ.cle);
    }
    const boutonValider = formulaire.querySelector('button[type="submit"]');
    boutonValider.disabled = true;
    try {
      await onValider(resultat);
      Modale.fermer();
    } catch (err) {
      console.error("Échec de la validation du formulaire :", err?.code, err?.message, err);
      Toast.erreur(err?.message || "Une erreur est survenue.");
      boutonValider.disabled = false;
    }
  });
  return modaleEl;
}

/* ==================== C. ÉTAT GLOBAL & ACCÈS AUX DONNÉES ==================== */

// Chaque notion porte sa progression directement en champ ("progression"), plutôt que
// dans une collection séparée : les deux sont toujours lus/écrits ensemble, et ça évite
// une jointure côté client à chaque file de révision. Les exercices, eux, ne sont jamais
// stockés : ils sont régénérés à la volée par le Moteur (section D) à partir des champs
// de la notion — seuls la notion, son historique et ses sessions sont persistés.
const COLLECTIONS = ["matieres", "cours", "chapitres", "notions", "historique", "sessions", "examens", "evaluations", "controles", "notifications"];

const Etat = {
  uid: null,
  demo: MODE_DEMO,
  profil: null,
  donnees: null,
  ui: { pageActuelle: "dashboard", parametresPage: {}, menuPlusOuvert: false, selectionEvaluation: null },
};

const Store = {
  _donneesVides(){ return Object.fromEntries(COLLECTIONS.map(c => [c, []])); },
  // Scopée par compte : sans ça, deux comptes démo créés sur le même navigateur
  // partageaient purement et simplement les mêmes données (l'un pouvait écraser
  // les cours de l'autre), ce qui viole l'isolation par utilisateur promise partout
  // ailleurs dans l'app. "demo-invite" (compte invité) reste une clé fixe à part :
  // c'est un accès volontairement partagé, sans identifiant propre.
  _cleDemo(){ return `memoria-demo-donnees-${Etat.uid || "invite"}`; },
  _sauverDemo(){
    localStorage.setItem(Store._cleDemo(), JSON.stringify({ profil: Etat.profil, donnees: Etat.donnees }));
  },

  async chargerTout(uid){
    Etat.uid = uid;
    if (Etat.demo) {
      const brut = localStorage.getItem(Store._cleDemo());
      if (brut) {
        const j = JSON.parse(brut);
        Etat.profil = j.profil;
        Etat.donnees = { ...Store._donneesVides(), ...j.donnees };
      } else {
        Etat.profil = null;
        Etat.donnees = Store._donneesVides();
      }
    } else {
      const profilSnap = await getDoc(doc(db, "users", uid));
      Etat.profil = profilSnap.exists() ? profilSnap.data() : null;
      Etat.donnees = Store._donneesVides();
      await Promise.all(COLLECTIONS.map(async (c) => {
        const snap = await getDocs(collection(db, "users", uid, c));
        Etat.donnees[c] = snap.docs.map(d => d.data());
      }));
    }
  },

  async sauvegarderProfil(partiel){
    Etat.profil = { ...Etat.profil, ...partiel };
    if (Etat.demo) Store._sauverDemo();
    else await setDoc(doc(db, "users", Etat.uid), Etat.profil, { merge: true });
    return Etat.profil;
  },

  async ajouter(nomCollection, data){
    const enregistrement = { id: Utils.genererId(), dateCreation: new Date().toISOString(), ...data };
    Etat.donnees[nomCollection].push(enregistrement);
    if (Etat.demo) Store._sauverDemo();
    else await setDoc(doc(db, "users", Etat.uid, nomCollection, enregistrement.id), enregistrement);
    return enregistrement;
  },

  async modifier(nomCollection, id, partiel){
    const liste = Etat.donnees[nomCollection];
    const index = liste.findIndex(x => x.id === id);
    if (index === -1) return null;
    liste[index] = { ...liste[index], ...partiel };
    if (Etat.demo) Store._sauverDemo();
    else await updateDoc(doc(db, "users", Etat.uid, nomCollection, id), partiel);
    return liste[index];
  },

  async supprimer(nomCollection, id){
    Etat.donnees[nomCollection] = Etat.donnees[nomCollection].filter(x => x.id !== id);
    if (Etat.demo) Store._sauverDemo();
    else await deleteDoc(doc(db, "users", Etat.uid, nomCollection, id));
  },

  // Suppression en cascade pour les entités parentes (matière, cours) : retire aussi
  // tout ce qui en dépend, pour ne jamais laisser de notions orphelines dans les révisions.
  async supprimerMatiere(matiereId){
    const cours = Etat.donnees.cours.filter(c => c.matiereId === matiereId);
    for (const c of cours) await Store.supprimerCours(c.id);
    await Store.supprimer("matieres", matiereId);
  },
  async supprimerCours(coursId){
    const notions = Etat.donnees.notions.filter(n => n.coursId === coursId);
    for (const n of notions) {
      Etat.donnees.historique = Etat.donnees.historique.filter(h => h.notionId !== n.id);
      await Store.supprimer("notions", n.id);
    }
    const chapitres = Etat.donnees.chapitres.filter(ch => ch.coursId === coursId);
    for (const ch of chapitres) await Store.supprimer("chapitres", ch.id);
    if (Etat.demo) Store._sauverDemo();
    await Store.supprimer("cours", coursId);
  },

  // Supprimer UNE définition/notion précise (contrairement à supprimerCours, qui supprime
  // tout un dossier) — jusqu'ici, aucune action de l'interface ne permettait de le faire une
  // fois la notion validée (seul un candidat "en_attente" pouvait être rejeté en amont, sur
  // l'écran de validation). L'historique associé part avec elle : il n'a plus de sens sans
  // la définition qu'il décrit. Les évaluations passées qui la citaient gardent leur trace
  // (leur `details` est un instantané, jamais relu depuis la notion), donc rien ne casse là.
  async supprimerNotion(notionId){
    Etat.donnees.historique = Etat.donnees.historique.filter(h => h.notionId !== notionId);
    await Store.supprimer("notions", notionId);
  },

  // Duplique une définition seule (contrairement à dupliquerCoursAvecNotions, qui duplique
  // tout un paquet) — avec une progression neuve : une copie n'hérite jamais de l'historique
  // ni de la maîtrise de l'originale, même topo que pour un paquet dupliqué.
  async dupliquerNotion(notion){
    return Store.ajouter("notions", {
      titre: `${notion.titre} (copie)`, type: notion.type, question: notion.question, reponse: notion.reponse,
      elements: notion.elements, importance: notion.importance, difficulte: notion.difficulte,
      coursId: notion.coursId, matiereId: notion.matiereId, chapitreId: notion.chapitreId,
      statutValidation: "gardee", progression: Revision.progressionInitiale(), favori: false,
    });
  },

  // Duplication complète d'un paquet CartesFacile : contrairement à "dupliquer" un cours
  // normal (qui ne recopie que le texte brut, à ré-analyser), un paquet de cartes n'a pas
  // de texte source à ré-analyser — il faut recopier directement chapitres et notions,
  // avec une progression neuve (une copie n'hérite pas de l'historique de l'original).
  async dupliquerCoursAvecNotions(coursId){
    const original = Selecteurs.cours(coursId);
    if (!original) return null;
    const copie = await Store.ajouter("cours", { titre: `${original.titre} (copie)`, matiereId: original.matiereId, contenu: original.contenu, favori: false, archive: false, origine: original.origine || null });
    const correspondanceChapitres = {};
    for (const ch of Selecteurs.chapitresDeCours(coursId)) {
      const copieCh = await Store.ajouter("chapitres", { coursId: copie.id, titre: ch.titre, ordre: ch.ordre });
      correspondanceChapitres[ch.id] = copieCh.id;
    }
    for (const n of Selecteurs.notionsDeCours(coursId)) {
      await Store.ajouter("notions", {
        titre: n.titre, type: n.type, question: n.question, reponse: n.reponse, elements: n.elements,
        importance: n.importance, difficulte: n.difficulte, coursId: copie.id, matiereId: copie.matiereId,
        chapitreId: correspondanceChapitres[n.chapitreId] || null,
        statutValidation: "gardee", progression: Revision.progressionInitiale(),
      });
    }
    return copie;
  },

  // Supprimer le compte (Auth) ne supprime pas les données Firestore associées —
  // sans ce nettoyage explicite, "supprimer mon compte" laissait tout en base
  // indéfiniment, malgré le message affiché à l'utilisateur.
  async supprimerToutesLesDonnees(){
    for (const c of COLLECTIONS) {
      for (const item of Etat.donnees[c]) await deleteDoc(doc(db, "users", Etat.uid, c, item.id));
    }
    await deleteDoc(doc(db, "users", Etat.uid));
  },

  // Regroupe les matières au nom identique (accents/casse ignorés) : garde la plus
  // ancienne, réassigne ses cours à la conservée puis supprime les autres. Renvoie
  // le nombre de doublons supprimés.
  async fusionnerMatieresEnDouble(){
    const groupes = {};
    for (const m of Etat.donnees.matieres) {
      const cle = Utils.normaliserTexte(m.nom);
      (groupes[cle] ||= []).push(m);
    }
    let supprimees = 0;
    for (const cle in groupes) {
      const liste = groupes[cle];
      if (liste.length <= 1) continue;
      liste.sort((a, b) => new Date(a.dateCreation) - new Date(b.dateCreation));
      const [garder, ...doublons] = liste;
      for (const d of doublons) {
        for (const c of Etat.donnees.cours.filter(c => c.matiereId === d.id)) {
          await Store.modifier("cours", c.id, { matiereId: garder.id });
        }
        await Store.supprimer("matieres", d.id);
        supprimees++;
      }
    }
    return supprimees;
  },
};

// -- Sélecteurs génériques réutilisés partout --
const Selecteurs = {
  matiere(id){ return Etat.donnees.matieres.find(m => m.id === id) || null; },
  cours(id){ return Etat.donnees.cours.find(c => c.id === id) || null; },
  notion(id){ return Etat.donnees.notions.find(n => n.id === id) || null; },
  coursDeMatiere(matiereId){ return Etat.donnees.cours.filter(c => c.matiereId === matiereId && !c.archive); },
  chapitresDeCours(coursId){ return Etat.donnees.chapitres.filter(ch => ch.coursId === coursId).sort((a,b) => a.ordre - b.ordre); },
  notionsDeCours(coursId){ return Etat.donnees.notions.filter(n => n.coursId === coursId && n.statutValidation !== "supprimee"); },
  notionsValideesDeCours(coursId){ return Selecteurs.notionsDeCours(coursId).filter(n => n.statutValidation === "gardee"); },
  notionsAValiderDeCours(coursId){ return Etat.donnees.notions.filter(n => n.coursId === coursId && n.statutValidation === "en_attente"); },
  toutesNotionsValidees(){ return Etat.donnees.notions.filter(n => n.statutValidation === "gardee"); },
  historiqueDeNotion(notionId){ return Etat.donnees.historique.filter(h => h.notionId === notionId).sort((a,b) => new Date(b.date) - new Date(a.date)); },
  notificationsNonLues(){ return Etat.donnees.notifications.filter(n => !n.lu); },
  // "Paquets" CartesFacile = cours créés depuis Cartes rapides (cours.origine === "rapide"),
  // par opposition aux cours normaux (texte collé + analyse) affichés dans Mes cours —
  // même collection Firestore, juste un tag pour séparer les deux usages à l'affichage.
  paquetsCartesFacile(){ return Etat.donnees.cours.filter(c => c.origine === "rapide" && !c.archive); },
  notionsDePaquets(){ const ids = new Set(Selecteurs.paquetsCartesFacile().map(c => c.id)); return Selecteurs.toutesNotionsValidees().filter(n => ids.has(n.coursId)); },
  evaluations(){ return [...Etat.donnees.evaluations].sort((a,b) => new Date(b.dateCreation) - new Date(a.dateCreation)); },
};

/* ==================== D. MOTEUR D'APPRENTISSAGE ==================== */
// Le cœur du produit (§70 du cahier des charges) : analyse de cours, génération
// d'exercices, évaluation des réponses, et surtout la répétition espacée qui décide
// QUAND et COMMENT chaque notion doit revenir. Tout ici est heuristique (mots-clés,
// regex, SM-2 adapté) — aucune API d'IA n'est appelée (voir MODE_DEMO en section A :
// dans cette architecture 100% statique, une clé d'API ne pourrait jamais rester
// secrète côté client, donc ce moteur local EST le mode démo en permanence).

function distanceLevenshtein(a, b){
  const m = a.length, n = b.length;
  if (!m) return n; if (!n) return m;
  const d = Array.from({ length: m + 1 }, (_, i) => [i, ...Array(n).fill(0)]);
  for (let j = 0; j <= n; j++) d[0][j] = j;
  for (let i = 1; i <= m; i++)
    for (let j = 1; j <= n; j++)
      d[i][j] = a[i-1] === b[j-1] ? d[i-1][j-1] : 1 + Math.min(d[i-1][j], d[i][j-1], d[i-1][j-1]);
  return d[m][n];
}
function motsProches(a, b){
  const na = Utils.normaliserTexte(a), nb = Utils.normaliserTexte(b);
  if (!na || !nb) return false;
  if (na === nb || na.includes(nb) || nb.includes(na)) return true;
  return distanceLevenshtein(na, nb) <= (na.length > 5 ? 1 : 0);
}

/* ---------- D1. Analyse heuristique d'un cours en notions ---------- */
const Analyseur = {
  MOTS_CAUSE: ["parce que","car ","en raison de","à cause de","du fait que","grâce à"],
  MOTS_CONSEQUENCE: ["entraîne","entraine","provoque","donc","c'est pourquoi","par conséquent","ce qui conduit","ce qui mène","résulte en"],
  MOTS_REGLE: ["il faut","on doit","toujours ","jamais ","interdit","obligatoire","doit être","ne doit pas"],
  MOTS_ETAPE: ["d'abord","tout d'abord","ensuite","puis ","enfin","premièrement","deuxièmement","troisièmement","après quoi"],
  MOTS_VIDES_MAJ: new Set(["Le","La","Les","Un","Une","Des","Ce","Cette","Ces","Il","Elle","Ils","Elles","On","Nous","Vous","Je","Tu","Mais","Or","Donc","Car","Ainsi","Puis","Après","Avant","Pendant","Lors","Quand","Comme","Si","Pourtant","Cependant","En","Au","Aux","Du","De"]),

  decouperPhrases(texte){
    // Chaque ligne est d'abord traitée comme une frontière à part entière (avant de la
    // re-découper par ponctuation) : sans ça, un titre markdown ou une liste à puces sans
    // point final fusionne avec le paragraphe suivant en une seule "phrase" géante et
    // illisible une fois réutilisée comme réponse ou distracteur.
    return texte
      .split(/\n+/)
      .flatMap(ligne => ligne
        .replace(/^#{1,3}\s+/, "")
        .replace(/^([-*•]|\d+[.)])\s+/, "")
        .replace(/\s+/g, " ")
        .split(/(?<=[.!?])\s+(?=[A-ZÀ-Ý0-9«"])/))
      .map(p => p.trim())
      .filter(p => p.length > 12);
  },
  decouperParagraphes(texte){
    return texte.split(/\n\s*\n/).map(p => p.trim()).filter(Boolean);
  },

  extraireElements(phrase, max = 6){
    const mots = Utils.motsSignificatifsOriginaux(phrase);
    const vus = new Set(), uniques = [];
    for (const m of mots) {
      const norm = Utils.normaliserTexte(m);
      if (!vus.has(norm)) { vus.add(norm); uniques.push(m); }
    }
    uniques.sort((a,b) => b.length - a.length);
    return uniques.slice(0, max);
  },

  detecterDefinitions(phrases){
    const candidats = [];
    const motifDef = /^(.{2,45}?)\s+(est|sont|désigne|désignent|correspond à|correspondent à|représente|se définit comme|peut être défini(?:e)? comme)\s+(.+)$/i;
    for (const phrase of phrases) {
      const m = phrase.match(motifDef);
      if (!m) continue;
      const sujet = m[1].replace(/^(le |la |les |l'|un |une |des )/i, "").trim();
      if (sujet.split(" ").length > 6 || sujet.length < 2) continue;
      candidats.push({
        titre: sujet.charAt(0).toUpperCase() + sujet.slice(1),
        type: "definition",
        // « le/la » (au lieu de deviner un genre qu'on ne connaît pas) sonnait
        // mécanique et peu naturel comme question posée à l'utilisateur.
        question: `Qu'est-ce que « ${sujet} » ?`,
        reponse: phrase,
        elements: Analyseur.extraireElements(phrase),
        score: 8 + Math.min(4, sujet.split(" ").length),
      });
    }
    return candidats;
  },

  detecterVocabulaire(phrases){
    const candidats = [];
    const motifTerme = /^([A-ZÀ-Ý][\wà-ÿ' -]{2,35})\s*[:–]\s*(.{15,})$/;
    for (const phrase of phrases) {
      const m = phrase.match(motifTerme);
      if (!m) continue;
      candidats.push({
        titre: m[1].trim(), type: "vocabulaire",
        question: `Que signifie « ${m[1].trim()} » ?`,
        reponse: m[2].trim(), elements: Analyseur.extraireElements(m[2]), score: 7,
      });
    }
    return candidats;
  },

  detecterDates(phrases){
    const candidats = [];
    const motifDate = /\b((?:\d{1,2}\s+)?(?:janvier|février|mars|avril|mai|juin|juillet|août|septembre|octobre|novembre|décembre)\s+)?(1[0-9]{3}|20[0-9]{2})\b/gi;
    for (const phrase of phrases) {
      const dates = [...phrase.matchAll(motifDate)];
      if (!dates.length) continue;
      const dateTexte = dates[0][0].trim();
      const sujet = phrase.replace(dateTexte, "").replace(/^(en|le|au|dès|depuis|jusqu'en)\s+/i, "").trim().slice(0, 50);
      candidats.push({
        titre: dateTexte, type: "date",
        question: `Que s'est-il passé ${/^\d/.test(dateTexte) ? "le" : "en"} ${dateTexte} ?`,
        reponse: phrase, elements: [dateTexte, ...Analyseur.extraireElements(phrase, 4)], score: 9,
      });
    }
    return candidats;
  },

  detecterChiffresFormules(phrases){
    const candidats = [];
    const motifFormule = /[=×÷%]|\b\d+([.,]\d+)?\s?(km|kg|m²|m³|°C|°|cm|mm|Hz|kJ|mol|N|Pa|€|\$)\b/;
    for (const phrase of phrases) {
      if (!motifFormule.test(phrase)) continue;
      const chiffre = phrase.match(/[\d][\d.,%=×÷\s]*[\d%]/);
      candidats.push({
        titre: chiffre ? chiffre[0].trim() : "Chiffre clé", type: "chiffre",
        question: "Que représente ce chiffre dans le cours ?",
        reponse: phrase, elements: Analyseur.extraireElements(phrase, 5), score: 6,
      });
    }
    return candidats;
  },

  detecterPersonnages(phrases){
    const candidats = [];
    const motifNom = /\b([A-ZÀ-Ý][a-zà-ÿ]+(?:\s[A-ZÀ-Ý][a-zà-ÿ]+){0,2})\b/g;
    for (const phrase of phrases) {
      const mots = phrase.split(" ");
      for (const m of phrase.matchAll(motifNom)) {
        const nom = m[1];
        const premierMot = mots[0] === nom || mots[0]?.startsWith(nom.split(" ")[0]);
        if (premierMot) continue;
        if (Analyseur.MOTS_VIDES_MAJ.has(nom.split(" ")[0])) continue;
        if (nom.split(" ")[0].length < 3) continue;
        candidats.push({
          titre: nom, type: "personnage",
          question: `Qui est ${nom} ?`,
          reponse: phrase, elements: Analyseur.extraireElements(phrase, 5), score: 5,
        });
      }
    }
    return candidats;
  },

  detecterCauseConsequence(phrases){
    const candidats = [];
    for (const phrase of phrases) {
      const basse = phrase.toLowerCase();
      const estCause = Analyseur.MOTS_CAUSE.some(m => basse.includes(m));
      const estConsequence = Analyseur.MOTS_CONSEQUENCE.some(m => basse.includes(m));
      if (!estCause && !estConsequence) continue;
      candidats.push({
        titre: phrase.slice(0, 40) + (phrase.length > 40 ? "…" : ""), type: "cause_consequence",
        question: estCause ? "Pourquoi ce phénomène se produit-il ?" : "Quelle est la conséquence décrite ici ?",
        reponse: phrase, elements: Analyseur.extraireElements(phrase, 5), score: 6,
      });
    }
    return candidats;
  },

  detecterRegles(phrases){
    const candidats = [];
    for (const phrase of phrases) {
      const basse = phrase.toLowerCase();
      if (!Analyseur.MOTS_REGLE.some(m => basse.includes(m))) continue;
      candidats.push({
        titre: phrase.slice(0, 40) + (phrase.length > 40 ? "…" : ""), type: "regle",
        question: "Quelle règle faut-il retenir ici ?",
        reponse: phrase, elements: Analyseur.extraireElements(phrase, 5), score: 6,
      });
    }
    return candidats;
  },

  detecterListesEtapes(paragraphes){
    const candidats = [];
    for (const bloc of paragraphes) {
      const lignes = bloc.split("\n").map(l => l.trim()).filter(Boolean);
      const puces = lignes.filter(l => /^([-*•]|\d+[.)])\s+/.test(l));
      if (puces.length >= 3) {
        const items = puces.map(l => l.replace(/^([-*•]|\d+[.)])\s+/, "").trim());
        candidats.push({
          titre: items[0].slice(0, 30) + "… (liste)", type: "liste",
          question: `Quels sont les éléments de cette liste : « ${items[0].slice(0,25)}… » ?`,
          reponse: items.join(" ; "), elements: items.slice(0, 8), score: 7,
        });
        continue;
      }
      const basse = bloc.toLowerCase();
      const nbMarqueurs = Analyseur.MOTS_ETAPE.filter(m => basse.includes(m)).length;
      if (nbMarqueurs >= 2) {
        const phrasesEtapes = Analyseur.decouperPhrases(bloc).filter(p => Analyseur.MOTS_ETAPE.some(m => p.toLowerCase().includes(m)) || puces.length);
        if (phrasesEtapes.length >= 3) {
          candidats.push({
            titre: "Étapes du processus", type: "etape",
            question: "Remets les étapes de ce processus dans l'ordre.",
            reponse: phrasesEtapes.join(" "), elements: phrasesEtapes.slice(0, 6), score: 7,
          });
        }
      }
    }
    return candidats;
  },

  // Fusionne, déduplique (titres proches) et limite le nombre de notions retenues :
  // ~1 notion toutes les 90 mots de cours, plafonnée à 40, en gardant toujours les
  // meilleurs scores (définitions/dates/chiffres priment sur les personnages détectés
  // par simple capitalisation, plus bruités).
  analyser(texte){
    const phrases = Analyseur.decouperPhrases(texte);
    const paragraphes = Analyseur.decouperParagraphes(texte);
    let candidats = [
      ...Analyseur.detecterDefinitions(phrases),
      ...Analyseur.detecterVocabulaire(phrases),
      ...Analyseur.detecterDates(phrases),
      ...Analyseur.detecterChiffresFormules(phrases),
      ...Analyseur.detecterCauseConsequence(phrases),
      ...Analyseur.detecterRegles(phrases),
      ...Analyseur.detecterListesEtapes(paragraphes),
      ...Analyseur.detecterPersonnages(phrases),
    ];
    const dedupliques = [];
    for (const c of candidats) {
      const existant = dedupliques.find(d => motsProches(d.titre, c.titre) || motsProches(d.reponse.slice(0,40), c.reponse.slice(0,40)));
      if (!existant) dedupliques.push(c);
      else if (c.score > existant.score) Object.assign(existant, c);
    }
    const nbMots = Utils.motsSignificatifs(texte).length;
    const plafond = Utils.clamp(Math.round(nbMots / 45), 4, 40);
    dedupliques.sort((a,b) => b.score - a.score);
    const retenues = dedupliques.slice(0, plafond);
    return retenues.map(c => ({
      id: Utils.genererId(),
      titre: c.titre, type: c.type, question: c.question, reponse: c.reponse,
      elements: c.elements, importance: c.score >= 8 ? 3 : c.score >= 6 ? 2 : 1,
      difficulte: Utils.clamp(Math.round(c.reponse.split(" ").length / 12), 1, 3),
      statutValidation: "en_attente",
    }));
  },
};

/* ---------- D2/D3. Génération d'exercices et évaluation des réponses ---------- */
const Moteur = {
  // Associe chaque étape de la progression à un ou plusieurs types d'exercice
  // plausibles (§13 : apprentissage progressif) — le tirage varie pour ne jamais
  // enchaîner deux fois le même exercice (§12).
  TYPES_PAR_ETAPE: {
    decouverte: ["qcm"], comprehension: ["qcm", "vrai_faux"],
    reconnaissance: ["qcm", "vrai_faux", "association"],
    texte_trous: ["texte_trous"], indice: ["reponse_libre"], rappel_libre: ["reponse_libre"],
    reecriture: ["reecriture"], rappel_differe: ["reponse_libre", "reecriture"],
    maitrise: ["reponse_libre", "reecriture"],
  },

  typesDisponibles(notion){
    const etape = ETAPES_MAITRISE[notion.progression.etapeIndex]?.cle || "decouverte";
    let types = Moteur.TYPES_PAR_ETAPE[etape] || ["qcm"];
    const autresValidees = Selecteurs.notionsValideesDeCours(notion.coursId).filter(n => n.id !== notion.id);
    if (types.includes("association") && autresValidees.length < 3) types = types.filter(t => t !== "association");
    if ((notion.type === "etape" || notion.type === "liste") && notion.elements.length >= 3 && Math.random() < .3) types = [...types, "ordre"];
    return types.length ? types : ["qcm"];
  },
  choisirTypeExercice(notion){ return Utils.choixRandom(Moteur.typesDisponibles(notion)); },

  altererReponse(notion){
    const remplacements = ["un phénomène totalement différent", "l'inverse de ce mécanisme", "un processus sans rapport", "aucun élément particulier de ce cours"];
    if (notion.elements?.length) {
      const cible = Utils.choixRandom(notion.elements);
      const motif = new RegExp(cible.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
      if (motif.test(notion.reponse)) return notion.reponse.replace(motif, Utils.choixRandom(remplacements));
    }
    return notion.reponse.slice(0, Math.floor(notion.reponse.length * 0.6)) + "… " + Utils.choixRandom(remplacements) + ".";
  },
  genererDistracteurs(notion, n){
    const autres = Selecteurs.notionsValideesDeCours(notion.coursId).filter(n2 => n2.id !== notion.id);
    const pool = Utils.melanger(autres).map(n2 => n2.reponse).filter(Boolean);
    while (pool.length < n) pool.push(Moteur.altererReponse(notion));
    return pool.slice(0, n);
  },

  genererIndices(notion){
    const els = notion.elements || [];
    const indice1 = els[0] ? `Un mot-clé important : « ${els[0]} ».` : `Le premier mot de la réponse commence par « ${notion.reponse.trim()[0]} ».`;
    const indice2 = els.length >= 2 ? `Cela concerne : ${els.slice(0, Math.ceil(els.length/2)).join(", ")}.` : `${notion.reponse.slice(0, Math.round(notion.reponse.length*0.35))}…`;
    const indice3 = `${notion.reponse.slice(0, Math.round(notion.reponse.length * 0.7))}…`;
    return [indice1, indice2, indice3];
  },

  // `opts` sert exclusivement à la séquence pédagogique (G6b) : indiceLettres/nbTrousMax
  // pour le texte à trous, forcerMots pour cibler précisément un élément oublié (§17/22).
  genererExercice(notion, typeForce, opts = {}){
    let type = typeForce || Moteur.choisirTypeExercice(notion);
    if (type === "association" && Selecteurs.notionsValideesDeCours(notion.coursId).filter(n => n.id !== notion.id).length < 3) type = "qcm";
    if (type === "ordre" && (!notion.elements || notion.elements.length < 3)) type = "reponse_libre";
    if (type === "identification" && (!notion.elements || notion.elements.length < 2)) type = "qcm";

    if (type === "qcm") {
      const distracteurs = Moteur.genererDistracteurs(notion, 3);
      const options = Utils.melanger([notion.reponse, ...distracteurs]);
      return { type, notionId: notion.id, enonce: notion.question, donnees: { options, indexCorrect: options.indexOf(notion.reponse) } };
    }
    if (type === "vrai_faux") {
      const estVraie = Math.random() < 0.5;
      const affirmation = estVraie ? notion.reponse : Moteur.altererReponse(notion);
      return { type, notionId: notion.id, enonce: "Vrai ou faux ?", donnees: { affirmation, estVraie } };
    }
    if (type === "texte_trous") {
      const elementsDispo = notion.elements || [];
      const cibles = opts.forcerMots?.length ? opts.forcerMots
        : opts.nbTrousMax ? elementsDispo.slice(0, 6)
        : elementsDispo.slice(0, Utils.clamp(Math.round((elementsDispo.length || 2) / 2), 1, 3));
      let texte = notion.reponse, reponses = [];
      // L'étiquette {{n}} doit être l'index RÉEL dans `reponses` (celui qu'on push), pas
      // la position dans `cibles` : si un mot ne matche pas, les deux dérivaient et
      // {{2}} pouvait pointer vers un `reponses[2]` inexistant (trou affiché comme "2").
      cibles.forEach((mot) => {
        const motif = new RegExp(mot.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "i");
        if (motif.test(texte)) { const idx = reponses.length; texte = texte.replace(motif, `{{${idx}}}`); reponses.push(mot); }
      });
      if (!reponses.length) {
        const motsCles = Utils.echantillon(Utils.motsSignificatifs(notion.reponse), 1);
        const motif = new RegExp(motsCles[0], "i");
        if (motsCles[0] && motif.test(texte)) { texte = texte.replace(motif, "{{0}}"); reponses.push(motsCles[0]); }
      }
      const segments = texte.split(/\{\{(\d+)\}\}/);
      // "Mets la première lettre, voire plusieurs si besoin" : un indice visuel progressif
      // pour la séquence pédagogique en tout début d'apprentissage — jamais utilisé par le
      // moteur "drill" classique (indiceLettres reste 0 par défaut, comportement inchangé).
      return { type, notionId: notion.id, enonce: notion.question, donnees: { segments, reponses, indiceLettres: opts.indiceLettres || 0 } };
    }
    if (type === "identification") {
      const bonnes = (notion.elements || []).slice(0, 6);
      const autresNotions = Selecteurs.toutesNotionsValidees().filter(n => n.id !== notion.id && n.elements?.length);
      const leurres = Utils.echantillon(Utils.melanger(autresNotions).flatMap(n => n.elements), Math.min(3, Math.max(2, Math.round(bonnes.length/2))));
      const options = Utils.melanger([...bonnes, ...new Set(leurres)].filter((v,i,a) => a.indexOf(v)===i));
      return { type, notionId: notion.id, enonce: `Quels éléments appartiennent à la définition de « ${notion.titre} » ?`, donnees: { options, bonnesReponses: bonnes } };
    }
    if (type === "association") {
      const autres = Utils.echantillon(Selecteurs.notionsValideesDeCours(notion.coursId).filter(n => n.id !== notion.id), 3);
      const paires = Utils.melanger([notion, ...autres]).map(n => ({ id: n.id, gauche: n.titre, droite: n.reponse.length > 70 ? n.reponse.slice(0,68)+"…" : n.reponse }));
      return { type, notionId: notion.id, enonce: "Associe chaque notion à sa définition.", donnees: { paires } };
    }
    if (type === "ordre") {
      const original = notion.elements.slice(0, 6);
      return { type, notionId: notion.id, enonce: notion.question || "Remets ces éléments dans le bon ordre.", donnees: { ordreMelange: Utils.melanger(original), ordreOriginal: original } };
    }
    if (type === "reecriture") {
      return { type, notionId: notion.id, enonce: notion.titre, donnees: { consigne: "Écris la définition complète, de mémoire." } };
    }
    return { type: "reponse_libre", notionId: notion.id, enonce: opts.motsCles ? `Quels sont les mots-clés à retenir pour « ${notion.titre} » ?` : notion.question, donnees: { indices: Moteur.genererIndices(notion) } };
  },

  // Évalue une réponse libre / réécriture en comparant le SENS (mots-clés / éléments
  // essentiels couverts) plutôt que le texte exact (§18) — pas une vraie compréhension,
  // mais suffisant pour détecter précisément ce qui est su et ce qui est oublié.
  evaluerReponseLibre(notion, reponseUtilisateur){
    const texteNorm = Utils.normaliserTexte(reponseUtilisateur);
    const elements = notion.elements?.length ? notion.elements : Analyseur.extraireElements(notion.reponse, 5);
    const elementsCorrects = [], elementsManques = [];
    for (const el of elements) {
      const elNorm = Utils.normaliserTexte(el);
      const couvert = elNorm.split(" ").every(motEl => texteNorm.split(" ").some(motRep => motsProches(motEl, motRep)));
      (couvert ? elementsCorrects : elementsManques).push(el);
    }
    let ratio;
    if (elements.length) ratio = elementsCorrects.length / elements.length;
    else {
      const motsRep = new Set(Utils.motsSignificatifs(reponseUtilisateur));
      const motsAttendus = new Set(Utils.motsSignificatifs(notion.reponse));
      const intersection = [...motsAttendus].filter(m => motsRep.has(m)).length;
      ratio = motsAttendus.size ? intersection / motsAttendus.size : 0;
    }
    const correct = ratio >= 0.8 ? true : ratio >= 0.35 ? "partiel" : false;
    return { correct, ratio, elementsCorrects, elementsManques };
  },

  // -- Correction sémantique de l'Évaluation (§9-12) --
  // Toujours heuristique (mots-clés + fenêtre de négation), jamais une vraie compréhension
  // du sens — le README (§ API IA) explique pourquoi ce projet n'appelle aucune API d'IA :
  // ce même principe s'applique ici. C'est suffisant pour la promesse réelle du cahier des
  // charges : "une formulation différente ne veut pas dire fausse" fonctionne déjà grâce à
  // la comparaison par éléments essentiels (pas mot à mot) de evaluerReponseLibre ci-dessus ;
  // ce qui manquait, c'est de distinguer un élément simplement OUBLIÉ d'un élément CONTREDIT
  // (présent dans la réponse, mais nié) — d'où NEGATIONS et cette fonction dédiée.
  NEGATIONS: new Set(["ne","n","pas","jamais","aucun","aucune","ni","non","sans","guere"]),
  analyserRestitution(notion, reponseUtilisateur){
    const motsRep = Utils.normaliserTexte(reponseUtilisateur).split(" ").filter(Boolean);
    const elements = notion.elements?.length ? notion.elements : Analyseur.extraireElements(notion.reponse, 5);
    const elementsCorrects = [], elementsManques = [], elementsContredits = [];
    for (const el of elements) {
      const elNorm = Utils.normaliserTexte(el);
      const indexTrouve = motsRep.findIndex(motRep => motsProches(elNorm, motRep));
      if (indexTrouve === -1) { elementsManques.push(el); continue; }
      const fenetre = motsRep.slice(Math.max(0, indexTrouve - 4), indexTrouve);
      if (fenetre.some(m => Moteur.NEGATIONS.has(m))) elementsContredits.push(el);
      else elementsCorrects.push(el);
    }
    const ratio = elements.length ? elementsCorrects.length / elements.length : 0;
    // Seuils adaptés au nombre d'éléments essentiels plutôt qu'à un pourcentage brut seul
    // (§12) : sur une définition à 2 éléments, en manquer 1 fait déjà chuter à 50% — on
    // reste donc "partiel" et non "fragile" tant qu'au moins la moitié est là.
    let niveau, libelleNiveau;
    if (elementsContredits.length && ratio < 0.8) { niveau = "incorrecte"; libelleNiveau = "Contient une contradiction"; }
    else if (ratio >= 0.9) { niveau = "excellente"; libelleNiveau = "Excellente restitution"; }
    else if (ratio >= 0.7) { niveau = "tresBonne"; libelleNiveau = "Très bonne restitution"; }
    else if (ratio >= 0.45) { niveau = "partielle"; libelleNiveau = "Maîtrise partielle"; }
    else if (ratio > 0) { niveau = "fragile"; libelleNiveau = "Définition fragile"; }
    else { niveau = "nonMaitrisee"; libelleNiveau = "Non maîtrisée"; }
    const correct = niveau === "excellente" || niveau === "tresBonne" ? true : niveau === "partielle" ? "partiel" : false;
    return { elementsCorrects, elementsManques, elementsContredits, ratio, niveau, libelleNiveau, correct };
  },

  // Retourne { correct, elementsCorrects?, elementsManques? } — forme commune à tous
  // les types d'exercice, consommée par la correction et par calculerRevisionSuivante.
  evaluer(exercice, notion, reponseUtilisateur){
    switch (exercice.type) {
      case "qcm":
        return { correct: reponseUtilisateur === exercice.donnees.indexCorrect };
      case "vrai_faux":
        return { correct: reponseUtilisateur === exercice.donnees.estVraie };
      case "texte_trous": {
        const attendues = exercice.donnees.reponses;
        const donnees_ = Array.isArray(reponseUtilisateur) ? reponseUtilisateur : [];
        const bonnes = attendues.filter((mot, i) => motsProches(mot, donnees_[i] || ""));
        const ratio = attendues.length ? bonnes.length / attendues.length : 0;
        return { correct: ratio === 1 ? true : ratio >= 0.5 ? "partiel" : false, detailTrous: attendues.map((mot,i) => motsProches(mot, donnees_[i]||"")) };
      }
      case "reponse_libre": case "reecriture": {
        const res = Moteur.evaluerReponseLibre(notion, reponseUtilisateur || "");
        return { correct: res.correct, elementsCorrects: res.elementsCorrects, elementsManques: res.elementsManques };
      }
      case "association": {
        const paires = exercice.donnees.paires;
        const assoc = reponseUtilisateur || {};
        const bonnes = paires.filter(p => assoc[p.id] === p.id).length;
        return { correct: bonnes === paires.length ? true : bonnes > 0 ? "partiel" : false };
      }
      case "identification": {
        const choisis = new Set(reponseUtilisateur || []);
        const bonnesReponses = exercice.donnees.bonnesReponses;
        const elementsCorrects = bonnesReponses.filter(e => choisis.has(e));
        const elementsManques = bonnesReponses.filter(e => !choisis.has(e));
        const fauxPositifs = [...choisis].filter(e => !bonnesReponses.includes(e)).length;
        const ratio = bonnesReponses.length ? elementsCorrects.length / bonnesReponses.length : 0;
        const correct = ratio === 1 && fauxPositifs === 0 ? true : ratio >= 0.5 && fauxPositifs <= 1 ? "partiel" : false;
        return { correct, elementsCorrects, elementsManques };
      }
      case "ordre": {
        const propose = reponseUtilisateur || [];
        const original = exercice.donnees.ordreOriginal;
        const identique = original.every((el, i) => el === propose[i]);
        if (identique) return { correct: true };
        const bienPlaces = original.filter((el, i) => propose[i] === el).length;
        return { correct: bienPlaces >= original.length / 2 ? "partiel" : false };
      }
      default:
        return { correct: false };
    }
  },
};

/* ---------- D4/D5. Répétition espacée & priorisation des révisions ---------- */
const Revision = {
  // Traduit résultat + confiance + indices utilisés en "qualité" façon SM-2 (0-5).
  calculerQualite({ correct, confiance, indiceUtilise }){
    if (correct === false) return 0;
    if (correct === "partiel") return 2;
    let q = { aucune: 3, hesitation: 4, savais: 5, facile: 5 }[confiance] ?? 3;
    q -= Math.min(2, indiceUtilise || 0);
    return Utils.clamp(q, 0, 5);
  },

  // calculateNextReview(concept, result) du cahier des charges : renvoie la
  // progression mise à jour (nouveau niveau, prochaine date, statut) — jamais
  // seulement à partir du nombre de bonnes réponses (§19/§64).
  calculerRevisionSuivante(notion, { correct, typeExercice, indiceUtilise = 0, confiance = "aucune", elementsManques = [], elementsCorrects = [] }){
    const p = { ...notion.progression };
    const qualite = Revision.calculerQualite({ correct, confiance, indiceUtilise });
    const maintenant = new Date();
    const derniereRevision = Selecteurs.historiqueDeNotion(notion.id)[0];
    const joursDepuis = derniereRevision ? (maintenant - new Date(derniereRevision.date)) / JOUR : 999;

    p.facteurFacilite = Utils.clamp(p.facteurFacilite + (0.1 - (5 - qualite) * (0.08 + (5 - qualite) * 0.02)), 1.3, 2.8);

    if (qualite < 3) {
      p.reussitesConsecutives = 0;
      p.echecsTotal = (p.echecsTotal || 0) + 1;
      p.intervalleJours = qualite === 0 ? (1 / 48) : 1; // qualité 0 : on la reverra dans la même session (~30 min)
      p.etapeIndex = Math.max(0, p.etapeIndex - 1);
      p.maitriseDurable = Utils.clamp(p.maitriseDurable - 20, 0, 100);
    } else {
      p.reussitesConsecutives = (p.reussitesConsecutives || 0) + 1;
      p.reussitesTotal = (p.reussitesTotal || 0) + 1;
      if (p.reussitesConsecutives === 1) p.intervalleJours = 1;
      else if (p.reussitesConsecutives === 2) p.intervalleJours = 3;
      else p.intervalleJours = Math.round((p.intervalleJours || 1) * p.facteurFacilite);

      const etapeActuelle = ETAPES_MAITRISE[p.etapeIndex]?.cle;
      const typesEtape = Moteur.TYPES_PAR_ETAPE[etapeActuelle] || [];
      if (qualite >= 4 && (typesEtape.includes(typeExercice) || p.etapeIndex === 0)) {
        const peutAtteindreMaitrise = p.etapeIndex + 1 < ETAPES_MAITRISE.length - 1 || (p.reussitesConsecutives >= 3 && p.intervalleJours >= 14);
        if (peutAtteindreMaitrise) p.etapeIndex = Math.min(ETAPES_MAITRISE.length - 1, p.etapeIndex + 1);
      }
      if (joursDepuis >= 3) p.maitriseDurable = Utils.clamp(p.maitriseDurable + 15, 0, 100);
    }

    p.prochaineRevision = new Date(maintenant.getTime() + p.intervalleJours * JOUR).toISOString();
    p.indicesUtilisesTotal = (p.indicesUtilisesTotal || 0) + (indiceUtilise || 0);
    p.derniereConfiance = confiance;

    const ensembleOublies = new Set(p.elementsOublies || []);
    const ensembleMaitrises = new Set(p.elementsMaitrises || []);
    elementsManques.forEach(e => ensembleOublies.add(e));
    elementsCorrects.forEach(e => { ensembleOublies.delete(e); ensembleMaitrises.add(e); });
    p.elementsOublies = [...ensembleOublies];
    p.elementsMaitrises = [...ensembleMaitrises];

    const cle = correct === true ? "typesReussis" : correct === false ? "typesEchoues" : null;
    if (cle) p[cle] = [...new Set([...(p[cle] || []), typeExercice])];

    const ratioRecent = Revision._ratioRecent(notion.id, correct);
    const facteurEtape = p.etapeIndex / (ETAPES_MAITRISE.length - 1);
    p.maitriseActuelle = Utils.clamp(Math.round((ratioRecent * 0.5 + facteurEtape * 0.35 + (qualite / 5) * 0.15) * 100), 0, 100);
    p.statut = Revision.calculerStatut(p);

    return p;
  },
  _ratioRecent(notionId, correctActuel){
    const historique = Selecteurs.historiqueDeNotion(notionId).slice(0, 4);
    const points = [correctActuel === true ? 1 : correctActuel === "partiel" ? 0.5 : 0, ...historique.map(h => h.resultat === true ? 1 : h.resultat === "partiel" ? 0.5 : 0)];
    return points.reduce((a,b) => a+b, 0) / points.length;
  },
  calculerStatut(p){
    if (p.maitriseActuelle < 25) return "rouge";
    if (p.maitriseActuelle < 50) return "orange";
    if (p.maitriseActuelle < 75) return "jaune";
    if (p.maitriseDurable < 60) return "vert";
    return "bleu";
  },
  progressionInitiale(){
    return {
      etapeIndex: 0, maitriseActuelle: 0, maitriseDurable: 0, statut: "rouge",
      reussitesConsecutives: 0, reussitesTotal: 0, echecsTotal: 0,
      intervalleJours: 0, facteurFacilite: 2.5, prochaineRevision: new Date().toISOString(),
      indicesUtilisesTotal: 0, derniereConfiance: null,
      elementsOublies: [], elementsMaitrises: [], typesReussis: [], typesEchoues: [],
    };
  },

  estDue(notion, refDate = new Date()){ return new Date(notion.progression.prochaineRevision) <= refDate; },
  joursRetard(notion, refDate = new Date()){ return Math.floor((refDate - new Date(notion.progression.prochaineRevision)) / JOUR); },

  calculerPriorite(notion){
    const retard = Revision.joursRetard(notion);
    let priorite = retard > 0 ? 100 + retard * 5 : Math.max(0, 20 + retard);
    priorite += { rouge: 40, orange: 25, jaune: 10, vert: 0, bleu: -10 }[notion.progression.statut] || 0;
    priorite += (notion.importance || 1) * 5;
    if ((notion.progression.elementsOublies || []).length) priorite += 10;
    return priorite;
  },

  fileDeRevision(notions = Selecteurs.toutesNotionsValidees()){
    return notions.filter(n => Revision.estDue(n)).sort((a,b) => Revision.calculerPriorite(b) - Revision.calculerPriorite(a));
  },
  notionsFragiles(notions = Selecteurs.toutesNotionsValidees()){
    return notions.filter(n => ["rouge","orange"].includes(n.progression.statut)).sort((a,b) => a.progression.maitriseActuelle - b.progression.maitriseActuelle);
  },
  choisirPourDuree(minutes, notions = Selecteurs.toutesNotionsValidees()){
    const parMinute = 1.7; // ~35s par notion en moyenne, tous types confondus
    const n = Math.max(3, Math.round(minutes * parMinute));
    return Revision.fileDeRevision(notions).slice(0, n);
  },
};

function motDePasseValide(mdp){
  return typeof mdp === "string" && mdp.length >= 10 && /[A-Z]/.test(mdp) && /[a-z]/.test(mdp) && /[0-9]/.test(mdp);
}
async function sha256(texte){
  const donnees = new TextEncoder().encode(texte);
  const hash = await crypto.subtle.digest("SHA-256", donnees);
  return [...new Uint8Array(hash)].map(o => o.toString(16).padStart(2, "0")).join("");
}

const DemoAuth = {
  _cleComptes(){ return "memoria-demo-comptes"; },
  _cleSession(){ return "memoria-demo-session"; },
  comptes(){ return JSON.parse(localStorage.getItem(DemoAuth._cleComptes()) || "{}"); },
  sauverComptes(c){ localStorage.setItem(DemoAuth._cleComptes(), JSON.stringify(c)); },
  session(){ const s = localStorage.getItem(DemoAuth._cleSession()); return s ? JSON.parse(s) : null; },

  async inscrire({ email, motDePasse, prenom, nom }){
    const emailNorm = email.trim().toLowerCase();
    const comptes = DemoAuth.comptes();
    if (comptes[emailNorm]) throw new Error("Un compte existe déjà avec cet e-mail.");
    if (!motDePasseValide(motDePasse)) throw new Error("Mot de passe trop faible (10 caractères, une majuscule, une minuscule, un chiffre).");
    const uid = "demo-" + Utils.genererId();
    comptes[emailNorm] = { uid, motDePasseHash: await sha256(motDePasse), prenom, nom };
    DemoAuth.sauverComptes(comptes);
    localStorage.setItem(DemoAuth._cleSession(), JSON.stringify({ uid, email: emailNorm }));
    return { uid, email: emailNorm, prenom, nom };
  },
  async connecter({ email, motDePasse }){
    const emailNorm = email.trim().toLowerCase();
    const comptes = DemoAuth.comptes();
    const compte = comptes[emailNorm];
    if (!compte || compte.motDePasseHash !== await sha256(motDePasse)) throw new Error("E-mail ou mot de passe incorrect.");
    localStorage.setItem(DemoAuth._cleSession(), JSON.stringify({ uid: compte.uid, email: emailNorm }));
    return { uid: compte.uid, email: emailNorm, prenom: compte.prenom, nom: compte.nom };
  },
  async invite(){
    const uid = "demo-invite";
    localStorage.setItem(DemoAuth._cleSession(), JSON.stringify({ uid, email: "invite@demo" }));
    return { uid, email: "invite@demo" };
  },
  deconnecter(){ localStorage.removeItem(DemoAuth._cleSession()); },
};

      <div class="flex gap-sm mt-lg"><button class="bouton bouton-fantome" data-precedent>${icono("fleche_gauche","icone-sm")} Retour</button><button class="bouton bouton-primaire flex-1" data-suivant>Continuer</button></div>`;
  },
  etapePret(){
    return `<div class="texte-centre"><div class="anneau-progression">${icono("coche_cercle","icone-lg")}</div>
      <h2 class="mt-md">Tout est prêt !</h2><p class="texte-2 mt-sm">Ajoute ton premier cours pour que CartesFacile commence à travailler pour toi.</p>

      <button class="bouton bouton-fantome bouton-large mt-sm" data-terminer="exemple">Découvrir avec un cours d'exemple</button>
      <button class="bouton bouton-fantome bouton-large" data-terminer="dashboard">Aller à mon tableau de bord</button></div>`;
  },
  attacher(conteneur){
    conteneur.querySelectorAll("[data-matiere]").forEach(b => b.addEventListener("click", () => {
      const m = b.dataset.matiere;
      Onboarding.reponses.matieres = Onboarding.reponses.matieres.includes(m) ? Onboarding.reponses.matieres.filter(x => x!==m) : [...Onboarding.reponses.matieres, m];
      Onboarding.rendre();
    }));
    conteneur.querySelectorAll("[data-style]").forEach(b => b.addEventListener("click", () => { Onboarding.reponses.style = b.dataset.style; Onboarding.rendre(); }));
    conteneur.querySelector("[data-precedent]")?.addEventListener("click", () => { Onboarding.etape--; Onboarding.rendre(); });
    conteneur.querySelector("[data-suivant]")?.addEventListener("click", () => {
      if (Onboarding.etape === 3) {
        Onboarding.reponses.controleNom = document.getElementById("ob-nom").value;
        Onboarding.reponses.controleDate = document.getElementById("ob-date").value;
      }
      Onboarding.etape++; Onboarding.rendre();
    });
    conteneur.querySelectorAll("[data-terminer]").forEach(b => b.addEventListener("click", async (e) => {
      await Onboarding.terminer(e.target.closest("[data-terminer]").dataset.terminer);

  },
  async terminer(destination){
    for (const [i, nom] of Onboarding.reponses.matieres.entries()) {
      await Store.ajouter("matieres", { nom, couleur: COULEURS_MATIERE[i % COULEURS_MATIERE.length], icone: "livre" });
    }
    if (Onboarding.reponses.controleNom && Onboarding.reponses.controleDate) {
      await Store.ajouter("controles", { nom: Onboarding.reponses.controleNom, date: Onboarding.reponses.controleDate });
    }
    await Store.sauvegarderProfil({ onboardingFait: true, styleApprentissage: Onboarding.reponses.style });
    if (destination === "exemple") await Demo.creerDonneesExemple();
    Coquille.afficher();
    if (destination === "cours") setTimeout(() => Routeur.aller("cours/nouveau"), 50);
  },
};

const Routeur = {
  routes: [],
  definir(chemin, gestionnaire){
    const noms = [];
    const motif = chemin.replace(/:([a-zA-Z]+)/g, (_, nom) => { noms.push(nom); return "([^/]+)"; });
    Routeur.routes.push({ regex: new RegExp(`^${motif}$`), noms, gestionnaire, chemin });
  },
  aller(chemin){
    if (location.hash === `#/${chemin}`) Routeur.gerer();
    else location.hash = `#/${chemin}`;
  },
  gerer(){
    document.getElementById("menuPlusOuvert")?.remove();
    document.querySelectorAll(".menu-deroulant").forEach(m => m.remove());
    const brut = location.hash.replace(/^#\/?/, "") || "dashboard";
    const [cheminBrut, chaineRequete] = brut.split("?");
    const chemin = decodeURIComponent(cheminBrut);
    const requete = Object.fromEntries(new URLSearchParams(chaineRequete || ""));
    for (const route of Routeur.routes) {
      const m = chemin.match(route.regex);
      if (!m) continue;
      const params = { ...requete };
      route.noms.forEach((nom, i) => params[nom] = decodeURIComponent(m[i + 1]));
      Etat.ui.pageActuelle = route.chemin.split("/")[0];
      Coquille.majNavigationActive();
      const principal = document.getElementById("contenu-principal");
      principal.scrollTop = 0; window.scrollTo(0, 0);
      try { route.gestionnaire(params); }
      catch (err) {
        console.error(err);
        principal.innerHTML = `<div class="etat-vide">${icono("alerte_triangle")}<h3>Un problème est survenu</h3><p>${Utils.echapperHtml(err.message||"")}</p></div>`;
      }
      return;
    }
    Routeur.aller("dashboard");
  },
};
window.addEventListener("hashchange", Routeur.gerer);

  rendreNavBasse(){

    document.getElementById("navBasse").innerHTML = principaux.map(i => `<a href="#/${i.route}" class="item-nav-basse" data-route="${i.cle}">${icono(i.icone)}<span>${i.libelle}</span></a>`).join("")

  },
  ouvrirMenuPlus(items){
    document.getElementById("menuPlusOuvert")?.remove();
    const racine = document.createElement("div");
    racine.id = "menuPlusOuvert";
    racine.className = "menu-plus";
    racine.innerHTML = `<div class="feuille-menu-plus">

    racine.querySelectorAll("[data-route]").forEach(a => a.addEventListener("click", () => racine.remove()));

  },
  majNavigationActive(){
    document.querySelectorAll("[data-route]").forEach(el => el.classList.toggle("actif", el.dataset.route === Etat.ui.pageActuelle));
    const boutonPlus = document.getElementById("boutonMenuPlus");
    if (boutonPlus) boutonPlus.classList.toggle("actif", !NAV_ITEMS.find(i => i.mobilePrincipal && i.cle === Etat.ui.pageActuelle) && NAV_ITEMS.some(i => i.cle === Etat.ui.pageActuelle));
    const titreEl = document.getElementById("titrePageEntete");

    const cloche = document.querySelector('[data-action="notifications"]');

    const ordre = ["systeme", "clair", "sombre"];

    Coquille.rendreEntete();

  ouvrirMenuDeroulant(declencheur, contenuHtml){

    panneau.style.top = `${rect.bottom + 6}px`;
    panneau.style.right = `${Math.max(8, window.innerWidth - rect.right)}px`;

    Coquille.ouvrirMenuDeroulant(declencheur, `<div class="texte-xs texte-gras texte-2" style="padding:.4rem .7rem">NOTIFICATIONS</div>${html}`);
    notifs.filter(n => !n.lu).forEach(n => Store.modifier("notifications", n.id, { lu: true }));
    setTimeout(() => Coquille.majNavigationActive(), 300);

  },
  attacherEvenementsEntete(){},
};

const LIBELLES_STATUT = { rouge: "À apprendre", orange: "Fragile", jaune: "En cours", vert: "Bien maîtrisée", bleu: "Maîtrisée durablement" };
function badgeStatut(statut){ return `<span class="badge badge-${statut}"><span class="point-statut point-${statut}"></span>${LIBELLES_STATUT[statut]}</span>`; }
function barreProgressionHtml(pct, cls = ""){ return `<div class="barre-progression ${cls}"><span style="width:${Utils.clamp(pct,0,100)}%"></span></div>`; }
function anneauProgression(valeur, { taille = 64, epaisseur = 6, couleur = "var(--primaire)", libelle = null } = {}){
  const rayon = (taille - epaisseur) / 2, circonf = 2 * Math.PI * rayon;
  const decalage = circonf * (1 - Utils.clamp(valeur, 0, 100) / 100);
  return `<span class="anneau-progression" style="width:${taille}px;height:${taille}px">
    <svg width="${taille}" height="${taille}"><circle cx="${taille/2}" cy="${taille/2}" r="${rayon}" stroke="var(--bordure)" stroke-width="${epaisseur}"/>
      <circle cx="${taille/2}" cy="${taille/2}" r="${rayon}" stroke="${couleur}" stroke-width="${epaisseur}" stroke-dasharray="${circonf}" stroke-dashoffset="${decalage}" style="transition:stroke-dashoffset 500ms var(--easing)"/></svg>
    <span class="valeur" style="font-size:${taille*0.24}px">${libelle ?? Math.round(valeur)+"%"}</span></span>`;
}
function pastilleMatiereHtml(matiere, taille = 44){
  return `<span class="pastille-matiere" style="--couleur-accent:${matiere?.couleur || "var(--primaire)"};width:${taille}px;height:${taille}px">${icono(matiere?.icone || "livre")}</span>`;
}
function carteVide(icone, titre, description, actionHtml = ""){
  return `<div class="etat-vide">${icone ? icono(icone, "icone-lg") : ""}<h3>${Utils.echapperHtml(titre)}</h3><p>${Utils.echapperHtml(description)}</p>${actionHtml}</div>`;
}

      <h2 class="mb-sm">Mes matières</h2>
      <div class="grille-cartes">
        ${Etat.donnees.matieres.map(m => {
          const cours = Selecteurs.coursDeMatiere(m.id);

          const moyenne = notions.length ? Math.round(notions.reduce((s,n) => s+n.progression.maitriseActuelle,0)/notions.length) : 0;
          return `<a href="#/cours?matiere=${m.id}" class="carte carte-cliquable carte-matiere">${pastilleMatiereHtml(m)}<div class="flex-1"><div class="texte-semi">${Utils.echapperHtml(m.nom)}</div><div class="texte-2 texte-petit">${cours.length} cours</div></div>${anneauProgression(moyenne,{taille:40,epaisseur:4})}</a>`;
        }).join("") || `<p class="texte-2">Aucune matière pour l'instant.</p>`}
      </div>
    `;
    document.getElementById("suggestionAction").addEventListener("click", suggestion.action);
  },

  // §53 : une seule recommandation, priorisée — pas une liste de possibilités parmi
  // lesquelles choisir. Ordre de priorité : échéance proche > gros retard de révision >
  // notions fragiles > révisions dues > nouvelles notions à apprendre > tout est à jour.
  suggestionPrincipale({ notionsValidees, dues, fragiles }){
    const controleProche = [...Etat.donnees.controles].filter(c => new Date(c.date) >= new Date(Utils.versDateISO(new Date()))).sort((a,b) => new Date(a.date)-new Date(b.date))[0];
    const joursAvant = controleProche ? Math.ceil((new Date(controleProche.date) - new Date(Utils.versDateISO(new Date()))) / JOUR) : null;
    const nouvelles = notionsValidees.filter(n => n.progression.etapeIndex === 0);

    if (controleProche && joursAvant <= 5) return {
      icone: "drapeau", titre: `${controleProche.nom} dans ${joursAvant} jour${joursAvant>1?"s":""}`,
      description: controleProche.plan ? "Continue ton plan de révision pour être prêt(e) à temps." : "Prépare ta révision maintenant pour répartir l'effort avant le jour J.",
      libelle: controleProche.plan ? "Voir mon plan" : "Préparer ma révision",
      action: () => PageCalendrier.ouvrirDetailControle(controleProche),
    };
    if (dues.length >= 8) return {
      icone: "cerveau", titre: `${dues.length} révisions en retard`, description: "Un vrai retard s'est accumulé — mieux vaut le rattraper avant qu'il ne grossisse encore.",
      libelle: "Commencer mes révisions", action: () => PageSession.demarrer("reviser"),
    };
    if (fragiles.length >= 3) return {
      icone: "alerte_triangle", titre: `${fragiles.length} notions fragiles`, description: "Ce sont celles que tu risques le plus d'oublier — autant les retravailler maintenant.",
      libelle: "Travailler mes erreurs", action: () => Routeur.aller("erreurs"),
    };
    if (dues.length) return {
      icone: "cerveau", titre: `${dues.length} notion${dues.length>1?"s":""} à revoir aujourd'hui`, description: "Une petite session suffit pour rester à jour.",
      libelle: "Commencer mes révisions", action: () => PageSession.demarrer("reviser"),
    };
    if (nouvelles.length) return {
      icone: "livre_ouvert", titre: `${nouvelles.length} nouvelle${nouvelles.length>1?"s":""} notion${nouvelles.length>1?"s":""} à apprendre`, description: "Autant les découvrir avant qu'elles ne s'accumulent.",
      libelle: "Apprendre", action: () => PageSession.demarrerApprendre(),
    };
    return {
      icone: "coche_cercle", titre: "Tu es à jour !", description: "Rien d'urgent — profites-en pour renforcer une notion déjà maîtrisée ou créer une évaluation.",
      libelle: "Créer une évaluation", action: () => Routeur.aller("evaluations/nouvelle"),
    };
  },
};

async function extraireTexteFichier(fichier){
  const nom = fichier.name.toLowerCase();
  if (nom.endsWith(".txt") || fichier.type === "text/plain") return (await fichier.text()).trim();
  if (nom.endsWith(".pdf")) {
    const pdfjsLib = await import("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/6.3.289/pdf.worker.min.mjs";
    const buffer = await fichier.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
    let texte = "";
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const contenu = await page.getTextContent();
      texte += contenu.items.map(it => it.str).join(" ") + "\n\n";
    }
    return texte.trim();
  }
  if (nom.endsWith(".docx")) {
    await Utils.chargerScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.12.3/mammoth.browser.min.js");
    const buffer = await fichier.arrayBuffer();
    const resultat = await window.mammoth.extractRawText({ arrayBuffer: buffer });
    return resultat.value.trim();
  }
  throw new Error("Format non pris en charge. Utilise un fichier .txt, .pdf ou .docx.");
}

function ouvrirGestionMatieres(){
  const rendreListe = () => Etat.donnees.matieres.map(m => `
    <div class="flex items-centre gap-sm" style="padding:.5rem 0;border-bottom:1px solid var(--bordure)">
      ${pastilleMatiereHtml(m, 32)}
      <span class="flex-1 texte-semi">${Utils.echapperHtml(m.nom)}</span>
      <span class="texte-2 texte-petit">${Selecteurs.coursDeMatiere(m.id).length} cours</span>
      <button class="bouton-icone" data-editer-matiere="${m.id}" aria-label="Modifier">${icono("crayon","icone-sm")}</button>
      <button class="bouton-icone" data-suppr-matiere="${m.id}" aria-label="Supprimer">${icono("poubelle","icone-sm")}</button>
    </div>`).join("") || `<p class="texte-2 texte-petit">Aucune matière pour l'instant.</p>`;

  const doublons = (() => {
    const vus = new Set();
    let n = 0;
    for (const m of Etat.donnees.matieres) {
      const cle = Utils.normaliserTexte(m.nom);
      if (vus.has(cle)) n++; else vus.add(cle);
    }
    return n;
  })();

  const html = `
    <div class="entete-modale"><h3>Mes matières</h3><button class="bouton-icone" data-fermer>${icono("croix")}</button></div>
    ${doublons > 0 ? `<div class="carte mb-md" style="border-color:var(--attention)"><div class="flex items-centre justify-entre gap-sm flex-wrap">
      <span class="texte-petit">${doublons} matière${doublons>1?"s":""} en double détectée${doublons>1?"s":""}</span>
      <button class="bouton bouton-sm bouton-secondaire" data-fusionner>${icono("cible","icone-sm")} Fusionner les doublons</button>
    </div></div>` : ""}
    <div data-liste-matieres>${rendreListe()}</div>
    <button class="bouton bouton-secondaire bouton-large mt-md" data-nouvelle-matiere>${icono("plus","icone-sm")} Nouvelle matière</button>
    <div class="pied-modale"><button class="bouton bouton-fantome" data-fermer>Fermer</button></div>
  `;
  Modale.ouvrir(html);
  const modaleEl = Modale.pile[Modale.pile.length - 1].el;
  // Re-rend la page COURANTE (pas forcément "Mes cours" : ce gestionnaire de matières
  // s'ouvre aussi depuis "Nouveau cours" et "Cartes rapides" quand aucune matière
  // n'existe encore) — Routeur.gerer() rejoue simplement le handler de la route active.
  const rafraichir = () => { Modale.fermer(); ouvrirGestionMatieres(); };
  function attacherActions(){
    modaleEl.querySelectorAll("[data-fermer]").forEach(b => b.addEventListener("click", () => Modale.fermer()));
    modaleEl.querySelector("[data-fusionner]")?.addEventListener("click", async () => {
      const bouton = modaleEl.querySelector("[data-fusionner]");
      bouton.disabled = true; bouton.textContent = "Fusion en cours...";
      const n = await Store.fusionnerMatieresEnDouble();
      Toast.succes(`${n} matière${n>1?"s":""} en double fusionnée${n>1?"s":""}.`);
      rafraichir();
    });
    modaleEl.querySelector("[data-nouvelle-matiere]").onclick = () => {
      ouvrirFormulaire({
        titre: "Nouvelle matière",
        champs: [{ cle: "nom", label: "Nom", type: "texte", requis: true, placeholder: "Ex. Mathématiques" }, { cle: "couleur", label: "Couleur", type: "couleur" }],
        onValider: async (v) => {
          const nomNorm = Utils.normaliserTexte(v.nom);
          if (Etat.donnees.matieres.some(m => Utils.normaliserTexte(m.nom) === nomNorm)) {
            throw new Error(`« ${v.nom} » existe déjà — pas besoin d'en recréer une.`);
          }
          await Store.ajouter("matieres", { nom: v.nom, couleur: v.couleur, icone: "livre" });
          Toast.succes("Matière ajoutée.");
          rafraichir();
        },
      });
    };
    modaleEl.querySelectorAll("[data-editer-matiere]").forEach(b => b.onclick = () => {
      const m = Selecteurs.matiere(b.dataset.editerMatiere);
      ouvrirFormulaire({
        titre: "Modifier la matière", valeurs: m,
        champs: [{ cle: "nom", label: "Nom", type: "texte", requis: true }, { cle: "couleur", label: "Couleur", type: "couleur" }],
        onValider: async (v) => { await Store.modifier("matieres", m.id, v); rafraichir(); },
        onSupprimer: async () => { await Store.supprimerMatiere(m.id); rafraichir(); },
      });
    });
    modaleEl.querySelectorAll("[data-suppr-matiere]").forEach(b => b.onclick = async () => {
      const ok = await confirmerAction({ titre: "Supprimer cette matière ?", message: "Tous les cours et notions associés seront supprimés définitivement.", libelleConfirmer: "Supprimer", danger: true });
      if (ok) { await Store.supprimerMatiere(b.dataset.supprMatiere); rafraichir(); }
    });
  }
  attacherActions();
}

  za: { libelle: "Z → A", fn: (a,b) => b.titre.localeCompare(a.titre, "fr") },

      principal.innerHTML = carteVide("livre", "Crée d'abord une matière", "Une carte doit appartenir à une matière.", `<button class="bouton bouton-primaire mt-sm" data-gerer-matieres>${icono("plus","icone-sm")} Créer une matière</button>`);
      principal.querySelector("[data-gerer-matieres]").addEventListener("click", ouvrirGestionMatieres);
      return;
    }
    PageCartesRapides.fiches = [{ terme: "", definition: "" }];
    PageCartesRapides.selection = { matiereId: Etat.donnees.matieres[0].id, dossierId: NOUVEAU, chapitreId: NOUVEAU };
    PageCartesRapides.afficher();
  },

  afficher(){
    const principal = document.getElementById("contenu-principal");
    principal.innerHTML = `
      <div style="max-width:640px;margin:0 auto">
        <a href="#/cartes" class="texte-2 texte-petit flex items-centre gap-xs mb-md">${icono("fleche_gauche","icone-xs")} Retour</a>
        <h1 class="mb-sm">Cartes rapides</h1>
        <p class="texte-2 mb-lg">Pas besoin d'un cours entier : donne directement des termes et leurs définitions. Range-les dans un dossier et un chapitre existants pour t'entraîner plus tard sur toutes les définitions d'un coup, ou crée-en de nouveaux.</p>
        <div class="groupe-champ"><label>Matière</label><select class="champ" id="cr-matiere">${Etat.donnees.matieres.map(m => `<option value="${m.id}" ${PageCartesRapides.selection.matiereId===m.id?"selected":""}>${Utils.echapperHtml(m.nom)}</option>`).join("")}</select></div>
        <div id="crDossierConfig"></div>
        <div class="liste-fiches-rapides" id="crListe"></div>
        <button class="bouton bouton-secondaire bouton-large mt-md" id="cr-ajouter">${icono("plus","icone-sm")} Ajouter une autre carte</button>
        <div class="flex-col gap-sm mt-lg">
          <div class="flex gap-sm flex-wrap">
            <button class="bouton bouton-secondaire flex-1" id="cr-enregistrer">Enregistrer pour plus tard</button>
            <button class="bouton bouton-primaire flex-1" id="cr-apprendre">${icono("cerveau","icone-sm")} Créer et apprendre</button>
          </div>
          <button class="bouton bouton-fantome" data-action="aller" data-route="cartes">Annuler</button>
        </div>
      </div>`;
    PageCartesRapides.rendreDossierConfig();
    PageCartesRapides.rendreListe();
    document.getElementById("cr-matiere").addEventListener("change", (e) => {
      PageCartesRapides.selection.matiereId = e.target.value;
      PageCartesRapides.selection.dossierId = NOUVEAU;
      PageCartesRapides.selection.chapitreId = NOUVEAU;
      PageCartesRapides.rendreDossierConfig();
    });
    document.getElementById("cr-ajouter").addEventListener("click", () => {
      PageCartesRapides.fiches.push({ terme: "", definition: "" });
      PageCartesRapides.rendreListe();
    });
    document.getElementById("cr-enregistrer").addEventListener("click", () => PageCartesRapides.enregistrer(false));
    document.getElementById("cr-apprendre").addEventListener("click", () => PageCartesRapides.enregistrer(true));
  },

  // Dossier = un cours existant (pour cette matière) ou "+ Nouveau dossier" ; une fois
  // un dossier existant choisi, on propose pareil un chapitre existant ou "+ Nouveau
  // chapitre" — c'est ce qui permet d'accumuler plusieurs lots de cartes dans le même
  // dossier/chapitre au fil du temps, plutôt que de repartir de zéro à chaque fois.
  rendreDossierConfig(){
    const zone = document.getElementById("crDossierConfig");
    const { matiereId, dossierId, chapitreId } = PageCartesRapides.selection;
    const dossiers = Selecteurs.coursDeMatiere(matiereId);
    const dossierExiste = dossiers.some(c => c.id === dossierId);
    let html = `<div class="groupe-champ"><label>Dossier</label><select class="champ" id="cr-dossier">
      <option value="${NOUVEAU}">+ Nouveau dossier</option>
      ${dossiers.map(c => `<option value="${c.id}" ${dossierId===c.id?"selected":""}>${Utils.echapperHtml(c.titre)}</option>`).join("")}
    </select></div>`;
    if (!dossierExiste) {
      html += `<div class="groupe-champ"><label>Nom du dossier (facultatif)</label><input class="champ" type="text" id="cr-titre" placeholder="Ex. Vocabulaire d'anglais"></div>`;
    } else {
      const chapitres = Selecteurs.chapitresDeCours(dossierId);
      const chapitreExiste = chapitres.some(ch => ch.id === chapitreId);
      html += `<div class="groupe-champ"><label>Chapitre</label><select class="champ" id="cr-chapitre">
        <option value="${NOUVEAU}">+ Nouveau chapitre</option>
        ${chapitres.map(ch => `<option value="${ch.id}" ${chapitreId===ch.id?"selected":""}>${Utils.echapperHtml(ch.titre)}</option>`).join("")}
      </select></div>`;
      if (!chapitreExiste) {
        html += `<div class="groupe-champ"><label>Nom du chapitre (facultatif)</label><input class="champ" type="text" id="cr-chapitre-titre" placeholder="Ex. Chapitre 3"></div>`;
      }
    }
    zone.innerHTML = html;
    document.getElementById("cr-dossier").addEventListener("change", (e) => {
      PageCartesRapides.selection.dossierId = e.target.value;
      PageCartesRapides.selection.chapitreId = NOUVEAU;
      PageCartesRapides.rendreDossierConfig();
    });
    document.getElementById("cr-chapitre")?.addEventListener("change", (e) => {
      PageCartesRapides.selection.chapitreId = e.target.value;
      PageCartesRapides.rendreDossierConfig();
    });
  },

  rendreListe(){
    const zone = document.getElementById("crListe");
    zone.innerHTML = PageCartesRapides.fiches.map((f, i) => `
      <div class="fiche-rapide" data-fiche="${i}">
        ${PageCartesRapides.fiches.length > 1 ? `<button type="button" class="bouton-icone" data-retirer="${i}" aria-label="Retirer cette carte">${icono("croix","icone-sm")}</button>` : ""}
        <div class="groupe-champ"><label>Terme ${i+1}</label><input class="champ" type="text" data-terme="${i}" value="${Utils.echapperHtml(f.terme)}" placeholder="Ex. Photosynthèse"></div>
        <div class="groupe-champ" style="margin-bottom:0"><label>Définition</label><textarea class="champ" data-definition="${i}" style="min-height:80px" placeholder="Ex. Processus par lequel les plantes utilisent la lumière...">${Utils.echapperHtml(f.definition)}</textarea></div>
      </div>`).join("");
    zone.querySelectorAll("[data-terme]").forEach(el => el.addEventListener("input", () => { PageCartesRapides.fiches[el.dataset.terme].terme = el.value; }));
    zone.querySelectorAll("[data-definition]").forEach(el => el.addEventListener("input", () => { PageCartesRapides.fiches[el.dataset.definition].definition = el.value; }));
    zone.querySelectorAll("[data-retirer]").forEach(el => el.addEventListener("click", () => {
      PageCartesRapides.fiches.splice(Number(el.dataset.retirer), 1);
      PageCartesRapides.rendreListe();
    }));
  },

  async enregistrer(demarrerSession){
    const matiereId = document.getElementById("cr-matiere").value;
    const valides = PageCartesRapides.fiches.filter(f => f.terme.trim() && f.definition.trim());
    if (!valides.length) return Toast.erreur("Ajoute au moins un terme et sa définition.");

    let { dossierId, chapitreId } = PageCartesRapides.selection;
    let cours = Selecteurs.cours(dossierId);
    const nouveauContenu = valides.map(f => `${f.terme} : ${f.definition}`).join("\n\n");

    if (!cours) {
      const titreSaisi = document.getElementById("cr-titre")?.value.trim();
      const titre = titreSaisi || `Cartes rapides — ${Utils.formaterDateCourte(new Date())}`;
      cours = await Store.ajouter("cours", { titre, matiereId, contenu: nouveauContenu, favori: false, archive: false, origine: "rapide" });
    } else {
      // Un dossier existant reçoit un nouveau lot de cartes : on ajoute au contenu
      // affiché dans "Lire le cours" plutôt que de l'écraser.
      await Store.modifier("cours", cours.id, { contenu: `${cours.contenu}\n\n${nouveauContenu}` });
    }

    let chapitre = Selecteurs.chapitresDeCours(cours.id).find(ch => ch.id === chapitreId);
    if (!chapitre) {
      const titreChapitreSaisi = document.getElementById("cr-chapitre-titre")?.value.trim();
      const ordre = Selecteurs.chapitresDeCours(cours.id).length;
      chapitre = await Store.ajouter("chapitres", { coursId: cours.id, titre: titreChapitreSaisi || `Chapitre ${ordre + 1}`, ordre });
    }

    const notionsCreees = [];
    for (const f of valides) {
      const terme = f.terme.trim(), definition = f.definition.trim();
      const doc = await Store.ajouter("notions", {
        titre: terme, type: "vocabulaire",
        question: `Que signifie « ${terme} » ?`, reponse: definition,
        elements: Analyseur.extraireElements(definition), importance: 2, difficulte: 1,
        coursId: cours.id, matiereId, chapitreId: chapitre.id,
        statutValidation: "gardee", progression: Revision.progressionInitiale(),
      });
      notionsCreees.push(doc);
    }
    Toast.succes(`${notionsCreees.length} carte${notionsCreees.length>1?"s":""} ajoutée${notionsCreees.length>1?"s":""} à « ${cours.titre} ».`);
    if (demarrerSession) PageSession.demarrerApprendre({ notions: notionsCreees, coursId: cours.id });
    else Routeur.aller(`cartes/${cours.id}`);
  },
};

/* ==================== G3. PAGE D'UN COURS ==================== */

function decouperChapitres(contenu){
  const lignes = contenu.split("\n");
  const motifTitre = /^#{1,3}\s+(.+)$/;
  const chapitres = [];
  let courant = { titre: "Cours entier", texte: "" };
  for (const ligne of lignes) {
    const m = ligne.match(motifTitre);
    if (m) { if (courant.texte.trim()) chapitres.push(courant); courant = { titre: m[1].trim(), texte: "" }; }
    else courant.texte += ligne + "\n";
  }
  if (courant.texte.trim()) chapitres.push(courant);
  if (chapitres.length <= 1) return [{ titre: "Cours entier", texte: contenu }];
  return chapitres;
}
function trouverChapitrePourNotion(chapitresCrees, notionCandidate){
  for (const ch of chapitresCrees) {
    if (Utils.normaliserTexte(ch.texte).includes(Utils.normaliserTexte(notionCandidate.reponse).slice(0, 30))) return ch.id;
  }
  return chapitresCrees[0]?.id;
}

const PageCoursDetail = {
  onglet: "apercu",
  async analyserCours(cours){
    const principal = document.getElementById("contenu-principal");
    const messages = ["Analyse de ton cours...", "Recherche des notions importantes...", "Création des exercices...", "Préparation de ton programme de révision..."];
    principal.innerHTML = `<div class="etat-vide">${icono("cerveau","icone-lg")}<h3 id="msgAnalyse">${messages[0]}</h3><div class="squelette" style="height:8px;width:220px;border-radius:99px;margin:.5rem auto 0"></div></div>`;
    for (let i = 1; i < messages.length; i++) {
      await new Promise(r => setTimeout(r, 380));
      const el = document.getElementById("msgAnalyse");
      if (el) el.textContent = messages[i];
    }
    await new Promise(r => setTimeout(r, 250));

    const decoupage = decouperChapitres(cours.contenu);
    const chapitresCrees = [];
    for (const [i, ch] of decoupage.entries()) {
      const doc = await Store.ajouter("chapitres", { coursId: cours.id, titre: ch.titre, ordre: i });
      chapitresCrees.push({ ...doc, texte: ch.texte });
    }
    const candidats = Analyseur.analyser(cours.contenu);

      Toast.erreur("Aucune notion claire n'a pu être détectée. Essaie un cours un peu plus détaillé.");
      Routeur.aller(`cours/${cours.id}`);
      return;
    }
    for (const c of candidats) {
      const chapitreId = trouverChapitrePourNotion(chapitresCrees, c);
      await Store.ajouter("notions", { ...c, coursId: cours.id, matiereId: cours.matiereId, chapitreId });
    }

        <button class="bouton bouton-primaire" data-action="aller" data-route="cours/${cours.id}/valider">Valider les notions</button>
